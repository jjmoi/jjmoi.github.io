<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>PML Soundbranding</title>
	<style>
		body {max-width: 720px; margin: 40px auto; padding: 0 16px;}
		h1, h2, p {font-family: sans-serif;}
		h1 {font-size: 24px; margin: 64px auto;}
		.track {margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid #ddd;}
		.label {font-weight: 600; margin-bottom: 8px;}
		audio {width: 100%;}
		hr {height: 1px; border: 0; border-top: 2px solid gray; margin: 6em auto;}
	</style>
</head>
<body>
	<h1>PML Soundbranding</h1>

	<h2>Round 2</h2>

	<div class="track">
		<p class="label">Track 1</p>
		<audio controls preload="none">
			<source src="a1.wav" type="audio/wav" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 2</p>
		<audio controls preload="none">
			<source src="a2.wav" type="audio/wav" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 3</p>
		<audio controls preload="none">
			<source src="a3.wav" type="audio/wav" />
		</audio>
	</div>

	<hr>

	<h2>Round 1</h2>

	<div class="track">
		<p class="label">Track 1</p>
		<audio controls preload="none">
			<source src="a1.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 2 ✅</p>
		<audio controls preload="none">
			<source src="a2.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 3</p>
		<audio controls preload="none">
			<source src="e2.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 4</p>
		<audio controls preload="none">
			<source src="j2.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 5 ✅</p>
		<audio controls preload="none">
			<source src="s1.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 6</p>
		<audio controls preload="none">
			<source src="s2.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 7</p>
		<audio controls preload="none">
			<source src="t1.mp3" type="audio/mpeg" />
		</audio>
	</div>

	<div class="track">
		<p class="label">Track 8</p>
		<audio controls preload="none">
			<source src="t2.mp3" type="audio/mpeg" />
		</audio>
	</div>

</body>
</html>
