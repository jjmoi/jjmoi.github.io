<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Flicker Reel</title>
<style>
  /* Layout: one image pinned to the viewport, nothing else on the page. */
  :root { --bg: #000; --fg: #fff; color-scheme: dark; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; }
  .frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: cover;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
  }
  [hidden] { display: none !important; }
</style>

<img class="frame" id="frame-a" alt="" draggable="false">
<img class="frame" id="frame-b" alt="" hidden draggable="false">

<script>
(() => {
  const BASE = '';
  const INTERVAL = 789;
  const FILES = [
    'primemovers/primemovers-99.webp',
    'branding/brand-14.webp',
    'primemovers/primemovers-27.webp',
    'primemovers/primemovers-21.webp',
    'primemovers/primemovers-23.webp',
    'primemovers/primemovers-36.webp',
    'branding/brand-01.webp',
    'branding/brand-02.webp',
    'cerebras/cerebras-02.webp',
    'cerebras/cerebras-03.webp',
    'cerebras/cerebras-09.webp',
    'cerebras/cerebras-08.webp',
    'cerebras/cerebras-13.webp',
    'cerebras/cerebras-15.webp',
    'cerebras/cerebras-16.webp',
    'cerebras/cerebras-19.webp',
    'cerebras/cerebras-99.webp',
    'lumi/lumi-02.webp',
    'lumi/lumi-99.webp',
    'lumi/lumi-04.webp',
    'lumi/lumi-05.webp',
    'intersection/intersection-02.webp',
    'intersection/intersection-11.webp',
    'intersection/intersection-12.webp',
    'intersection/intersection-13.webp',
    'spring/spring-99.webp',
    'spring/spring-01.webp',
    'spring/spring-06.webp',
    'spring/spring-08.webp',
    'spring/spring-02.webp',
    'spring/spring-04.webp',
    'branding/brand-05.webp',
    'branding/brand-06.webp',
    'branding/brand-07.webp',
    'branding/brand-20.webp',
    'opengov/opengov-05.webp',
    'opengov/opengov-07.webp',
    'opengov/opengov-15.webp',
    'opengov/opengov-99.webp',
    'branding/brand-12.webp',
    'branding/brand-18.webp',
    'branding/brand-22.webp',
    'branding/brand-09.webp',
    'branding/brand-19.webp',
    'play/img/another-studio.webp',
    'play/img/arcadia.webp',
    'play/img/daisy.webp',
    'play/img/dianounce.webp',
    'play/img/pixies.webp',
    'play/img/strand.webp',
    'play/img/sky.webp',
    'play/img/strand.webp',
    'primemovers/primemovers-39.webp',
    'primemovers/primemovers-34.webp',
    'primemovers/primemovers-41b.webp',
    'primemovers/primemovers-44b.webp',
    'primemovers/primemovers-25.webp',
    'primemovers/primemovers-26.webp',
    'primemovers/primemovers-37.webp',
    'primemovers/primemovers-28.webp',
    'usds18f/usds18f-05.webp',
    'usds18f/usds18f-07.webp',
    'usds18f/usds18f-16.webp',
    'usds18f/usds18f-17.webp',
    'usds18f/usds18f-19.webp',
    'usds18f/usds18f-25.webp',
    'usds18f/usds18f-26.webp',
    'usds18f/usds18f-09.webp',
    'usds18f/usds18f-29.webp',
    'usds18f/usds18f-30.webp',
    'tachyus/tachyus-09.webp',
    'tachyus/tachyus-11.webp',
    'tachyus/tachyus-12.webp',
    'tachyus/tachyus-13.webp',
    'tachyus/tachyus-14.webp',
    'tachyus/tachyus-15.webp',
    'tachyus/tachyus-16.webp',
    'tachyus/tachyus-26.webp',
    'tachyus/tachyus-19.webp',
    'tachyus/tachyus-25.webp',
    'tachyus/tachyus-99.webp',
    'rtx/rtx-01.webp',
    'rtx/rtx-02.webp',
    'rtx/rtx-99.webp',
    'rtx/rtx-03.webp',
    'primemovers/primemovers-32.webp'
  ];

  // Fresh random order every load. The first entry is the random opener;
  // the rest follow without repeats, then the same order loops.
  const urls = FILES.map(f => BASE + f);
  for (let i = urls.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [urls[i], urls[j]] = [urls[j], urls[i]];
  }

  // Two stacked layers: the next image is decoded on the hidden layer,
  // then the layers swap. No blank frame, no transition.
  const layers = [document.getElementById('frame-a'), document.getElementById('frame-b')];
  let front = 0;
  let idx = 0;
  let busy = false;

  async function show(url) {
    const back = layers[1 - front];
    back.src = url;
    if (back.decode) { try { await back.decode(); } catch (e) {} }
    back.hidden = false;
    layers[front].hidden = true;
    front = 1 - front;
  }

  // Warm every image into cache, in play order. Each entry resolves to
  // true once that image is decoded, or false if it failed to load.
  const ready = urls.map(u => new Promise(resolve => {
    const im = new Image();
    im.onload = () => {
      if (im.decode) im.decode().then(() => resolve(true), () => resolve(true));
      else resolve(true);
    };
    im.onerror = () => resolve(false);
    im.src = u;
  }));

  // Advance to the next image, waiting on it only if it is not in yet.
  // Images that failed to load are skipped.
  async function tick() {
    if (busy) return;
    busy = true;
    for (let tries = 0; tries < urls.length; tries++) {
      idx = (idx + 1) % urls.length;
      if (await ready[idx]) { await show(urls[idx]); break; }
    }
    busy = false;
  }

  // Show the opener as soon as it arrives, and start the clock as soon
  // as the second image is ready rather than waiting for the whole set.
  show(urls[0]);
  Promise.all([ready[0], ready[1]]).then(() => setInterval(tick, INTERVAL));
})();
</script>

</body></html>
