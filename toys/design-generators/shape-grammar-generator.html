<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG SHAPE GRAMMAR</title><style>
:root{font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;color:#000;background:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000}body{overflow:hidden;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase;color:#000}button{background:#fff;border:0;cursor:pointer;padding:11px 14px}button:hover{background:#f2f2f2}
.app{height:100vh;display:grid;grid-template-columns:292px 1fr}.panel{overflow:auto;padding:20px 18px 88px;border-right:1px solid #000;background:#fff}.brand{font-size:17px;line-height:1;margin-bottom:24px;letter-spacing:-.02em}.section{padding:15px 0;border-top:1px solid #000}.section:first-of-type{border-top:0;padding-top:0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px}.val{font-variant-numeric:tabular-nums}.control{margin:0 0 14px}.control:last-child{margin-bottom:0}
input[type=text],textarea,select{width:100%;border:0;border-bottom:1px solid #000;background:transparent;padding:8px 0;outline:none;border-radius:0}textarea{resize:vertical;min-height:58px}select{appearance:none}
input[type=range]{width:100%;appearance:none;height:16px;background:transparent;margin:0;padding:0}input[type=range]::-webkit-slider-runnable-track{height:1px;background:#000}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#000;margin-top:-5.5px}input[type=color]{width:34px;height:24px;border:0;padding:0;background:transparent;vertical-align:middle}input[type=file]{width:100%;font-size:11px}
.stage{position:relative;min-width:0;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px 24px 76px;overflow:auto}.canvaswrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.actions{position:fixed;left:calc(292px + 24px);right:24px;bottom:18px;display:flex;justify-content:center;gap:4px;z-index:20;pointer-events:none}.actions .group{background:#fff;display:flex;gap:2px;padding:4px;pointer-events:auto}.actions button{min-width:110px}
.tiny{font-size:10px;line-height:1.35;color:#444}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:#000}
@media(max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:260px 1fr}.panel{border-right:0;border-bottom:1px solid #000;padding-bottom:16px}.actions{left:12px;right:12px;bottom:12px}.stage{padding:14px 14px 68px}.canvaswrap canvas{max-height:none}}
</style></head><body>
<div class="app"><aside class="panel"><div class="brand">CG SHAPE GRAMMAR</div>
<section class="section">
<div class="control"><div class="labelrow"><span>Grammar</span></div><select id="grammar"><option>Recursive</option><option>Radial</option><option>Chain</option><option>Stack</option><option>Fold</option></select></div>
<div class="control"><div class="labelrow"><span>Family Size</span><span id="familyVal"></span></div><input id="family" type="range" min="4" max="12" value="6"></div>
<div class="control"><div class="labelrow"><span>Complexity</span><span id="complexityVal"></span></div><input id="complexity" type="range" min="2" max="14" value="8"></div>
<div class="control"><div class="labelrow"><span>Symmetry</span><span id="symmetryVal"></span></div><input id="symmetry" type="range" min="0" max="100" value="45"></div>
<div class="control"><div class="labelrow"><span>Stroke Weight</span><span id="weightVal"></span></div><input id="weight" type="range" min="1" max="18" value="5"></div>
<div class="control check"><input id="fill" type="checkbox"><label for="fill">Filled Forms</label></div>
</section>
<section class="section row2"><div class="control"><div class="labelrow"><span>Background</span></div><input id="bg" type="color" value="#f4f1e9"></div><div class="control"><div class="labelrow"><span>Ink</span></div><input id="ink" type="color" value="#111111"></div></section>
</aside><main class="stage"><div class="canvaswrap"><canvas id="c" width="1200" height="1200"></canvas></div></main></div>
<div class="actions"><div class="group"><button id="randomize">Randomize</button><button id="nudge">Nudge</button><button id="export">Export PNG</button></div></div>
<script>
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function downloadCanvas(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function qs(id){return document.getElementById(id)}
function bindRange(id,cb){const e=qs(id),v=qs(id+'Val');const f=()=>{if(v)v.textContent=e.value;cb&&cb()};e.addEventListener('input',f);f()}
function debounce(fn,ms=40){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
function noiseGrain(ctx,w,h,amount,rng){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<w*h/180;i++){const v=rng()<.5?0:255;ctx.fillStyle=`rgb(${v},${v},${v})`;const s=rng()*2+.5;ctx.fillRect(rng()*w,rng()*h,s,s)}ctx.restore()}
function safeUpper(s){return String(s||'').toUpperCase()}


const canvas=qs('c'),ctx=canvas.getContext('2d');let seed=6006;
function poly(cx,cy,r,n,rot){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i*Math.PI*2/n,x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function member(cx,cy,size,variant){const rng=mulberry32(seed+variant*101),g=qs('grammar').value.toLowerCase(),C=+qs('complexity').value,S=+qs('symmetry').value/100;ctx.save();ctx.translate(cx,cy);ctx.strokeStyle=qs('ink').value;ctx.fillStyle=qs('ink').value;ctx.lineWidth=+qs('weight').value;ctx.lineJoin='round';ctx.lineCap='round';const paint=()=>qs('fill').checked?ctx.fill():ctx.stroke();if(g==='radial'){const arms=Math.max(3,Math.round(3+C*S*.7));for(let i=0;i<arms;i++){ctx.save();ctx.rotate(i*Math.PI*2/arms+variant*.05);ctx.beginPath();ctx.moveTo(size*.12,0);ctx.lineTo(size*(.45+rng()*.25),-size*.08);ctx.lineTo(size*(.22+rng()*.25),size*.14);ctx.closePath();paint();ctx.restore()}poly(0,0,size*.18,3+(variant%4),variant*.13);paint()}else if(g==='chain'){let x=-size*.55,y=0;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<C;i++){x+=size*1.1/C;y=(i%2?1:-1)*size*(.08+rng()*.17);ctx.lineTo(x,y)}ctx.stroke();for(let i=0;i<Math.min(C,8);i++){const xx=-size*.45+i*size*.9/Math.min(C,8);poly(xx,(i%2?1:-1)*size*.12,size*(.06+.035*(i%3)),3+(i+variant)%5,variant*.1);paint()}}else if(g==='stack'){for(let i=0;i<C;i++){ctx.save();ctx.translate((i-C/2)*size*.045,(i-C/2)*size*.045);ctx.rotate((i-C/2)*.045*(1-S)+variant*.015);poly(0,0,size*(.52-i*.022),3+(variant+i)%5,.3+i*.06);paint();ctx.restore()}}else if(g==='fold'){for(let i=0;i<C;i++){const a=-Math.PI*.7+i*Math.PI*1.4/(C-1||1),r=size*(.18+i*.035);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a+.42)*r*.8,Math.sin(a+.42)*r*.8);paint()}}else{function rec(x,y,r,d,rot){if(d<=0||r<7)return;poly(x,y,r,3+((variant+d)%4),rot);paint();const kids=S>.62?2:3;for(let k=0;k<kids;k++){const a=rot+k*Math.PI*2/kids+(rng()-.5)*(1-S);rec(x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.52,d-1,a*.5)}}rec(0,0,size*.42,Math.min(4,2+Math.floor(C/4)),variant*.11)}ctx.restore()}
function render(){const w=canvas.width,h=canvas.height;ctx.fillStyle=qs('bg').value;ctx.fillRect(0,0,w,h);const F=+qs('family').value,cols=Math.ceil(Math.sqrt(F)),rows=Math.ceil(F/cols),cellW=w/cols,cellH=h/rows;for(let i=0;i<F;i++){member((i%cols+.5)*cellW,(Math.floor(i/cols)+.5)*cellH,Math.min(cellW,cellH)*.72,i)}ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=1;for(let c=1;c<cols;c++){ctx.beginPath();ctx.moveTo(c*cellW,0);ctx.lineTo(c*cellW,h);ctx.stroke()}for(let r=1;r<rows;r++){ctx.beginPath();ctx.moveTo(0,r*cellH);ctx.lineTo(w,r*cellH);ctx.stroke()}}
['grammar','bg','ink','fill'].forEach(id=>qs(id).addEventListener('input',render));['family','complexity','symmetry','weight'].forEach(id=>bindRange(id,render));qs('randomize').onclick=()=>{seed=Math.floor(Math.random()*1e9);qs('grammar').selectedIndex=Math.floor(Math.random()*5);render()};qs('nudge').onclick=()=>{seed++;render()};qs('export').onclick=()=>downloadCanvas(canvas,'shape-family.png');render();
</script></body></html>
