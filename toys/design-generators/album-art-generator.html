<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG ALBUM ART</title><style>
:root{font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;color:#000;background:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000}body{overflow:hidden;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase;color:#000}button{background:#fff;border:0;cursor:pointer;padding:11px 14px}button:hover{background:#f2f2f2}
.app{height:100vh;display:grid;grid-template-columns:292px 1fr}.panel{overflow:auto;padding:20px 18px 88px;border-right:1px solid #000;background:#fff}.brand{font-size:17px;line-height:1;margin-bottom:24px;letter-spacing:-.02em}.section{padding:15px 0;border-top:1px solid #000}.section:first-of-type{border-top:0;padding-top:0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px}.val{font-variant-numeric:tabular-nums}.control{margin:0 0 14px}.control:last-child{margin-bottom:0}
input[type=text],textarea,select{width:100%;border:0;border-bottom:1px solid #000;background:transparent;padding:8px 0;outline:none;border-radius:0}textarea{resize:vertical;min-height:58px}select{appearance:none}
input[type=range]{width:100%;appearance:none;height:16px;background:transparent;margin:0;padding:0}input[type=range]::-webkit-slider-runnable-track{height:1px;background:#000}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#000;margin-top:-5.5px}input[type=color]{width:34px;height:24px;border:0;padding:0;background:transparent;vertical-align:middle}input[type=file]{width:100%;font-size:11px}
.stage{position:relative;min-width:0;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px 24px 76px;overflow:auto}.canvaswrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.actions{position:fixed;left:calc(292px + 24px);right:24px;bottom:18px;display:flex;justify-content:center;gap:4px;z-index:20;pointer-events:none}.actions .group{background:#fff;display:flex;gap:2px;padding:4px;pointer-events:auto}.actions button{min-width:110px}
.tiny{font-size:10px;line-height:1.35;color:#444}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:#000}
@media(max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:260px 1fr}.panel{border-right:0;border-bottom:1px solid #000;padding-bottom:16px}.actions{left:12px;right:12px;bottom:12px}.stage{padding:14px 14px 68px}.canvaswrap canvas{max-height:none}}
</style></head><body>
<div class="app"><aside class="panel"><div class="brand">CG ALBUM ART</div>
<section class="section">
<div class="control"><div class="labelrow"><span>Image</span></div><input id="imageUpload" type="file" accept="image/*"></div>
<div class="control"><div class="labelrow"><span>Title</span></div><input id="title" type="text" value="NEON MEMORY"></div>
<div class="control"><div class="labelrow"><span>Artist</span></div><input id="artist" type="text" value="CG STUDIES"></div>
<div class="control"><div class="labelrow"><span>Metadata</span></div><input id="meta" type="text" value="2026 / STEREO / 33⅓ RPM"></div>
</section>
<section class="section">
<div class="control"><div class="labelrow"><span>Layout</span></div><select id="layout"><option>Edge</option><option>Center</option><option>Stack</option><option>Grid</option></select></div>
<div class="control"><div class="labelrow"><span>Type Scale</span><span id="typeScaleVal"></span></div><input id="typeScale" type="range" min="55" max="190" value="122"></div>
<div class="control"><div class="labelrow"><span>Tracking</span><span id="trackingVal"></span></div><input id="tracking" type="range" min="-12" max="40" value="3"></div>
<div class="control"><div class="labelrow"><span>Texture</span><span id="textureVal"></span></div><input id="texture" type="range" min="0" max="40" value="16"></div>
<div class="control"><div class="labelrow"><span>Image Contrast</span><span id="contrastVal"></span></div><input id="contrast" type="range" min="60" max="180" value="118"></div>
</section>
<section class="section row2">
<div class="control"><div class="labelrow"><span>Ink</span></div><input id="ink" type="color" value="#f7f3e8"></div>
<div class="control"><div class="labelrow"><span>Accent</span></div><input id="accent" type="color" value="#ff3b30"></div>
</section>
</aside><main class="stage"><div class="canvaswrap"><canvas id="c" width="1200" height="1200"></canvas></div></main></div>
<div class="actions"><div class="group"><button id="randomize">Randomize</button><button id="nudge">Nudge</button><button id="export">Export PNG</button></div></div>
<script>
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function downloadCanvas(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function qs(id){return document.getElementById(id)}
function bindRange(id,cb){const e=qs(id),v=qs(id+'Val');const f=()=>{if(v)v.textContent=e.value;cb&&cb()};e.addEventListener('input',f);f()}
function debounce(fn,ms=40){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
function noiseGrain(ctx,w,h,amount,rng){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<w*h/180;i++){const v=rng()<.5?0:255;ctx.fillStyle=`rgb(${v},${v},${v})`;const s=rng()*2+.5;ctx.fillRect(rng()*w,rng()*h,s,s)}ctx.restore()}
function safeUpper(s){return String(s||'').toUpperCase()}


const canvas=qs('c'),ctx=canvas.getContext('2d');let seed=1729,img=null;
function drawLetterspaced(text,x,y,size,tracking,align='left',color='#fff'){ctx.font=`600 ${size}px Helvetica,Arial,sans-serif`;ctx.fillStyle=color;ctx.textBaseline='alphabetic';const chars=[...text];const widths=chars.map(ch=>ctx.measureText(ch).width);const total=widths.reduce((a,b)=>a+b,0)+tracking*(chars.length-1);let sx=x;if(align==='center')sx=x-total/2;if(align==='right')sx=x-total;for(let i=0;i<chars.length;i++){ctx.fillText(chars[i],sx,y);sx+=widths[i]+tracking}}
function baseImage(rng){const w=canvas.width,h=canvas.height;if(img){ctx.save();ctx.filter=`contrast(${qs('contrast').value}%) saturate(88%)`;const s=Math.max(w/img.width,h/img.height),dw=img.width*s,dh=img.height*s;ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);ctx.restore()}else{ctx.fillStyle='#111';ctx.fillRect(0,0,w,h);for(let i=0;i<9;i++){const x=rng()*w,y=rng()*h,r=(.18+rng()*.42)*w;const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,i%3===0?qs('accent').value:mixHex('#121212',qs('accent').value,rng()*.55));g.addColorStop(1,'rgba(0,0,0,0)');ctx.globalAlpha=.38+rng()*.3;ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}ctx.globalAlpha=1;}}
function render(){const rng=mulberry32(seed);baseImage(rng);const w=canvas.width,h=canvas.height;const ink=qs('ink').value,accent=qs('accent').value,title=safeUpper(qs('title').value),artist=safeUpper(qs('artist').value),meta=safeUpper(qs('meta').value);const s=+qs('typeScale').value,tr=+qs('tracking').value;const layout=qs('layout').value.toLowerCase();ctx.save();ctx.globalCompositeOperation='source-over';if(layout==='edge'){drawLetterspaced(title,70,150,s,tr,'left',ink);drawLetterspaced(artist,w-70,h-96,31,5,'right',ink);drawLetterspaced(meta,74,h-42,19,4,'left',ink);ctx.fillStyle=accent;ctx.fillRect(w-105,54,50,8)}else if(layout==='center'){ctx.fillStyle='rgba(0,0,0,.33)';ctx.fillRect(0,h*.32,w,h*.34);drawLetterspaced(title,w/2,h*.53,s,tr,'center',ink);drawLetterspaced(artist,w/2,h*.61,30,5,'center',ink);drawLetterspaced(meta,w/2,h*.68,17,4,'center',ink)}else if(layout==='stack'){let y=105;const words=title.split(/\s+/);words.forEach((word,i)=>{drawLetterspaced(word,66,y+i*s*.78,s,tr,'left',i%2?accent:ink)});drawLetterspaced(artist,70,h-85,29,4,'left',ink);drawLetterspaced(meta,w-65,h-43,17,4,'right',ink)}else{ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1;for(let i=1;i<4;i++){ctx.beginPath();ctx.moveTo(w*i/4,0);ctx.lineTo(w*i/4,h);ctx.stroke();ctx.beginPath();ctx.moveTo(0,h*i/4);ctx.lineTo(w,h*i/4);ctx.stroke()}drawLetterspaced(title,58,h*.49,s,tr,'left',ink);ctx.fillStyle=accent;ctx.fillRect(58,h*.54,w*.27,18);drawLetterspaced(artist,w-58,90,29,4,'right',ink);drawLetterspaced(meta,w-58,h-55,17,4,'right',ink)}ctx.restore();noiseGrain(ctx,w,h,+qs('texture').value/100,rng);}
['title','artist','meta','layout','ink','accent'].forEach(id=>qs(id).addEventListener('input',render));['typeScale','tracking','texture','contrast'].forEach(id=>bindRange(id,render));qs('imageUpload').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{img=im;render()};im.src=URL.createObjectURL(f)});qs('randomize').onclick=()=>{seed=Math.floor(Math.random()*1e9);qs('layout').selectedIndex=Math.floor(Math.random()*4);render()};qs('nudge').onclick=()=>{seed+=1;render()};qs('export').onclick=()=>downloadCanvas(canvas,'album-art.png');render();
</script></body></html>
