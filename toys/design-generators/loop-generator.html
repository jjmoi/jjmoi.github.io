<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG LOOP GENERATOR</title><style>
:root{font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;color:#000;background:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000}body{overflow:hidden;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase;color:#000}button{background:#fff;border:0;cursor:pointer;padding:11px 14px}button:hover{background:#f2f2f2}
.app{height:100vh;display:grid;grid-template-columns:292px 1fr}.panel{overflow:auto;padding:20px 18px 88px;border-right:1px solid #000;background:#fff}.brand{font-size:17px;line-height:1;margin-bottom:24px;letter-spacing:-.02em}.section{padding:15px 0;border-top:1px solid #000}.section:first-of-type{border-top:0;padding-top:0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px}.val{font-variant-numeric:tabular-nums}.control{margin:0 0 14px}.control:last-child{margin-bottom:0}
input[type=text],textarea,select{width:100%;border:0;border-bottom:1px solid #000;background:transparent;padding:8px 0;outline:none;border-radius:0}textarea{resize:vertical;min-height:58px}select{appearance:none}
input[type=range]{width:100%;appearance:none;height:16px;background:transparent;margin:0;padding:0}input[type=range]::-webkit-slider-runnable-track{height:1px;background:#000}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#000;margin-top:-5.5px}input[type=color]{width:34px;height:24px;border:0;padding:0;background:transparent;vertical-align:middle}input[type=file]{width:100%;font-size:11px}
.stage{position:relative;min-width:0;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px 24px 76px;overflow:auto}.canvaswrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.actions{position:fixed;left:calc(292px + 24px);right:24px;bottom:18px;display:flex;justify-content:center;gap:4px;z-index:20;pointer-events:none}.actions .group{background:#fff;display:flex;gap:2px;padding:4px;pointer-events:auto}.actions button{min-width:110px}
.tiny{font-size:10px;line-height:1.35;color:#444}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:#000}
@media(max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:260px 1fr}.panel{border-right:0;border-bottom:1px solid #000;padding-bottom:16px}.actions{left:12px;right:12px;bottom:12px}.stage{padding:14px 14px 68px}.canvaswrap canvas{max-height:none}}
</style></head><body>
<div class="app"><aside class="panel"><div class="brand">CG LOOP GENERATOR</div>
<section class="section">
<div class="control"><div class="labelrow"><span>Text</span></div><input id="text" type="text" value="MOTION / FORM"></div>
<div class="control"><div class="labelrow"><span>Mode</span></div><select id="mode"><option>Orbit</option><option>Kinetic</option><option>Rotor</option><option>Pulse</option><option>Wipe</option></select></div>
<div class="control"><div class="labelrow"><span>Speed</span><span id="speedVal"></span></div><input id="speed" type="range" min="10" max="140" value="58"></div>
<div class="control"><div class="labelrow"><span>Density</span><span id="densityVal"></span></div><input id="density" type="range" min="2" max="24" value="9"></div>
<div class="control"><div class="labelrow"><span>Scale</span><span id="scaleVal"></span></div><input id="scale" type="range" min="30" max="180" value="96"></div>
<div class="control"><div class="labelrow"><span>Duration Sec</span><span id="durationVal"></span></div><input id="duration" type="range" min="2" max="10" value="5"></div>
</section>
<section class="section row2">
<div class="control"><div class="labelrow"><span>Background</span></div><input id="bg" type="color" value="#f2f0e8"></div>
<div class="control"><div class="labelrow"><span>Ink</span></div><input id="ink" type="color" value="#111111"></div>
</section>
</aside><main class="stage"><div class="canvaswrap"><canvas id="c" width="1200" height="1200"></canvas></div></main></div>
<div class="actions"><div class="group"><button id="randomize">Randomize</button><button id="nudge">Nudge</button><button id="record">Record WebM</button><button id="export">Export PNG</button></div></div>
<script>
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function downloadCanvas(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function qs(id){return document.getElementById(id)}
function bindRange(id,cb){const e=qs(id),v=qs(id+'Val');const f=()=>{if(v)v.textContent=e.value;cb&&cb()};e.addEventListener('input',f);f()}
function debounce(fn,ms=40){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
function noiseGrain(ctx,w,h,amount,rng){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<w*h/180;i++){const v=rng()<.5?0:255;ctx.fillStyle=`rgb(${v},${v},${v})`;const s=rng()*2+.5;ctx.fillRect(rng()*w,rng()*h,s,s)}ctx.restore()}
function safeUpper(s){return String(s||'').toUpperCase()}


const canvas=qs('c'),ctx=canvas.getContext('2d');let seed=3301,start=performance.now(),raf,recording=false;
function draw(t){const w=canvas.width,h=canvas.height,rng=mulberry32(seed);ctx.fillStyle=qs('bg').value;ctx.fillRect(0,0,w,h);const mode=qs('mode').value.toLowerCase(),N=+qs('density').value,scale=+qs('scale').value,speed=+qs('speed').value/100;const ink=qs('ink').value,text=safeUpper(qs('text').value);const tt=t*speed;ctx.fillStyle=ink;ctx.strokeStyle=ink;ctx.lineWidth=6;
if(mode==='orbit'){for(let i=0;i<N;i++){const a=tt*.001+i*Math.PI*2/N;const rr=230+90*Math.sin(tt*.0007+i);const x=w/2+Math.cos(a)*rr,y=h/2+Math.sin(a)*rr;ctx.save();ctx.translate(x,y);ctx.rotate(a+Math.PI/2);ctx.font=`600 ${scale}px Helvetica`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text.split('/')[i%2]||text,0,0);ctx.restore()}ctx.beginPath();ctx.arc(w/2,h/2,175+35*Math.sin(tt*.0014),0,Math.PI*2);ctx.stroke()}else if(mode==='kinetic'){for(let i=0;i<N;i++){const p=i/N;const y=h*(.12+p*.78);const x=w/2+Math.sin(tt*.0016+i*.9)*w*.22;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(tt*.001+i)*.22);ctx.font=`600 ${scale*(1.3-p*.5)}px Helvetica`;ctx.textAlign='center';ctx.fillText(text,0,0);ctx.restore()}}else if(mode==='rotor'){ctx.translate(w/2,h/2);for(let i=0;i<N;i++){ctx.save();ctx.rotate(tt*.0009*(i%2?1:-1)+i*Math.PI*2/N);ctx.fillRect(90+i*7,-8,250,16);ctx.font=`600 ${scale*.55}px Helvetica`;ctx.textAlign='left';ctx.fillText(text,360,18);ctx.restore()}}else if(mode==='pulse'){for(let i=0;i<N;i++){const p=i/(N-1||1);const r=80+p*430*(.7+.3*Math.sin(tt*.0015+i*.4));ctx.globalAlpha=1-p*.65;ctx.beginPath();ctx.arc(w/2,h/2,r,0,Math.PI*2);ctx.stroke()}ctx.globalAlpha=1;ctx.font=`600 ${scale*1.4}px Helvetica`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,w/2,h/2)}else{const band=(tt*.18)% (w+500)-250;for(let i=0;i<N;i++){const y=h*(i+.5)/N;ctx.save();ctx.beginPath();ctx.rect(0,y-h/N*.4,w,h/N*.8);ctx.clip();ctx.font=`600 ${scale*1.2}px Helvetica`;ctx.fillText(text,-w*.15+((i%2?band:-band)% (w+700)),y+scale*.35);ctx.restore()}ctx.fillStyle=qs('bg').value;ctx.fillRect(band-70,0,140,h)}
noiseGrain(ctx,w,h,.035,rng);raf=requestAnimationFrame(draw)}
function restart(){start=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(draw)}
['text','mode','bg','ink'].forEach(id=>qs(id).addEventListener('input',restart));['speed','density','scale','duration'].forEach(id=>bindRange(id,restart));qs('randomize').onclick=()=>{seed=Math.floor(Math.random()*1e9);qs('mode').selectedIndex=Math.floor(Math.random()*5);restart()};qs('nudge').onclick=()=>{seed++;restart()};qs('export').onclick=()=>downloadCanvas(canvas,'loop-frame.png');
qs('record').onclick=()=>{if(recording)return;recording=true;const stream=canvas.captureStream(60),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{const blob=new Blob(chunks,{type:'video/webm'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cg-loop.webm';a.click();recording=false};rec.start();setTimeout(()=>rec.stop(),+qs('duration').value*1000)};restart();
</script></body></html>
