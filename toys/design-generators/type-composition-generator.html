<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG TYPE COMPOSITION</title><style>
:root{font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;color:#000;background:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000}body{overflow:hidden;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase;color:#000}button{background:#fff;border:0;cursor:pointer;padding:11px 14px}button:hover{background:#f2f2f2}
.app{height:100vh;display:grid;grid-template-columns:292px 1fr}.panel{overflow:auto;padding:20px 18px 88px;border-right:1px solid #000;background:#fff}.brand{font-size:17px;line-height:1;margin-bottom:24px;letter-spacing:-.02em}.section{padding:15px 0;border-top:1px solid #000}.section:first-of-type{border-top:0;padding-top:0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px}.val{font-variant-numeric:tabular-nums}.control{margin:0 0 14px}.control:last-child{margin-bottom:0}
input[type=text],textarea,select{width:100%;border:0;border-bottom:1px solid #000;background:transparent;padding:8px 0;outline:none;border-radius:0}textarea{resize:vertical;min-height:58px}select{appearance:none}
input[type=range]{width:100%;appearance:none;height:16px;background:transparent;margin:0;padding:0}input[type=range]::-webkit-slider-runnable-track{height:1px;background:#000}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#000;margin-top:-5.5px}input[type=color]{width:34px;height:24px;border:0;padding:0;background:transparent;vertical-align:middle}input[type=file]{width:100%;font-size:11px}
.stage{position:relative;min-width:0;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px 24px 76px;overflow:auto}.canvaswrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.actions{position:fixed;left:calc(292px + 24px);right:24px;bottom:18px;display:flex;justify-content:center;gap:4px;z-index:20;pointer-events:none}.actions .group{background:#fff;display:flex;gap:2px;padding:4px;pointer-events:auto}.actions button{min-width:110px}
.tiny{font-size:10px;line-height:1.35;color:#444}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:#000}
@media(max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:260px 1fr}.panel{border-right:0;border-bottom:1px solid #000;padding-bottom:16px}.actions{left:12px;right:12px;bottom:12px}.stage{padding:14px 14px 68px}.canvaswrap canvas{max-height:none}}
</style></head><body>
<div class="app"><aside class="panel"><div class="brand">CG TYPE COMPOSITION</div>
<section class="section">
<div class="control"><div class="labelrow"><span>Primary Text</span></div><textarea id="text">COMPOSITION\nSTUDY</textarea></div>
<div class="control"><div class="labelrow"><span>Secondary</span></div><input id="sub" type="text" value="SYSTEMATIC TYPE / 2026"></div>
<div class="control"><div class="labelrow"><span>Mode</span></div><select id="mode"><option>Crop</option><option>Stack</option><option>Repeat</option><option>Stretch</option><option>Vertical</option><option>Grid</option></select></div>
<div class="control"><div class="labelrow"><span>Scale</span><span id="scaleVal"></span></div><input id="scale" type="range" min="60" max="360" value="245"></div>
<div class="control"><div class="labelrow"><span>Tracking</span><span id="trackingVal"></span></div><input id="tracking" type="range" min="-18" max="50" value="-5"></div>
<div class="control"><div class="labelrow"><span>Density</span><span id="densityVal"></span></div><input id="density" type="range" min="2" max="20" value="8"></div>
<div class="control"><div class="labelrow"><span>Rotation</span><span id="rotationVal"></span></div><input id="rotation" type="range" min="-45" max="45" value="0"></div>
</section>
<section class="section row2"><div class="control"><div class="labelrow"><span>Background</span></div><input id="bg" type="color" value="#f3f0e8"></div><div class="control"><div class="labelrow"><span>Ink</span></div><input id="ink" type="color" value="#111111"></div></section>
</aside><main class="stage"><div class="canvaswrap"><canvas id="c" width="1920" height="1200"></canvas></div></main></div>
<div class="actions"><div class="group"><button id="randomize">Randomize</button><button id="nudge">Nudge</button><button id="export">Export PNG</button></div></div>
<script>
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function downloadCanvas(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function qs(id){return document.getElementById(id)}
function bindRange(id,cb){const e=qs(id),v=qs(id+'Val');const f=()=>{if(v)v.textContent=e.value;cb&&cb()};e.addEventListener('input',f);f()}
function debounce(fn,ms=40){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
function noiseGrain(ctx,w,h,amount,rng){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<w*h/180;i++){const v=rng()<.5?0:255;ctx.fillStyle=`rgb(${v},${v},${v})`;const s=rng()*2+.5;ctx.fillRect(rng()*w,rng()*h,s,s)}ctx.restore()}
function safeUpper(s){return String(s||'').toUpperCase()}


const canvas=qs('c'),ctx=canvas.getContext('2d');let seed=81812;
function spaced(text,x,y,size,tr,align='left'){ctx.font=`600 ${size}px Helvetica`;ctx.fillStyle=qs('ink').value;ctx.textBaseline='alphabetic';const arr=[...text],ws=arr.map(ch=>ctx.measureText(ch).width),total=ws.reduce((a,b)=>a+b,0)+tr*(arr.length-1);let px=align==='center'?x-total/2:align==='right'?x-total:x;arr.forEach((ch,i)=>{ctx.fillText(ch,px,y);px+=ws[i]+tr})}
function render(){const w=canvas.width,h=canvas.height,rng=mulberry32(seed),lines=qs('text').value.toUpperCase().split('\n').filter(Boolean),sub=safeUpper(qs('sub').value),mode=qs('mode').value.toLowerCase(),S=+qs('scale').value,tr=+qs('tracking').value,N=+qs('density').value,rot=+qs('rotation').value*Math.PI/180;ctx.fillStyle=qs('bg').value;ctx.fillRect(0,0,w,h);ctx.save();if(mode==='crop'){ctx.translate(w*.06,h*.14);ctx.rotate(rot);lines.forEach((l,i)=>spaced(l,0,(i+1)*S*.82,S,tr));ctx.restore();spaced(sub,w-60,h-45,22,4,'right')}else if(mode==='stack'){let y=90;for(let i=0;i<N;i++){const l=lines[i%lines.length];ctx.globalAlpha=.22+.78*(i/(N-1||1));spaced(l,60,y+i*(h-170)/N,S*(.38+.52*(i%3)/2),tr*(i%2?1:-.3))}ctx.globalAlpha=1;spaced(sub,60,h-45,22,4)}else if(mode==='repeat'){for(let i=0;i<N;i++){ctx.save();ctx.translate(w/2,h*(i+.5)/N);ctx.rotate(rot*(i/(N-1||1)-.5)*2);ctx.scale(i%2?1:-1,1);spaced(lines[i%lines.length],0,S*.18,S*.62,tr,'center');ctx.restore()}spaced(sub,w-60,42,22,4,'right')}else if(mode==='stretch'){const text=lines.join(' ');for(let i=0;i<Math.min(N,7);i++){ctx.save();ctx.translate(w/2,h*(.12+i*.13));ctx.rotate(rot);ctx.scale(.7+i*.24,1.5-.13*i);spaced(text,0,0,S*.43,tr,'center');ctx.restore()}spaced(sub,60,h-45,22,4)}else if(mode==='vertical'){ctx.save();ctx.translate(w*.18,h*.9);ctx.rotate(-Math.PI/2+rot);spaced(lines.join(' '),0,0,S,tr);ctx.restore();for(let i=0;i<N;i++){spaced(sub,w*(.48+.04*i),h*(.15+.07*i),18,3)}ctx.restore()}else{ctx.strokeStyle='rgba(0,0,0,.18)';ctx.lineWidth=1;for(let i=1;i<8;i++){ctx.beginPath();ctx.moveTo(w*i/8,0);ctx.lineTo(w*i/8,h);ctx.stroke()}for(let j=1;j<5;j++){ctx.beginPath();ctx.moveTo(0,h*j/5);ctx.lineTo(w,h*j/5);ctx.stroke()}for(let i=0;i<N;i++){const col=i%4,row=Math.floor(i/4)%3,x=w*(.08+col*.23),y=h*(.18+row*.31);ctx.save();ctx.translate(x,y);ctx.rotate((rng()-.5)*rot*2);spaced(lines[i%lines.length],0,0,S*(.22+rng()*.18),tr);ctx.restore()}spaced(sub,w-60,h-45,22,4,'right')}ctx.restore();}
['text','sub','mode','bg','ink'].forEach(id=>qs(id).addEventListener('input',render));['scale','tracking','density','rotation'].forEach(id=>bindRange(id,render));qs('randomize').onclick=()=>{seed=Math.floor(Math.random()*1e9);qs('mode').selectedIndex=Math.floor(Math.random()*6);render()};qs('nudge').onclick=()=>{seed++;render()};qs('export').onclick=()=>downloadCanvas(canvas,'type-composition.png');render();
</script></body></html>
