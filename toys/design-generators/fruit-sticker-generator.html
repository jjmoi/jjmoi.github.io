<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG FRUIT STICKER</title><style>
:root{font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;color:#000;background:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000}body{overflow:hidden;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase;color:#000}button{background:#fff;border:0;cursor:pointer;padding:11px 14px}button:hover{background:#f2f2f2}
.app{height:100vh;display:grid;grid-template-columns:292px 1fr}.panel{overflow:auto;padding:20px 18px 88px;border-right:1px solid #000;background:#fff}.brand{font-size:17px;line-height:1;margin-bottom:24px;letter-spacing:-.02em}.section{padding:15px 0;border-top:1px solid #000}.section:first-of-type{border-top:0;padding-top:0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px}.val{font-variant-numeric:tabular-nums}.control{margin:0 0 14px}.control:last-child{margin-bottom:0}
input[type=text],textarea,select{width:100%;border:0;border-bottom:1px solid #000;background:transparent;padding:8px 0;outline:none;border-radius:0}textarea{resize:vertical;min-height:58px}select{appearance:none}
input[type=range]{width:100%;appearance:none;height:16px;background:transparent;margin:0;padding:0}input[type=range]::-webkit-slider-runnable-track{height:1px;background:#000}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#000;margin-top:-5.5px}input[type=color]{width:34px;height:24px;border:0;padding:0;background:transparent;vertical-align:middle}input[type=file]{width:100%;font-size:11px}
.stage{position:relative;min-width:0;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px 24px 76px;overflow:auto}.canvaswrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.actions{position:fixed;left:calc(292px + 24px);right:24px;bottom:18px;display:flex;justify-content:center;gap:4px;z-index:20;pointer-events:none}.actions .group{background:#fff;display:flex;gap:2px;padding:4px;pointer-events:auto}.actions button{min-width:110px}
.tiny{font-size:10px;line-height:1.35;color:#444}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:#000}
@media(max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:260px 1fr}.panel{border-right:0;border-bottom:1px solid #000;padding-bottom:16px}.actions{left:12px;right:12px;bottom:12px}.stage{padding:14px 14px 68px}.canvaswrap canvas{max-height:none}}
</style></head><body>
<div class="app"><aside class="panel"><div class="brand">CG FRUIT STICKER</div>
<section class="section">
<div class="control"><div class="labelrow"><span>Fruit</span></div><select id="fruit"><option>Orange</option><option>Apple</option><option>Lemon</option><option>Plum</option></select></div>
<div class="control"><div class="labelrow"><span>Sticker Text</span></div><input id="text" type="text" value="PREMIUM"></div>
<div class="control"><div class="labelrow"><span>Small Text</span></div><input id="small" type="text" value="NO. 4027 / SELECT"></div>
<div class="control"><div class="labelrow"><span>Shape</span></div><select id="shape"><option>Oval</option><option>Circle</option><option>Capsule</option><option>Diamond</option></select></div>
<div class="control"><div class="labelrow"><span>Sticker Size</span><span id="sizeVal"></span></div><input id="size" type="range" min="70" max="300" value="174"></div>
<div class="control"><div class="labelrow"><span>Rotation</span><span id="rotationVal"></span></div><input id="rotation" type="range" min="-40" max="40" value="-9"></div>
<div class="control"><div class="labelrow"><span>Surface X</span><span id="xVal"></span></div><input id="x" type="range" min="28" max="72" value="54"></div>
<div class="control"><div class="labelrow"><span>Surface Y</span><span id="yVal"></span></div><input id="y" type="range" min="30" max="70" value="52"></div>
</section>
<section class="section row2">
<div class="control"><div class="labelrow"><span>Sticker</span></div><input id="sticker" type="color" value="#f6f0d2"></div>
<div class="control"><div class="labelrow"><span>Ink</span></div><input id="ink" type="color" value="#1b3d2b"></div>
</section>
</aside><main class="stage"><div class="canvaswrap"><canvas id="c" width="1200" height="1200"></canvas></div></main></div>
<div class="actions"><div class="group"><button id="randomize">Randomize</button><button id="nudge">Nudge</button><button id="export">Export PNG</button></div></div>
<script>
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function downloadCanvas(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function qs(id){return document.getElementById(id)}
function bindRange(id,cb){const e=qs(id),v=qs(id+'Val');const f=()=>{if(v)v.textContent=e.value;cb&&cb()};e.addEventListener('input',f);f()}
function debounce(fn,ms=40){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
function noiseGrain(ctx,w,h,amount,rng){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<w*h/180;i++){const v=rng()<.5?0:255;ctx.fillStyle=`rgb(${v},${v},${v})`;const s=rng()*2+.5;ctx.fillRect(rng()*w,rng()*h,s,s)}ctx.restore()}
function safeUpper(s){return String(s||'').toUpperCase()}


const canvas=qs('c'),ctx=canvas.getContext('2d');let seed=4612;
function fruitColors(type){return {orange:['#ffb000','#f05a00'],apple:['#f04b2e','#7d170d'],lemon:['#ffe65d','#bd9b00'],plum:['#7f4a8f','#29152f']}[type]}
function drawFruit(rng){const w=canvas.width,h=canvas.height,type=qs('fruit').value.toLowerCase(),[c1,c2]=fruitColors(type);ctx.fillStyle='#edeae1';ctx.fillRect(0,0,w,h);const cx=w/2,cy=h/2+35,rx=380,ry=425;ctx.save();ctx.beginPath();if(type==='apple'){ctx.moveTo(cx,cy-ry);ctx.bezierCurveTo(cx-rx*.7,cy-ry*1.1,cx-rx,cy-ry*.1,cx-rx*.82,cy+ry*.55);ctx.bezierCurveTo(cx-rx*.4,cy+ry*1.08,cx+rx*.4,cy+ry*1.08,cx+rx*.82,cy+ry*.55);ctx.bezierCurveTo(cx+rx,cy-ry*.1,cx+rx*.7,cy-ry*1.1,cx,cy-ry);ctx.closePath()}else{ctx.ellipse(cx,cy,rx,type==='lemon'?ry*.9:ry, type==='lemon'?-.16:0,0,Math.PI*2)}ctx.clip();const g=ctx.createRadialGradient(cx-rx*.35,cy-ry*.4,20,cx,cy,rx*1.22);g.addColorStop(0,mixHex(c1,'#ffffff',.32));g.addColorStop(.45,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(cx-rx-60,cy-ry-60,rx*2+120,ry*2+120);for(let i=0;i<850;i++){const a=rng()*Math.PI*2,rr=Math.sqrt(rng());const x=cx+Math.cos(a)*rx*rr,y=cy+Math.sin(a)*ry*rr;if(((x-cx)/rx)**2+((y-cy)/ry)**2<1){ctx.globalAlpha=.06+rng()*.1;ctx.fillStyle=rng()<.55?'#fff':'#3a1600';ctx.beginPath();ctx.arc(x,y,.7+rng()*2.2,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.restore();ctx.strokeStyle='rgba(0,0,0,.09)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(cx,cy,rx, type==='lemon'?ry*.9:ry, type==='lemon'?-.16:0,0,Math.PI*2);ctx.stroke();if(type==='apple'){ctx.fillStyle='#352514';ctx.save();ctx.translate(cx+25,cy-ry+28);ctx.rotate(.18);ctx.fillRect(-8,-60,16,95);ctx.restore()}}
function stickerPath(shape,s){ctx.beginPath();if(shape==='circle'){ctx.arc(0,0,s*.48,0,Math.PI*2)}else if(shape==='diamond'){ctx.moveTo(0,-s*.48);ctx.lineTo(s*.55,0);ctx.lineTo(0,s*.48);ctx.lineTo(-s*.55,0);ctx.closePath()}else{const w=shape==='capsule'?s*1.55:s*1.18,h=s*.7,r=h/2;ctx.roundRect(-w/2,-h/2,w,h,r)}}
function render(){const rng=mulberry32(seed);drawFruit(rng);const s=+qs('size').value,x=canvas.width*+qs('x').value/100,y=canvas.height*+qs('y').value/100,rot=+qs('rotation').value*Math.PI/180,shape=qs('shape').value.toLowerCase();ctx.save();ctx.translate(x,y);const nx=(x-canvas.width/2)/380,ny=(y-(canvas.height/2+35))/425;ctx.rotate(rot+nx*.18);ctx.transform(1,ny*.12,-nx*.12,1,0,0);ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=18;ctx.shadowOffsetY=9;stickerPath(shape,s);ctx.fillStyle=qs('sticker').value;ctx.fill();ctx.shadowColor='transparent';ctx.lineWidth=3;ctx.strokeStyle=qs('ink').value;ctx.stroke();ctx.fillStyle=qs('ink').value;ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`600 ${Math.max(18,s*.14)}px Helvetica`;ctx.fillText(safeUpper(qs('text').value),0,-s*.06);ctx.font=`600 ${Math.max(10,s*.055)}px Helvetica`;ctx.fillText(safeUpper(qs('small').value),0,s*.15);ctx.globalAlpha=.18;const hg=ctx.createLinearGradient(-s, -s, s, s);hg.addColorStop(0,'#fff');hg.addColorStop(.35,'rgba(255,255,255,0)');hg.addColorStop(1,'rgba(0,0,0,.2)');stickerPath(shape,s);ctx.fillStyle=hg;ctx.fill();ctx.restore();}
['fruit','text','small','shape','sticker','ink'].forEach(id=>qs(id).addEventListener('input',render));['size','rotation','x','y'].forEach(id=>bindRange(id,render));qs('randomize').onclick=()=>{seed=Math.floor(Math.random()*1e9);qs('fruit').selectedIndex=Math.floor(Math.random()*4);qs('shape').selectedIndex=Math.floor(Math.random()*4);qs('rotation').value=Math.floor(-20+Math.random()*40);render()};qs('nudge').onclick=()=>{seed++;qs('rotation').value=clamp(+qs('rotation').value+(Math.random()-.5)*4,-40,40);render()};qs('export').onclick=()=>downloadCanvas(canvas,'fruit-sticker.png');render();
</script></body></html>
