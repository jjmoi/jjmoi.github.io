<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CG TOPOGRAPHIC</title><style>
:root{font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;color:#000;background:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:#000}body{overflow:hidden;text-transform:uppercase}
button,input,select,textarea{font:inherit;text-transform:uppercase;color:#000}button{background:#fff;border:0;cursor:pointer;padding:11px 14px}button:hover{background:#f2f2f2}
.app{height:100vh;display:grid;grid-template-columns:292px 1fr}.panel{overflow:auto;padding:20px 18px 88px;border-right:1px solid #000;background:#fff}.brand{font-size:17px;line-height:1;margin-bottom:24px;letter-spacing:-.02em}.section{padding:15px 0;border-top:1px solid #000}.section:first-of-type{border-top:0;padding-top:0}.labelrow{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:8px}.val{font-variant-numeric:tabular-nums}.control{margin:0 0 14px}.control:last-child{margin-bottom:0}
input[type=text],textarea,select{width:100%;border:0;border-bottom:1px solid #000;background:transparent;padding:8px 0;outline:none;border-radius:0}textarea{resize:vertical;min-height:58px}select{appearance:none}
input[type=range]{width:100%;appearance:none;height:16px;background:transparent;margin:0;padding:0}input[type=range]::-webkit-slider-runnable-track{height:1px;background:#000}input[type=range]::-webkit-slider-thumb{appearance:none;width:12px;height:12px;border-radius:50%;background:#000;margin-top:-5.5px}input[type=color]{width:34px;height:24px;border:0;padding:0;background:transparent;vertical-align:middle}input[type=file]{width:100%;font-size:11px}
.stage{position:relative;min-width:0;background:#efefef;display:flex;align-items:center;justify-content:center;padding:24px 24px 76px;overflow:auto}.canvaswrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%}.canvaswrap canvas{display:block;max-width:100%;max-height:100%;width:auto;height:auto;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.actions{position:fixed;left:calc(292px + 24px);right:24px;bottom:18px;display:flex;justify-content:center;gap:4px;z-index:20;pointer-events:none}.actions .group{background:#fff;display:flex;gap:2px;padding:4px;pointer-events:auto}.actions button{min-width:110px}
.tiny{font-size:10px;line-height:1.35;color:#444}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:8px;font-size:11px}.check input{accent-color:#000}
@media(max-width:780px){.app{grid-template-columns:1fr;grid-template-rows:260px 1fr}.panel{border-right:0;border-bottom:1px solid #000;padding-bottom:16px}.actions{left:12px;right:12px;bottom:12px}.stage{padding:14px 14px 68px}.canvaswrap canvas{max-height:none}}
</style></head><body>
<div class="app"><aside class="panel"><div class="brand">CG TOPOGRAPHIC</div>
<section class="section">
<div class="control"><div class="labelrow"><span>Field</span></div><select id="field"><option>Terrain</option><option>Crater</option><option>Ridge</option><option>Flow</option></select></div>
<div class="control"><div class="labelrow"><span>Contours</span><span id="contoursVal"></span></div><input id="contours" type="range" min="5" max="42" value="22"></div>
<div class="control"><div class="labelrow"><span>Scale</span><span id="scaleVal"></span></div><input id="scale" type="range" min="20" max="120" value="61"></div>
<div class="control"><div class="labelrow"><span>Warp</span><span id="warpVal"></span></div><input id="warp" type="range" min="0" max="100" value="37"></div>
<div class="control"><div class="labelrow"><span>Line Weight</span><span id="weightVal"></span></div><input id="weight" type="range" min="1" max="7" value="2"></div>
</section>
<section class="section row2"><div class="control"><div class="labelrow"><span>Background</span></div><input id="bg" type="color" value="#f3f0e8"></div><div class="control"><div class="labelrow"><span>Lines</span></div><input id="ink" type="color" value="#1b1b1b"></div></section>
</aside><main class="stage"><div class="canvaswrap"><canvas id="c" width="1920" height="1200"></canvas></div></main></div>
<div class="actions"><div class="group"><button id="randomize">Randomize</button><button id="nudge">Nudge</button><button id="export">Export PNG</button></div></div>
<script>
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const A=hexToRgb(a),B=hexToRgb(b);return rgbToHex(lerp(A[0],B[0],t),lerp(A[1],B[1],t),lerp(A[2],B[2],t))}
function downloadCanvas(canvas,name){const a=document.createElement('a');a.download=name;a.href=canvas.toDataURL('image/png');a.click()}
function qs(id){return document.getElementById(id)}
function bindRange(id,cb){const e=qs(id),v=qs(id+'Val');const f=()=>{if(v)v.textContent=e.value;cb&&cb()};e.addEventListener('input',f);f()}
function debounce(fn,ms=40){let t;return(...args)=>{clearTimeout(t);t=setTimeout(()=>fn(...args),ms)}}
function noiseGrain(ctx,w,h,amount,rng){ctx.save();ctx.globalAlpha=amount;for(let i=0;i<w*h/180;i++){const v=rng()<.5?0:255;ctx.fillStyle=`rgb(${v},${v},${v})`;const s=rng()*2+.5;ctx.fillRect(rng()*w,rng()*h,s,s)}ctx.restore()}
function safeUpper(s){return String(s||'').toUpperCase()}


const canvas=qs('c'),ctx=canvas.getContext('2d');let seed=9817;
function hash(x,y,s){let n=Math.sin(x*127.1+y*311.7+s*.001)*43758.5453;return n-Math.floor(n)}
function smooth(t){return t*t*(3-2*t)}
function vnoise(x,y,s){const x0=Math.floor(x),y0=Math.floor(y),fx=smooth(x-x0),fy=smooth(y-y0);const a=hash(x0,y0,s),b=hash(x0+1,y0,s),c=hash(x0,y0+1,s),d=hash(x0+1,y0+1,s);return lerp(lerp(a,b,fx),lerp(c,d,fx),fy)}
function fbm(x,y,s){let v=0,a=.55,f=1;for(let i=0;i<5;i++){v+=vnoise(x*f,y*f,s+i*19)*a;f*=2;a*=.5}return v/1.066}
function fieldValue(px,py){const w=canvas.width,h=canvas.height,sc=+qs('scale').value/35,warp=+qs('warp').value/100,mode=qs('field').value.toLowerCase();let x=(px/w-.5)*sc*2.8,y=(py/h-.5)*sc*1.8;const wx=fbm(x*.55,y*.55,seed+11)-.5,wy=fbm(x*.55+4,y*.55-2,seed+29)-.5;x+=wx*warp*2.1;y+=wy*warp*2.1;let n=fbm(x,y,seed);if(mode==='crater'){const r=Math.hypot(x*.65,y);n=.55*fbm(x,y,seed)+.45*Math.sin(r*4.2)*Math.exp(-r*.32)}else if(mode==='ridge'){n=.65*Math.abs(fbm(x,y,seed)-.5)*2+.35*fbm(x*1.6,y*.5,seed+4)}else if(mode==='flow'){n=.6*fbm(x+Math.sin(y*2)*.8,y,seed)+.4*(Math.sin(x*2.4+y*.9)+1)/2}return n}
function render(){const w=canvas.width,h=canvas.height;ctx.fillStyle=qs('bg').value;ctx.fillRect(0,0,w,h);const step=16,nx=Math.floor(w/step)+1,ny=Math.floor(h/step)+1,vals=new Float32Array(nx*ny);for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)vals[j*nx+i]=fieldValue(i*step,j*step);const levels=+qs('contours').value;ctx.strokeStyle=qs('ink').value;ctx.lineWidth=+qs('weight').value;ctx.lineCap='round';const cases=[[ ],[[3,0]],[[0,1]],[[3,1]],[[1,2]],[[3,2],[0,1]],[[0,2]],[[3,2]],[[2,3]],[[0,2]],[[0,3],[1,2]],[[1,2]],[[1,3]],[[0,1]],[[0,3]],[]];function edgePoint(i,j,e,t,a,b,c,d){if(e===0)return[(i+lerp(0,1,(t-a)/(b-a||1e-6)))*step,j*step];if(e===1)return[(i+1)*step,(j+lerp(0,1,(t-b)/(c-b||1e-6)))*step];if(e===2)return[(i+lerp(1,0,(t-c)/(d-c||1e-6)))*step,(j+1)*step];return[i*step,(j+lerp(1,0,(t-d)/(a-d||1e-6)))*step]}
for(let L=1;L<levels;L++){const t=L/levels;ctx.globalAlpha=L%5===0?1:.58;ctx.lineWidth=+qs('weight').value*(L%5===0?1.65:1);ctx.beginPath();for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){const a=vals[j*nx+i],b=vals[j*nx+i+1],c=vals[(j+1)*nx+i+1],d=vals[(j+1)*nx+i];const idx=(a>t?1:0)|(b>t?2:0)|(c>t?4:0)|(d>t?8:0);for(const seg of cases[idx]){const p1=edgePoint(i,j,seg[0],t,a,b,c,d),p2=edgePoint(i,j,seg[1],t,a,b,c,d);ctx.moveTo(p1[0],p1[1]);ctx.lineTo(p2[0],p2[1])}}ctx.stroke()}ctx.globalAlpha=1;}
['field','bg','ink'].forEach(id=>qs(id).addEventListener('input',render));['contours','scale','warp','weight'].forEach(id=>bindRange(id,debounce(render,80)));qs('randomize').onclick=()=>{seed=Math.floor(Math.random()*1e9);qs('field').selectedIndex=Math.floor(Math.random()*4);render()};qs('nudge').onclick=()=>{seed++;render()};qs('export').onclick=()=>downloadCanvas(canvas,'topographic-field.png');render();
</script></body></html>
