<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oxblood Design Generator</title>
<style>
  :root{
    --ink:#201823;--muted:#756a79;--line:#cfc7d2;--paper:#f4f1f5;--panel:#ebe6ee;
    --cyan:#5bd3e8;--mag:#d6468c;--violet:#9b86c9;--ox:#7a1e3a;--white:#fff;
    --control-h:28px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;text-transform:uppercase}
  button,input,select{font:inherit;color:inherit}

  .app,.app *{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif!important;font-optical-sizing:auto;font-weight:600!important;text-transform:uppercase!important}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .app{min-height:100vh;display:grid;grid-template-rows:auto 1fr}
  .topbar{height:48px;display:flex;align-items:center;gap:12px;padding:0 14px;background:#211a25;color:#fff;border-bottom:1px solid #000;position:sticky;top:0;z-index:10}
  .brand{font-weight:900;letter-spacing:.04em;font-size:13px}.brand b{color:var(--cyan)}
  .meta{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#bfb5c5;letter-spacing:.08em}
  .topactions{margin-left:auto;display:flex;gap:6px}
  .btn{height:28px;border:1px solid #756a79;background:#312738;color:#fff;padding:0 10px;cursor:pointer;font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.07em;text-transform:uppercase}
  .btn:hover{background:#43364b}.btn.primary{background:var(--mag);border-color:#f08dbd}.btn.primary:hover{background:#c6377d}
  .workspace{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:0}
  .controls{background:var(--panel);border-right:1px solid var(--line);padding:12px;overflow:auto}
  .preview{min-width:0;padding:18px;display:grid;align-items:start;justify-items:center;background:
    linear-gradient(90deg,rgba(122,30,58,.05) 1px,transparent 1px),linear-gradient(rgba(122,30,58,.05) 1px,transparent 1px),#dcd6df;background-size:18px 18px}
  .canvasWrap{width:min(100%,1120px);display:grid;gap:8px}
  canvas{display:block;width:100%;height:auto;background:#fff;border:1px solid #9e94a5;box-shadow:0 12px 30px rgba(43,31,47,.12);image-rendering:auto}
  .readout{display:flex;flex-wrap:wrap;gap:12px;font:10px/1.25 ui-monospace,SFMono-Regular,Menlo,monospace;color:#5d5363;text-transform:uppercase}
  .section{border-top:1px solid #c7becb;padding-top:10px;margin-top:10px}.section:first-child{border-top:0;padding-top:0;margin-top:0}
  .section h2{margin:0 0 8px;font:900 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:#514757}
  .sectionHead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}.sectionHead h2{margin:0}
.previewActions{position:fixed;left:calc(310px + (100vw - 310px)/2);bottom:18px;transform:translateX(-50%);z-index:50;display:flex;justify-content:center;gap:6px;width:max-content;max-width:calc(100vw - 32px);margin:0;padding:6px;background:#fff;border:0;box-shadow:0 8px 20px rgba(32,24,35,.22)}
.previewActions .btn{min-width:96px}
  .linkBtn{appearance:none;border:0;background:none;padding:0;color:#6c5579;cursor:pointer;font:700 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase;text-decoration:underline;text-underline-offset:2px}.linkBtn:hover{color:#2f2037}
  .row{display:grid;grid-template-columns:116px 1fr 42px;align-items:center;gap:8px;min-height:28px;margin:4px 0}
  .row label{font:10px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;color:#544b59;text-transform:uppercase}
  .value{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;color:#756a79;font-variant-numeric:tabular-nums}
  input[type="range"]{width:100%;accent-color:var(--mag);border:0;outline:0;box-shadow:none;background:transparent}
  input[type="range"]::-webkit-slider-runnable-track{border:0}
  input[type="range"]::-moz-range-track{border:0}
  input[type="range"]::-moz-focus-outer{border:0}
  input[type="number"],select{width:100%;height:26px;border:1px solid #b7aebe;background:#fff;padding:0 6px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace}
  .colorRow{display:grid;grid-template-columns:116px 1fr 42px;gap:8px;align-items:center;margin:5px 0}
  .colorRow label{font:10px/1 ui-monospace,SFMono-Regular,Menlo,monospace;text-transform:uppercase;color:#544b59}
  input[type="color"]{appearance:none;width:100%;height:25px;border:0;outline:0;box-shadow:none;padding:0;background:transparent;cursor:pointer}
  input[type="color"]::-webkit-color-swatch-wrapper{padding:0} input[type="color"]::-webkit-color-swatch{border:0} input[type="color"]::-moz-color-swatch{border:0}
  .swatchHex{font:9px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#756a79;text-transform:uppercase;text-align:right}
    .hint{margin:8px 0 0;font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#7b707f}
  .toggle{display:flex;align-items:center;gap:8px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#544b59;text-transform:uppercase}.toggle input{accent-color:#000}
  @media(max-width:820px){.workspace{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid var(--line);max-height:none}.preview{padding:10px}.topbar{height:auto;min-height:48px;flex-wrap:wrap;padding:8px 10px}.topactions{width:100%;margin-left:0}.topactions .btn{flex:1}.previewActions{left:10px;right:10px;bottom:10px;transform:none;width:auto;max-width:none}.previewActions .btn{flex:1;min-width:0}.row,.colorRow{grid-template-columns:104px 1fr 38px}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">CG FORMSTUDY 11</div>
  </header>

  <div class="workspace">
    <aside class="controls" aria-label="Generator controls">
      <section class="section">
        <h2>Canvas</h2>
        <div class="row"><label for="width">Width</label><input id="width" type="range" min="320" max="1920" step="10" value="1920"><span class="value" data-for="width"></span></div>
        <div class="row"><label for="height">Height</label><input id="height" type="range" min="240" max="1200" step="10" value="1200"><span class="value" data-for="height"></span></div>
      </section>

      <section class="section">
        <h2>Composition</h2>
        <div class="row"><label for="density">Density</label><input id="density" type="range" min="20" max="360" step="1" value="160"><span class="value" data-for="density"></span></div>
        <div class="row"><label for="shapeSize">Shape size</label><input id="shapeSize" type="range" min="25" max="220" step="1" value="100"><span class="value" data-for="shapeSize"></span></div>
        <div class="row"><label for="randomness">Randomness</label><input id="randomness" type="range" min="0" max="100" step="1" value="62"><span class="value" data-for="randomness"></span></div>
        <div class="row"><label for="angleJitter">Angle jitter</label><input id="angleJitter" type="range" min="0" max="90" step="1" value="32"><span class="value" data-for="angleJitter"></span></div>
        <div class="row"><label for="originX">Origin X</label><input id="originX" type="range" min="0" max="100" step="1" value="58"><span class="value" data-for="originX"></span></div>
        <div class="row"><label for="originY">Origin Y</label><input id="originY" type="range" min="0" max="100" step="1" value="40"><span class="value" data-for="originY"></span></div>
      </section>

      <section class="section">
        <h2>Texture</h2>
        <div class="row"><label for="curves">Curves</label><input id="curves" type="range" min="0" max="60" step="1" value="18"><span class="value" data-for="curves"></span></div>
        <div class="row"><label for="stretch">Pixel stretch</label><input id="stretch" type="range" min="0" max="18" step="1" value="5"><span class="value" data-for="stretch"></span></div>
        <div class="row"><label for="hatch">Hatching</label><input id="hatch" type="range" min="0" max="100" step="1" value="16"><span class="value" data-for="hatch"></span></div>
        <div class="row"><label for="lines">Line forms</label><input id="lines" type="range" min="0" max="100" step="1" value="12"><span class="value" data-for="lines"></span></div>
      </section>

      <section class="section">
        <div class="sectionHead"><h2>Background</h2><button class="linkBtn" id="shuffleBackground" type="button">Shuffle</button></div>
        <div class="colorRow"><label for="bg1">Top</label><input id="bg1" type="color" value="#ffffff"><span class="swatchHex" data-hex="bg1"></span></div>
        <div class="colorRow"><label for="bg2">Middle</label><input id="bg2" type="color" value="#c9f0f7"><span class="swatchHex" data-hex="bg2"></span></div>
        <div class="colorRow"><label for="bg3">Bottom</label><input id="bg3" type="color" value="#5bd3e8"><span class="swatchHex" data-hex="bg3"></span></div>
      </section>

      <section class="section">
        <div class="sectionHead"><h2>Shards</h2><button class="linkBtn" id="shufflePalette" type="button">Shuffle</button></div>
        <div class="colorRow"><label for="c1">Color 1</label><input id="c1" type="color" value="#d6468c"><span class="swatchHex" data-hex="c1"></span></div>
        <div class="colorRow"><label for="c2">Color 2</label><input id="c2" type="color" value="#5bd3e8"><span class="swatchHex" data-hex="c2"></span></div>
        <div class="colorRow"><label for="c3">Color 3</label><input id="c3" type="color" value="#9b86c9"><span class="swatchHex" data-hex="c3"></span></div>
        <div class="colorRow"><label for="c4">Color 4</label><input id="c4" type="color" value="#7a1e3a"><span class="swatchHex" data-hex="c4"></span></div>
        <div class="colorRow"><label for="c5">Color 5</label><input id="c5" type="color" value="#ffffff"><span class="swatchHex" data-hex="c5"></span></div>
        <div class="colorRow"><label for="hatchColor">Hatch</label><input id="hatchColor" type="color" value="#7a1e3a"><span class="swatchHex" data-hex="hatchColor"></span></div>
      </section>
    </aside>

    <main class="preview">
      <div class="canvasWrap">
        <canvas id="canvas" width="1920" height="1200" aria-label="Generated composition"></canvas>
        <div class="readout" id="readout" aria-live="polite"></div>
        <div class="previewActions" aria-label="Generator actions">
          <button class="btn primary" id="randomize" type="button">Randomize</button>
          <button class="btn" id="nudge" type="button">Nudge</button>
          <button class="btn" id="download" type="button">Export</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script>
(() => {
  const root = document.getElementById('app');
  const canvas = root.querySelector('#canvas');
  const ctx = canvas.getContext('2d');
  const q = id => root.querySelector('#' + id);
  const ids = ['width','height','density','shapeSize','randomness','angleJitter','originX','originY','curves','stretch','hatch','lines','bg1','bg2','bg3','c1','c2','c3','c4','c5','hatchColor'];
  let currentSeed = 16170;
  let dirs = [308,126,92];
  const defaults = Object.fromEntries(ids.map(id => [id, q(id).value]));

  function clamp(n,a,b){ return Math.min(b,Math.max(a,n)); }
  function num(id){ const el=q(id); const n=Number(el.value); return Number.isFinite(n)?n:Number(defaults[id]); }
  function seeded(seed){ let a=(seed>>>0)||1; return () => { a=(a+0x6D2B79F5)>>>0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
  function deg(v){ return v*Math.PI/180; }

  function settings(){
    return {
      seed: currentSeed >>> 0,
      width: clamp(Math.floor(num('width')),320,1920), height:clamp(Math.floor(num('height')),240,1200),
      density:clamp(Math.floor(num('density')),20,360), size:clamp(num('shapeSize')/100,.25,2.2),
      randomness:clamp(num('randomness')/100,0,1), angleJitter:deg(clamp(num('angleJitter'),0,90)),
      ox:clamp(num('originX')/100,0,1), oy:clamp(num('originY')/100,0,1), opacity:.8,
      dirs:dirs.map(deg), curves:clamp(Math.floor(num('curves')),0,60), stretch:clamp(Math.floor(num('stretch')),0,18),
      hatch:clamp(num('hatch')/100,0,1), lines:clamp(num('lines')/100,0,1),
      bg:[q('bg1').value,q('bg2').value,q('bg3').value], pal:[q('c1').value,q('c2').value,q('c3').value,q('c4').value,q('c5').value], hatchColor:q('hatchColor').value
    };
  }

  function polygon(ctx, pts){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); }
  function makePlanes(r,s){
    const out=[], sc=s.height/600, randomness=s.randomness;
    const cx=s.width*s.ox, cy=s.height*s.oy;
    for(let i=0;i<s.density;i++){
      const dir=s.dirs[(r()*s.dirs.length)|0];
      const a=dir+(r()-.5)*s.angleJitter*(.15+.85*randomness);
      const dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx;
      const radial=(30+Math.pow(r(),.65)*(s.width*.34))*s.size*(.55+.8*randomness);
      const x0=cx+dx*radial+(r()-.5)*80*sc*randomness;
      const y0=cy+dy*radial+(r()-.5)*80*sc*randomness;
      const L=(18+Math.pow(r(),1.45)*260)*sc*s.size*(.55+.9*randomness);
      const width=(3+Math.pow(r(),1.9)*52)*sc*s.size*(.5+.9*randomness)*(r()<.5?1:-1);
      const skew=(r()-.35)*L*.42*randomness;
      const pts=[[x0,y0],[x0+dx*L,y0+dy*L],[x0+dx*(L+skew)+nx*width,y0+dy*(L+skew)+ny*width],[x0+dx*skew*.45+nx*width*.72,y0+dy*skew*.45+ny*width*.72]];
      const k=r(), hatchCut=s.hatch, lineCut=Math.min(1,hatchCut+s.lines);
      out.push({pts,col:s.pal[(r()*s.pal.length)|0],alpha:(.24+r()*.7)*s.opacity,kind:k<hatchCut?'hatch':k<lineCut?'line':'fill',gap:2+((r()*5)|0),hatch:s.hatchColor});
    }
    return out;
  }
  function drawPlane(p){
    ctx.save(); polygon(ctx,p.pts); ctx.globalAlpha=p.alpha;
    if(p.kind==='line'){ctx.strokeStyle=p.col;ctx.lineWidth=Math.max(1,canvas.height/700);ctx.stroke();ctx.restore();return;}
    ctx.fillStyle=p.col;ctx.fill();
    if(p.kind==='hatch'){
      ctx.clip();ctx.globalAlpha=.8*p.alpha;ctx.strokeStyle=p.hatch;ctx.lineWidth=Math.max(1,canvas.height/700);
      const xs=p.pts.map(v=>v[0]),ys=p.pts.map(v=>v[1]);const mx=(Math.min(...xs)+Math.max(...xs))/2,my=(Math.min(...ys)+Math.max(...ys))/2;const R=Math.hypot(Math.max(...xs)-Math.min(...xs),Math.max(...ys)-Math.min(...ys))/2+4;const a=Math.atan2(p.pts[1][1]-p.pts[0][1],p.pts[1][0]-p.pts[0][0]),c=Math.cos(a),ss=Math.sin(a);
      ctx.beginPath();for(let t=-R;t<=R;t+=p.gap){const px=mx+c*t,py=my+ss*t;ctx.moveTo(px-ss*R,py+c*R);ctx.lineTo(px+ss*R,py-c*R);}ctx.stroke();
    }
    ctx.restore();
  }
  function drawCurves(r,s){
    const sc=s.height/600,cx=s.width*s.ox,cy=s.height*s.oy;ctx.save();ctx.lineWidth=Math.max(1,s.height/700);
    for(let i=0;i<s.curves;i++){
      const a=s.dirs[(r()*s.dirs.length)|0]+(r()-.5)*s.angleJitter*2;const len=(100+r()*420)*sc*s.size;const bend=a+(r()-.5)*1.5*s.randomness;
      ctx.globalAlpha=(.2+r()*.58)*s.opacity;ctx.strokeStyle=s.pal[(r()*s.pal.length)|0];ctx.beginPath();ctx.moveTo(cx+(r()-.5)*40*sc*s.randomness,cy+(r()-.5)*40*sc*s.randomness);ctx.quadraticCurveTo(cx+Math.cos(bend)*len*.5,cy+Math.sin(bend)*len*.5,cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.stroke();
    }ctx.restore();
  }
  function pixelStretch(r,s){
    ctx.save();ctx.imageSmoothingEnabled=false;
    for(let i=0;i<s.stretch;i++){
      const sx=(r()*s.width)|0, x=(r()*s.width)|0, y=(r()*s.height*.55)|0, w=Math.max(2,(r()*s.width*.09)|0), h=Math.max(8,(s.height*.22+r()*s.height*.68)|0);
      ctx.globalAlpha=(.28+r()*.48)*s.opacity;ctx.drawImage(canvas,sx,y,1,Math.min(h,s.height-y),x,y,w,Math.min(h,s.height-y));
    }ctx.restore();
  }
  function render(){
    const s=settings();
    if(canvas.width!==s.width) canvas.width=s.width;if(canvas.height!==s.height) canvas.height=s.height;
    const r=seeded(s.seed), g=ctx.createLinearGradient(0,0,0,s.height);g.addColorStop(0,s.bg[0]);g.addColorStop(.5,s.bg[1]);g.addColorStop(1,s.bg[2]);ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,s.width,s.height);
    const planes=makePlanes(r,s);planes.forEach(drawPlane);drawCurves(r,s);pixelStretch(r,s);
    q('readout').textContent=`SEED 0X${s.seed.toString(16).toUpperCase().padStart(8,'0')}   ${s.width}×${s.height}   ${planes.length} PLANES`;
    updateLabels();
  }
  function updateLabels(){
    root.querySelectorAll('[data-for]').forEach(el=>{const id=el.dataset.for,v=num(id);el.textContent=(['originX','originY','randomness','hatch','lines'].includes(id)?Math.round(v)+'%':id==='angleJitter'?Math.round(v)+'°':Math.round(v));});
    root.querySelectorAll('[data-hex]').forEach(el=>el.textContent=q(el.dataset.hex).value.replace('#','').toUpperCase());
  }
  function newSeed(){ currentSeed=(Math.random()*0xFFFFFFFF)>>>0; }
  function nudge(){ dirs=dirs.map(d=>(d+(Math.random()-.5)*54+360)%360); q('randomness').value=String(clamp(num('randomness')+(Math.random()-.5)*24,0,100)); render(); }
  function randomizeBackground(){
    const base=Math.random()*360;
    q('bg1').value=hslToHex((base+Math.random()*18)%360,18+Math.random()*26,92+Math.random()*6);
    q('bg2').value=hslToHex((base+20+Math.random()*70)%360,35+Math.random()*38,72+Math.random()*18);
    q('bg3').value=hslToHex((base+55+Math.random()*110)%360,48+Math.random()*42,45+Math.random()*28);
  }
  function randomizeRange(id){
    const el=q(id), min=Number(el.min), max=Number(el.max), step=Number(el.step)||1;
    const steps=Math.floor((max-min)/step);
    el.value=String(min+Math.floor(Math.random()*(steps+1))*step);
  }
  function randomize(){
    newSeed();
    dirs=dirs.map(()=>Math.random()*360);
    ['density','shapeSize','randomness','angleJitter','originX','originY','curves','stretch','hatch','lines'].forEach(randomizeRange);
    randomizeBackground();
    shufflePalette(false);
    render();
  }
  function shufflePalette(shouldRender=true){
    const base=Math.random()*360; for(let i=1;i<=5;i++){const h=(base+(i-1)*(28+Math.random()*58))%360,s=45+Math.random()*45,l=38+Math.random()*45;q('c'+i).value=hslToHex(h,s,l);} q('hatchColor').value=q('c4').value; if(shouldRender) render();
  }
  function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('');}
  ids.forEach(id=>q(id).addEventListener('input',render));
  q('randomize').addEventListener('click',randomize);q('nudge').addEventListener('click',nudge);q('shuffleBackground').addEventListener('click',()=>{randomizeBackground();render();});q('shufflePalette').addEventListener('click',()=>shufflePalette(true));
  q('download').addEventListener('click',()=>{const s=settings(),a=document.createElement('a');a.download=`oxblood-${s.seed}-${s.width}x${s.height}.png`;a.href=canvas.toDataURL('image/png');a.click();});
  render();
})();
</script>
</body>
</html>
