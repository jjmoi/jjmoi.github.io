<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CG VISUAL POETRY GENERATOR</title>
<style>
:root{
  --ui:#ffffff;
  --ink:#0b0b0b;
  --muted:#777;
  --line:#d7d7d7;
  --accent:#111111;
  --panel:348px;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;
  background:var(--ui);color:var(--ink);
  font-family:Helvetica,Arial,sans-serif;
  font-optical-sizing:auto;font-weight:600;
}
body{overflow:hidden}
button,input,textarea{
  font:inherit;font-weight:600;font-optical-sizing:auto;
  color:var(--ink)
}
button{border:0;background:none;cursor:pointer;text-transform:uppercase}
.app{height:100vh;display:grid;grid-template-columns:var(--panel) 1fr}
.panel{
  height:100vh;overflow:auto;
  padding:18px 18px 94px;
  background:#fff;border-right:1px solid #000
}
.kicker{font-size:22px;line-height:.9;margin-bottom:3px}
h1{
  margin:0 0 8px;
  font-size:15px;line-height:1;
  text-transform:uppercase
}
.desc{
  max-width:280px;
  margin-bottom:18px;
  font-size:10px;line-height:1.15;
  text-transform:uppercase
}
.rule{height:1px;background:#000;margin-bottom:14px}
.field{margin-bottom:13px}
.field label,.row label,.palette label{
  display:block;
  font-size:9px;line-height:1;
  text-transform:uppercase
}
.field label{margin-bottom:5px}
textarea{
  width:100%;min-height:112px;
  resize:vertical;
  border:0;border-bottom:1px solid var(--line);
  border-radius:0;outline:none;background:transparent;
  padding:6px 0;
  font-size:11px;line-height:1.35;
  text-transform:uppercase
}
.section-title{
  font-size:9px;line-height:1;
  margin:16px 0 9px;
  padding-top:12px;
  border-top:1px solid #000;
  text-transform:uppercase
}
.segmented{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:5px;margin:8px 0 12px
}
.segmented button{
  height:31px;
  border:1px solid var(--line);
  background:#fff;
  font-size:8px
}
.segmented button.active{
  background:#0a0a0a;color:#fff;border-color:#0a0a0a
}
.row{
  display:grid;
  grid-template-columns:110px 1fr 36px;
  gap:8px;align-items:center;
  margin:10px 0
}
.value{
  font-size:9px;text-align:right;
  font-variant-numeric:tabular-nums
}
input[type=range]{
  width:100%;height:18px;
  appearance:none;background:transparent;
  cursor:pointer
}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;
  background:linear-gradient(
    90deg,
    #000 0 var(--fill,50%),
    #d5d5d5 var(--fill,50%) 100%
  )
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:10px;height:10px;border-radius:50%;
  background:#fff;border:1px solid #cfcfcf;
  margin-top:-4px
}
input[type=range]::-moz-range-track{
  height:2px;background:#d5d5d5
}
input[type=range]::-moz-range-progress{
  height:2px;background:#000
}
input[type=range]::-moz-range-thumb{
  width:10px;height:10px;border:1px solid #cfcfcf;
  border-radius:50%;background:#fff
}
.palette{
  display:grid;
  grid-template-columns:110px 1fr;
  align-items:center;margin-top:12px
}
.swatches{display:flex;gap:5px}
input[type=color]{
  appearance:none;-webkit-appearance:none;
  width:25px;height:25px;
  padding:0;border:0;background:none;cursor:pointer
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:0}
input[type=color]::-moz-color-swatch{border:0;border-radius:0}
.seed-row{
  display:grid;grid-template-columns:110px 1fr;
  align-items:center;margin-top:10px
}
.seed-row label{
  font-size:9px;text-transform:uppercase
}
.seed-value{
  font-size:9px;text-align:right
}
.actions{
  position:fixed;left:0;bottom:0;
  width:var(--panel);height:70px;
  padding:13px 12px 15px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:7px;
  background:#fff;border-top:1px solid #000;
  z-index:10
}
.actions button{
  background:#f3f3f3;
  border-radius:4px;
  font-size:9px
}
.actions button:active{
  background:#000;color:#fff
}
.stage{
  min-width:0;min-height:0;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:34px;
  background:#efefef
}
.canvas-shell{
  width:min(82vh,calc(100vw - var(--panel) - 70px));
  aspect-ratio:1;
  display:flex;align-items:center;justify-content:center
}
canvas{
  display:block;
  max-width:100%;max-height:100%;
  background:#efede5;
  box-shadow:0 0 0 1px rgba(0,0,0,.08)
}
.stage-meta,.stage-seed{
  position:absolute;top:16px;
  padding:5px 7px;
  background:#fff;
  font-size:9px;
  text-transform:uppercase
}
.stage-meta{left:18px}
.stage-seed{right:18px}

@media(max-width:720px){
  :root{--panel:292px}
  .panel{padding-left:14px;padding-right:14px}
  .stage{padding:18px}
}
@media(max-width:600px){
  body{overflow:auto}
  .app{display:block}
  .panel{
    height:auto;
    border-right:0;border-bottom:1px solid #000;
    padding-bottom:84px
  }
  .actions{width:100%}
  .stage{height:68vh}
  .canvas-shell{width:min(90vw,62vh)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <div class="kicker">11</div>
    <h1>VISUAL POETRY GENERATOR</h1>
    <div class="desc">MAKE IMAGES USING ONLY TINY TYPE, DENSITY, ABSENCE, RHYTHM, AND REPETITION.</div>
    <div class="rule"></div>

    <div class="field">
      <label for="textInput">TEXT</label>
      <textarea id="textInput">LANGUAGE BECOMES IMAGE IMAGE BECOMES LANGUAGE THE PAGE HOLDS A FIELD OF VOICES REPEATING FADING BREAKING FORMING SPACE BETWEEN WORDS SPACE INSIDE WORDS</textarea>
    </div>

    <div class="section-title" style="margin-top:0">COMPOSITION</div>
    <div class="segmented" id="modes">
      <button type="button" data-mode="field" class="active">FIELD</button>
      <button type="button" data-mode="void">VOID</button>
      <button type="button" data-mode="erosion">EROSION</button>
      <button type="button" data-mode="columns">COLUMNS</button>
      <button type="button" data-mode="wave">WAVE</button>
      <button type="button" data-mode="mass">MASS</button>
    </div>

    <div id="controls"></div>

    <div class="section-title">COLOR</div>
    <div class="palette">
      <label>PALETTE</label>
      <div class="swatches">
        <input id="paper" type="color" value="#efede5" title="Background">
        <input id="ink" type="color" value="#a7a49d" title="Type">
        <input id="ink2" type="color" value="#6f6d68" title="Secondary type">
      </div>
    </div>

    <div class="seed-row">
      <label>SEED</label>
      <div class="seed-value" id="seedValue">38291</div>
    </div>
  </aside>

  <main class="stage">
    <div class="stage-meta">CG VISUAL POETRY STUDY</div>
    <div class="stage-seed" id="stageSeed">SEED 38291</div>
    <div class="canvas-shell">
      <canvas id="canvas" width="1800" height="1800"></canvas>
    </div>
  </main>

  <div class="actions">
    <button type="button" id="randomize">RANDOMIZE</button>
    <button type="button" id="nudge">NUDGE</button>
    <button type="button" id="export">EXPORT</button>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const W = canvas.width;
const H = canvas.height;

const state = {
  seed: 38291,
  mode: "field",
  typeSize: 9,
  leading: 12,
  density: 78,
  contrast: 46,
  opacity: 58,
  wordGap: 22,
  drift: 18,
  rotation: 2,
  voidScale: 42,
  voidX: 50,
  voidY: 49,
  erosion: 34,
  fragmentation: 28,
  columnWidth: 58,
  waveAmp: 26,
  waveFreq: 42,
  massScale: 50,
  edgeCrop: 18
};

const defs = [
  ["typeSize","TYPE SIZE",5,20,1],
  ["leading","LEADING",6,28,1],
  ["density","DENSITY",20,100,1],
  ["contrast","CONTRAST",0,100,1],
  ["opacity","OPACITY",15,100,1],
  ["wordGap","WORD GAP",0,100,1],
  ["drift","DRIFT",0,100,1],
  ["rotation","ROTATION",0,16,1],
  ["voidScale","VOID SCALE",6,85,1],
  ["voidX","VOID X",0,100,1],
  ["voidY","VOID Y",0,100,1],
  ["erosion","EROSION",0,100,1],
  ["fragmentation","FRAGMENTATION",0,100,1],
  ["columnWidth","COLUMN WIDTH",20,100,1],
  ["waveAmp","WAVE AMPLITUDE",0,100,1],
  ["waveFreq","WAVE FREQUENCY",0,100,1],
  ["massScale","MASS SCALE",10,100,1],
  ["edgeCrop","EDGE CROP",0,100,1]
];

function rng(seed){
  let a = seed >>> 0;
  return function(){
    a += 0x6D2B79F5;
    let t = a;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));

function hash(x,y,s){
  let n = (x * 374761393 + y * 668265263 + s * 1442695041) | 0;
  n = (n ^ (n >> 13)) * 1274126177;
  n ^= n >> 16;
  return (n >>> 0) / 4294967295;
}

function updateFill(el){
  const min = Number(el.min);
  const max = Number(el.max);
  const v = Number(el.value);
  el.style.setProperty("--fill", `${((v-min)/(max-min))*100}%`);
}

function buildControls(){
  const root = document.getElementById("controls");

  defs.forEach(([key,label,min,max,step]) => {
    const row = document.createElement("div");
    row.className = "row";

    const lab = document.createElement("label");
    lab.textContent = label;

    const input = document.createElement("input");
    input.type = "range";
    input.min = min;
    input.max = max;
    input.step = step;
    input.value = state[key];
    input.id = key;

    const val = document.createElement("div");
    val.className = "value";
    val.id = "v_" + key;
    val.textContent = state[key];

    input.addEventListener("input", () => {
      state[key] = Number(input.value);
      val.textContent = input.value;
      updateFill(input);
      render();
    });

    row.append(lab,input,val);
    root.append(row);
    updateFill(input);
  });
}

function syncUI(){
  defs.forEach(([key]) => {
    const el = document.getElementById(key);
    el.value = state[key];
    document.getElementById("v_" + key).textContent = Math.round(state[key]);
    updateFill(el);
  });

  document.querySelectorAll("#modes button").forEach(b => {
    b.classList.toggle("active", b.dataset.mode === state.mode);
  });

  document.getElementById("seedValue").textContent = state.seed;
  document.getElementById("stageSeed").textContent = "SEED " + state.seed;
}

document.querySelectorAll("#modes button").forEach(button => {
  button.addEventListener("click", () => {
    state.mode = button.dataset.mode;
    syncUI();
    render();
  });
});

["paper","ink","ink2"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});
document.getElementById("textInput").addEventListener("input", render);

function ellipseField(x,y,cx,cy,rx,ry){
  const dx=(x-cx)/Math.max(.001,rx);
  const dy=(y-cy)/Math.max(.001,ry);
  return Math.sqrt(dx*dx+dy*dy);
}

function signedNoise(x,y){
  return (hash(Math.floor(x*121),Math.floor(y*137),state.seed)-.5)*2;
}

function voidShape(x,y){
  const cx=state.voidX/100;
  const cy=state.voidY/100;
  const s=state.voidScale/100;

  const n=signedNoise(x,y)*.11*(state.fragmentation/100);

  if(state.mode==="columns"){
    const col=Math.floor(x*12);
    return (col%3===1 ? .25 : 1) + n;
  }

  if(state.mode==="wave"){
    const amp=.04+.14*(state.waveAmp/100);
    const freq=1.5+5.5*(state.waveFreq/100);
    const center=cy + Math.sin((x*freq+state.seed*.00007)*Math.PI*2)*amp;
    return Math.abs(y-center) - (.04+.14*s) + n;
  }

  if(state.mode==="mass"){
    const a=ellipseField(x,y,cx,cy,.18+.26*s,.12+.34*s);
    const b=ellipseField(x,y,cx-.16,cy+.16,.10+.14*s,.20+.18*s);
    return Math.min(a,b)+n;
  }

  const d=ellipseField(x,y,cx,cy,.10+.28*s,.10+.34*s);
  return d+n;
}

function maskFactor(x,y){
  const f=voidShape(x,y);

  if(state.mode==="void"){
    return f < 1 ? 0 : 1;
  }

  if(state.mode==="erosion"){
    if(f < 1){
      const h=hash(Math.floor(x*160),Math.floor(y*160),state.seed+19);
      return h < state.erosion/100 ? 0 : .25;
    }
    return 1;
  }

  if(state.mode==="wave"){
    if(f < 0){
      const h=hash(Math.floor(x*150),Math.floor(y*150),state.seed+31);
      return h < .78 ? 0 : .22;
    }
    return 1;
  }

  if(state.mode==="mass"){
    return f < 1 ? 1 : .15;
  }

  if(state.mode==="columns"){
    const c=Math.floor(x*10);
    if(c%4===1)return .18;
    if(c%4===2)return .55;
    return 1;
  }

  // field
  if(f<1){
    const h=hash(Math.floor(x*170),Math.floor(y*170),state.seed+7);
    return h < state.erosion/140 ? 0 : .38;
  }
  return 1;
}

function render(){
  const text = (document.getElementById("textInput").value.trim() || "TYPE")
    .replace(/\s+/g," ")
    .toUpperCase();

  const words = text.split(" ");
  const paper = document.getElementById("paper").value;
  const ink = document.getElementById("ink").value;
  const ink2 = document.getElementById("ink2").value;

  ctx.setTransform(1,0,0,1,0,0);
  ctx.globalAlpha=1;
  ctx.globalCompositeOperation="source-over";
  ctx.fillStyle=paper;
  ctx.fillRect(0,0,W,H);

  const r = rng(state.seed);
  const fs = state.typeSize * 2.6;
  const lead = state.leading * 2.6;
  const margin = W * (.055 + state.edgeCrop/100*.03);
  const density = state.density/100;
  const contrast = state.contrast/100;
  const drift = state.drift/100;
  const rotMax = state.rotation * Math.PI/180;

  ctx.textBaseline="top";
  ctx.font=`600 ${fs}px Helvetica,Arial,sans-serif`;

  let y=margin;
  let row=0;
  let wordIndex=0;

  while(y < H-margin){
    let x=margin;
    const lineDrift=Math.sin(row*.53+state.seed*.00013)*W*.035*drift;
    const stagger=(row%2)*fs*.65*(state.wordGap/100);

    while(x < W-margin){
      const word=words[wordIndex % words.length];
      wordIndex++;

      const spacing=fs*(.40+state.wordGap/100*1.05);
      const measured=ctx.measureText(word).width;
      const advance=Math.max(fs*1.3,measured+spacing);

      const nx=x/W;
      const ny=y/H;
      const gx=Math.floor(x/(fs*.70));
      const gy=Math.floor(y/lead);
      const localHash=hash(gx,gy,state.seed);

      if(localHash < density){
        const mask=maskFactor(nx,ny);

        if(mask>0){
          const localContrast=.55+contrast*.95;
          const jitter=(hash(gx+11,gy+29,state.seed)-.5)*contrast*.36;
          const scale=clamp(1+jitter,.65,1.4);

          ctx.save();
          ctx.translate(x+lineDrift+stagger,y);
          ctx.rotate((hash(gx+3,gy+5,state.seed)-.5)*rotMax);
          ctx.scale(scale,scale);

          const alpha=(state.opacity/100)
            * (.38+.62*hash(gx+17,gy+23,state.seed))
            * mask;

          ctx.globalAlpha=alpha;

          const useSecond=hash(gx+41,gy+7,state.seed) < (.10+.25*contrast);
          ctx.fillStyle=useSecond ? ink2 : ink;

          ctx.fillText(word,0,0);

          // Fragmented duplicate line, still only type.
          if(hash(gx+71,gy+37,state.seed) < state.fragmentation/100*.12){
            ctx.globalAlpha*=.35;
            ctx.translate(
              (hash(gx+5,gy+79,state.seed)-.5)*fs*1.4,
              (hash(gx+13,gy+61,state.seed)-.5)*lead*.7
            );
            ctx.fillText(word,0,0);
          }

          ctx.restore();
        }
      }

      x += advance;
    }

    y += lead;
    row++;
    if(row>300)break;
  }

  document.getElementById("seedValue").textContent=state.seed;
  document.getElementById("stageSeed").textContent="SEED "+state.seed;
}

function randomize(){
  const r=rng((Date.now() ^ Math.floor(performance.now()*100000))>>>0);

  state.seed=Math.floor(10000+r()*89999);
  state.mode=["field","void","erosion","columns","wave","mass"][Math.floor(r()*6)];

  state.typeSize=Math.round(6+r()*9);
  state.leading=Math.round(8+r()*10);
  state.density=Math.round(48+r()*48);
  state.contrast=Math.round(18+r()*68);
  state.opacity=Math.round(38+r()*52);
  state.wordGap=Math.round(5+r()*65);
  state.drift=Math.round(r()*55);
  state.rotation=Math.round(r()*8);
  state.voidScale=Math.round(18+r()*58);
  state.voidX=Math.round(18+r()*64);
  state.voidY=Math.round(18+r()*64);
  state.erosion=Math.round(14+r()*68);
  state.fragmentation=Math.round(8+r()*70);
  state.columnWidth=Math.round(35+r()*50);
  state.waveAmp=Math.round(12+r()*70);
  state.waveFreq=Math.round(18+r()*70);
  state.massScale=Math.round(20+r()*70);
  state.edgeCrop=Math.round(r()*45);

  syncUI();
  render();
}

function nudge(){
  const r=rng(state.seed+911);
  state.seed=(state.seed+1+Math.floor(r()*73))%99999;

  const delta={
    typeSize:1,leading:1,density:4,contrast:5,opacity:4,wordGap:5,drift:4,
    rotation:1,voidScale:4,voidX:3,voidY:3,erosion:5,fragmentation:4,
    columnWidth:4,waveAmp:4,waveFreq:4,massScale:4,edgeCrop:3
  };

  defs.forEach(([key,,min,max])=>{
    state[key]=clamp(
      Math.round(state[key]+(r()-.5)*delta[key]*1.4),
      min,max
    );
  });

  syncUI();
  render();
}

function exportPNG(){
  render();
  const a=document.createElement("a");
  a.download=`cg-visual-poetry-${state.seed}.png`;
  a.href=canvas.toDataURL("image/png");
  a.click();
}

document.getElementById("randomize").addEventListener("click",randomize);
document.getElementById("nudge").addEventListener("click",nudge);
document.getElementById("export").addEventListener("click",exportPNG);

buildControls();
syncUI();
render();

})();
</script>
</body>
</html>
