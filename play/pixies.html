<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJ → PIXIES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,200..900&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root{
  --mist:#eceef1;          /* stage */
  --mist-hi:#f7f8fa;       /* light pooling behind the print */
  --surface:#ffffff;
  --text:#1d1e22;
  --text-2:#686b73;
  --track:#f2f3f5;
  --track-hover:#edeef1;
  --fill:#e1e3e8;
  --fill-hover:#d9dce2;
  --fill-active:#cfd3da;
  --hair:rgba(29,30,34,.075);
  --hair-2:rgba(29,30,34,.14);
  --accent:#15ef74;        /* follows the palette's accent */
  --paper:#efede7;         /* follows the palette's paper */

  --shadow-card:0 1px 1px rgba(23,25,31,.03),0 3px 8px -3px rgba(23,25,31,.06),0 22px 44px -22px rgba(23,25,31,.16);
  --shadow-lift:0 1px 2px rgba(23,25,31,.08),0 3px 10px -3px rgba(23,25,31,.12);

  --r-card:26px;
  --r-ctl:12px;
  --r-tile:15px;
  --inspector:368px;
  --gutter:36px;
  --ease:cubic-bezier(.22,.8,.24,1);
  --font:"Mona Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
}

/* ── Base ───────────────────────────────────────────────── */
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:var(--font);font-stretch:104%;font-weight:430;font-size:13px;line-height:1.4;
  color:var(--text);background:var(--mist);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;
}
button,input,output{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* ── Layout ─────────────────────────────────────────────── */
.app{
  display:grid;grid-template-columns:minmax(0,1fr) var(--inspector);
  height:100vh;height:100dvh;
  background:
    radial-gradient(ellipse 62% 74% at calc((100% - var(--inspector)) / 2) 44%,var(--mist-hi) 0%,rgba(247,248,250,0) 72%),
    var(--mist);
}

/* ── Stage ──────────────────────────────────────────────── */
.stage{
  position:relative;min-width:0;min-height:0;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding:28px 12px 26px var(--gutter);
}
.brand h1{
  margin:0;font-size:23px;line-height:1.2;font-weight:380;font-stretch:118%;letter-spacing:-.014em;
}
.brand p{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--text-2);text-wrap:pretty}

.art-area{
  position:relative;min-height:0;container-type:size;
  display:grid;place-items:center;
  padding:22px 76px 4px;
}
.figure{margin:0;width:min(100cqw,calc(100cqh - 70px),980px)}
/* The print is a card: click it and it turns over in 3D. Its back face is the
   same sheet seen from behind, so the pattern reads mirrored. */
.flip{
  position:relative;aspect-ratio:1;perspective:2200px;border-radius:14px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:translate .35s var(--ease);
}
.flip:hover{translate:0 -2px}
.flip:focus-visible{outline-offset:5px}
/* Ambient shadow on the surface below: a soft solid blob (not a box-shadow, which
   would show a hollow outline once the card narrows mid-turn). It narrows with the card. */
.shadow{
  position:absolute;left:8%;right:8%;top:16%;bottom:-1.5%;border-radius:48px;
  background:rgba(23,25,31,.30);filter:blur(34px);opacity:.92;
  transition:opacity .35s var(--ease),translate .35s var(--ease);
}
.flip:hover .shadow{opacity:1;translate:0 5px}
.print{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;background:var(--paper);
  box-shadow:0 1px 2px rgba(23,25,31,.07),0 12px 24px -12px rgba(23,25,31,.2);
  backface-visibility:visible;will-change:transform;
}
.print canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none}

.caption{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin-top:18px;min-height:44px;
}
.cap-title{font-size:13.5px;font-weight:560;letter-spacing:-.003em}
.side-tag{
  display:inline-block;margin-left:9px;padding:0 8px;border-radius:999px;vertical-align:1px;
  font-size:11px;font-weight:520;line-height:19px;color:var(--text-2);
  background:rgba(255,255,255,.75);box-shadow:inset 0 0 0 1px var(--hair-2);
  opacity:0;translate:0 3px;transition:opacity .3s var(--ease),translate .3s var(--ease);
}
.is-back .side-tag{opacity:1;translate:0 0}
.cap-meta{margin-top:2px;font-size:12.5px;color:var(--text-2);text-wrap:pretty}

/* palette chips — a printer's color bar under the print */
.swatches{display:flex;gap:7px;flex:none}
.swatch{
  position:relative;width:30px;height:30px;border-radius:10px;background:var(--c);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.09),0 1px 2px rgba(23,25,31,.08);
  transition:transform .22s var(--ease),box-shadow .22s var(--ease);
}
.swatch:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(0,0,0,.09),var(--shadow-lift)}
.swatch input{
  position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;
}
.swatch:has(input:focus-visible){outline:2px solid var(--text);outline-offset:3px}

/* variation strip */
.history{
  position:absolute;left:0;top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;gap:10px;
  max-height:calc(100% - 24px);overflow-y:auto;overflow-x:hidden;
  padding:4px;margin:-4px;scrollbar-width:none;
}
.history::-webkit-scrollbar{display:none}
.history[hidden]{display:none}
.thumb{
  flex:none;width:46px;height:46px;padding:0;border:0;border-radius:11px;overflow:hidden;background:var(--paper);
  box-shadow:0 0 0 1px var(--hair),0 1px 2px rgba(23,25,31,.06);
  opacity:.72;transition:opacity .2s,transform .22s var(--ease),box-shadow .22s var(--ease);
  animation:thumb-in .34s var(--ease) backwards;
}
.thumb canvas{display:block;width:100%;height:100%}
.thumb:hover{opacity:1;transform:translateY(-1px)}
.thumb[aria-current="true"]{opacity:1;box-shadow:0 0 0 2px var(--mist),0 0 0 3.5px var(--text)}
@keyframes thumb-in{from{opacity:0;transform:scale(.6)}}

/* ── Dock ───────────────────────────────────────────────── */
.dock-row{display:flex;justify-content:center;padding-top:20px}
.dock{
  display:flex;gap:2px;padding:6px;border-radius:999px;
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:var(--shadow-card),inset 0 0 0 1px rgba(255,255,255,.7);
}
.btn{
  display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 17px 0 15px;
  border:0;border-radius:999px;background:transparent;
  font-size:13.5px;font-weight:500;letter-spacing:-.002em;white-space:nowrap;
  transition:background .18s,transform .14s var(--ease),box-shadow .18s;
}
.btn svg{width:17px;height:17px;flex:none}
.btn:hover{background:rgba(29,30,34,.055)}
.btn:active{transform:scale(.965)}
.btn.primary{
  padding:0 20px 0 16px;color:#fff;background:var(--text);
  box-shadow:0 1px 1px rgba(0,0,0,.22),0 8px 16px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.14);
}
.btn.primary:hover{background:#2b2c32}
.btn .done-icon{display:none}
.btn.done .done-icon{display:block}
.btn.done .idle-icon{display:none}

/* play / pause toggles (dock button and the small one in the Animate section) */
.pause-icon{display:none}
[aria-pressed="true"] > .play-icon{display:none}
[aria-pressed="true"] > .pause-icon{display:block}
.btn.toggle{position:relative}
.btn.toggle .live{
  position:absolute;top:8px;left:28px;width:7px;height:7px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 0 2px #fff;opacity:0;scale:.4;
  transition:opacity .2s,scale .3s var(--ease);
}
.btn.toggle[aria-pressed="true"] .live{opacity:1;scale:1}

/* ── Inspector ──────────────────────────────────────────── */
.inspector{min-height:0;display:flex;padding:14px 14px 14px 0}
.card{
  flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;
  padding:24px 20px 22px;border-radius:var(--r-card);
  background:var(--surface);box-shadow:var(--shadow-card);
  scrollbar-width:thin;scrollbar-color:rgba(29,30,34,.16) transparent;
}
.group+.group{margin-top:26px}
.group h2{margin:0 0 11px;font-size:12px;font-weight:560;letter-spacing:.004em;color:var(--text-2)}
.group-head{display:flex;align-items:center;justify-content:space-between;margin:-4px 0 7px}
.group-head h2{margin:0}
.mini-play{
  display:grid;place-items:center;width:28px;height:28px;padding:0;border:0;border-radius:50%;
  color:var(--text);background:var(--track);transition:background .18s,color .18s,transform .14s var(--ease);
}
.mini-play:hover{background:var(--fill)}
.mini-play:active{transform:scale(.92)}
.mini-play[aria-pressed="true"]{color:#fff;background:var(--text)}
.mini-play svg{width:12px;height:12px}
.stack{display:grid;gap:6px}

/* segmented control with a gliding thumb */
.seg{
  --n:3;--i:0;position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);
  padding:3px;border-radius:var(--r-ctl);background:var(--track);
}
.seg .glide{
  position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));
  border-radius:9px;background:var(--surface);box-shadow:var(--shadow-lift);
  transform:translateX(calc(100% * var(--i)));transition:transform .3s var(--ease);
}
.seg button{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;
  height:32px;border:0;border-radius:9px;background:transparent;
  font-size:12.5px;color:var(--text-2);transition:color .2s;
}
.seg button:hover,.seg button[aria-pressed="true"]{color:var(--text)}
.seg button svg{width:14px;height:14px;flex:none}

/* pill slider: the whole row is the control */
.slider{
  --p:.5;position:relative;display:flex;align-items:center;justify-content:space-between;
  height:34px;padding:0 12px;border-radius:var(--r-ctl);overflow:hidden;background:var(--track);
  cursor:ew-resize;touch-action:pan-y;-webkit-user-select:none;user-select:none;
  transition:background .16s,opacity .24s;
}
.slider::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:calc(8px + (100% - 16px) * var(--p));
  background:var(--fill);transition:background .16s;
}
.slider::after{
  content:"";position:absolute;top:50%;left:calc(8px + (100% - 16px) * var(--p));
  width:2px;height:12px;margin:-6px 0 0 -1px;border-radius:2px;background:var(--text);opacity:0;
  transition:opacity .16s,height .2s var(--ease),margin .2s var(--ease);
}
.slider:hover{background:var(--track-hover)}
.slider:hover::before{background:var(--fill-hover)}
.slider.dragging::before{background:var(--fill-active)}
.slider.dragging::after{opacity:1;height:20px;margin-top:-10px}
.slider label,.slider output{position:relative;z-index:1;pointer-events:none;font-size:12.5px}
.slider label{font-weight:460}
.slider output{color:var(--text-2)}
.slider.dragging output{color:var(--text)}
.slider input{
  position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;pointer-events:none;
  -webkit-appearance:none;appearance:none;background:transparent;
}
.slider:has(input:focus-visible){box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}

/* a pill row that holds a compact segmented control */
.pillrow{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  height:34px;padding:0 3px 0 12px;border-radius:var(--r-ctl);background:var(--track);
}
.pillrow > span{font-size:12.5px;font-weight:460}
.seg.mini{padding:0;background:transparent;width:calc(var(--n) * 36px);height:28px}
.seg.mini .glide{top:0;bottom:0;left:0;width:calc(100% / var(--n));border-radius:9px}
.seg.mini button{height:28px;font-size:12px}
.seg.mini button svg{width:13px;height:13px}

.footnote{
  margin:28px 0 0;padding-top:18px;border-top:1px solid var(--hair);
  font-size:12px;line-height:1.6;color:var(--text-2);
}
.footnote p{margin:0}
.footnote p+p{margin-top:8px}
.keys{display:flex;flex-wrap:wrap;align-items:center;gap:6px 0}
.keys > span:not(.sep){white-space:nowrap}
.keys .sep{margin:0 8px;color:var(--hair-2)}
kbd{
  display:inline-block;min-width:19px;padding:0 5px;border-radius:6px;
  font:inherit;font-size:11px;font-weight:520;line-height:18px;text-align:center;color:var(--text);
  background:var(--track);box-shadow:inset 0 -1px 0 var(--hair-2);
}

/* ── Responsive ─────────────────────────────────────────── */
@media (max-width:1180px){
  :root{--inspector:336px;--gutter:28px}
  .art-area{padding-inline:68px}
}
@media (max-width:860px){
  html,body{height:auto;overflow:auto}
  .app{display:block;height:auto;min-height:100dvh;background:var(--mist)}
  .stage{display:block;padding:22px 18px 6px}
  .art-area{display:flex;flex-direction:column;align-items:stretch;container-type:normal;padding:22px 0 0}
  .figure{width:100%}
  .history{
    order:2;position:static;transform:none;flex-direction:row;
    max-height:none;overflow-x:auto;overflow-y:hidden;margin:14px -4px 0;
  }
  .thumb{width:44px;height:44px}
  .swatches{gap:5px}
  .swatch{width:26px;height:26px;border-radius:9px}
  .dock-row{
    position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;
    padding:0;pointer-events:none;
  }
  .dock{pointer-events:auto}
  .inspector{display:block;padding:14px 12px 112px}
  .card{overflow:visible;padding:22px 18px}
}
/* phones: secondary dock buttons go icon-only so all four fit */
@media (max-width:560px){
  .btn:not(.primary){width:42px;padding:0;justify-content:center}
  .btn:not(.primary) .label{
    position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;
  }
  .btn.toggle .live{left:24px;top:7px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <header class="brand">
      <h1>Pixies</h1>
      <p>Flying pixels and dithering textures</p>
    </header>

    <section class="art-area">
      <nav class="history" id="history" aria-label="Recent variations" hidden></nav>
      <figure class="figure">
        <div class="flip" id="flip" role="button" tabindex="0" aria-pressed="false" aria-label="Turn the print over" title="Click to see the back (F)">
          <div class="shadow" aria-hidden="true"></div>
          <div class="print">
            <canvas id="canvas" width="1800" height="1800" aria-hidden="true"></canvas>
            <canvas id="fx" width="900" height="900" aria-hidden="true"></canvas>
          </div>
        </div>
        <figcaption class="caption">
          <div>
            <div class="cap-title">Seed <span id="seedValue">72016</span><span class="side-tag" aria-hidden="true">Back</span></div>
            <div class="cap-meta" id="capMeta"></div>
          </div>
          <div class="swatches" role="group" aria-label="Palette">
            <label class="swatch" data-key="ink"><input id="ink" type="color" value="#101010" aria-label="Ink color"></label>
            <label class="swatch" data-key="accentColor"><input id="accentColor" type="color" value="#15ef74" aria-label="Accent color"></label>
            <label class="swatch" data-key="gray"><input id="gray" type="color" value="#aaa9a5" aria-label="Gray color"></label>
            <label class="swatch" data-key="paper"><input id="paper" type="color" value="#efede7" aria-label="Paper color"></label>
          </div>
        </figcaption>
      </figure>
    </section>

    <div class="dock-row">
      <div class="dock" role="toolbar" aria-label="Generate">
        <button class="btn toggle" id="animate" type="button" aria-pressed="false" title="Animate (A)">
          <svg class="play-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M7.1 5.3v9.4l7.8-4.7Z"/></svg>
          <svg class="pause-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7.6 5.4v9.2M12.4 5.4v9.2"/></svg>
          <span class="live" aria-hidden="true"></span>
          <span class="label">Animate</span>
        </button>
        <button class="btn primary" id="regenerate" type="button" title="Regenerate (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.68-5.75"/><path d="M15.89 2.77 16.82 6.25 13.23 5.93"/></svg>
          <span>Regenerate</span>
        </button>
        <button class="btn" id="export" type="button" title="Export PNG, 1800 × 1800 (E)">
          <svg class="idle-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3.5v9.25M6.25 9.25 10 13l3.75-3.75M4 16.25h12"/></svg>
          <svg class="done-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.75 10.5 8.2 14l7.05-7.75"/></svg>
          <span class="label btn-label">Export</span>
        </button>
      </div>
    </div>
  </main>

  <aside class="inspector" aria-label="Settings">
    <div class="card">
      <section class="group">
        <h2>Pixels</h2>
        <div class="stack" id="g-pixels"></div>
      </section>
      <section class="group">
        <h2>Composition</h2>
        <div class="stack" id="g-composition"></div>
      </section>
      <section class="group">
        <h2>Tone</h2>
        <div class="stack" id="g-tone"></div>
      </section>
      <section class="group">
        <div class="group-head">
          <h2 id="anim-title">Animate</h2>
          <button class="mini-play" id="animate-mini" type="button" aria-pressed="false" aria-label="Animate" title="Animate (A)">
            <svg class="play-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M7.1 5.3v9.4l7.8-4.7Z"/></svg>
            <svg class="pause-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7.4 5.2v9.6M12.6 5.2v9.6"/></svg>
          </button>
        </div>
        <div class="stack" id="g-animate" role="group" aria-labelledby="anim-title"></div>
      </section>
      <div class="footnote">
        <p class="keys"><span><kbd>A</kbd> Animate</span><span class="sep" aria-hidden="true">|</span><span><kbd>R</kbd> Regenerate</span><span class="sep" aria-hidden="true">|</span><span><kbd>N</kbd> Nudge</span><span class="sep" aria-hidden="true">|</span><span><kbd>F</kbd> Flip</span><span class="sep" aria-hidden="true">|</span><span><kbd>E</kbd> Export</span></p>
        <p>Double-click a slider to reset. Pausing an animation keeps that frame as a new variation.</p>
      </div>
    </div>
  </aside>
</div>
<script>
/* ── Generator ─────────────────────────────────────────────
   Carried over from the original file with these changes:
   · render() hands its seed readout to onRendered() in the UI layer below.
   · Scanlines are retired: the state starts with them off, they are gone from
     defs, and randomize() no longer turns them on, so the scanline pass never runs.
   · Drift for Animate (state.drift, see the Drift block). null, which is where every
     seed starts, draws exactly what the original drew.
   · The Animate settings (animSpeed, animRange, fps) live in state so each variation
     remembers them; the generator itself never reads them.
   · Threshold shifts tone before quantising instead of re-sorting quantised levels, and
     Block and Complexity add and remove shapes without disturbing the rest of the picture
     (state.baseBlocks, state.baseCircles). At Threshold 50 and an image's own Block and
     Complexity values, output matches the original.
   · 4-bit draws its 16 levels as mark sizes too (a halftone), so it looks clearly different
     from 3-bit instead of nearly the same; 1- to 3-bit are unchanged.
   · The dither is always Bayer now; the other patterns stay in ditherThreshold but
     nothing picks them.
   · Three more pixel shapes: x, plus, and all (a shape per pixel chosen by its tone).
     render() passes each cell's tone to drawPixel for that; the original three ignore it.
   · A batch drawing mode for animation frames (see flushPixels). Stills and exports
     never use it.
   ───────────────────────────────────────────────────────── */
"use strict";

function rng(seed){
  let a=seed>>>0;
  return function(){
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=(a,r)=>a[Math.floor(r()*a.length)];
function hexAlpha(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;

const rangeOf=key=>defs.find(d=>d[0]===key);

/* Coalesce renders to one per frame while dragging. */
let frameReq=0;
function requestRender(){
  if(frameReq)return;
  frameReq=requestAnimationFrame(()=>{frameReq=0;render();});
}
function renderNow(){
  if(frameReq){cancelAnimationFrame(frameReq);frameReq=0;}
  render();
}

/* Pill slider: label, value and fill share one 34px row.
   Pointer input is handled on the row (click or drag anywhere; on touch, a sideways drag or a tap
   sets it and a vertical swipe still scrolls). The range input underneath keeps keyboard and
   screen-reader support. */
const sliders={};
/* By default a pill edits the image state; the Animate speed passes its own target. */
function pill(key,{target=state,range=rangeOf(key),label=LABEL[key],reset=DEFAULTS[key],after=edited}={}){
  const [, ,min,max,step]=range;
  const el=document.createElement("div");el.className="slider";
  const id="ctl-"+key;
  el.innerHTML=`<input type="range" id="${id}" min="${min}" max="${max}" step="${step}"><label for="${id}">${label}</label><output for="${id}"></output>`;
  const input=el.querySelector("input"),out=el.querySelector("output");
  const show=v=>{
    input.value=v;
    out.textContent=Math.round(v)+(UNIT[key]||"");
    el.style.setProperty("--p",((v-min)/(max-min)).toFixed(4));
  };
  const commit=v=>{
    v=clamp(Math.round(v/step)*step,min,max);
    if(v===target[key])return;
    target[key]=v;show(v);after(key);
  };
  const fromX=x=>{
    const r=el.getBoundingClientRect();
    return min+clamp((x-r.left-8)/(r.width-16),0,1)*(max-min);
  };
  let drag=null;
  const grab=e=>{drag.live=true;el.setPointerCapture(e.pointerId);el.classList.add("dragging");};
  const release=()=>{drag=null;el.classList.remove("dragging");};
  el.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    drag={id:e.pointerId,x:e.clientX,y:e.clientY,live:false};
    if(e.pointerType==="mouse"){
      e.preventDefault();input.focus({preventScroll:true});
      grab(e);commit(fromX(e.clientX));
    }
  });
  el.addEventListener("pointermove",e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.live){
      const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);
      if(dx<6||dx<dy)return;
      grab(e);
    }
    commit(fromX(e.clientX));
  });
  el.addEventListener("pointerup",e=>{
    if(!drag||e.pointerId!==drag.id)return;
    if(!drag.live)commit(fromX(e.clientX));   // a tap sets the value
    release();
  });
  el.addEventListener("pointercancel",e=>{if(drag&&e.pointerId===drag.id)release();});
  el.addEventListener("dblclick",()=>{target[key]=reset;show(reset);after(key);});
  input.addEventListener("input",()=>{target[key]=Number(input.value);show(target[key]);after(key);});
  sliders[key]=show;
  return el;
}

/* Segmented control with a gliding thumb. Options are [value, label, icon, title]; an option
   with an empty label shows only its icon and takes its name from the title. Returns a sync function. */
function segmented(el,options,onPick){
  el.style.setProperty("--n",options.length);
  el.innerHTML='<span class="glide" aria-hidden="true"></span>'+options.map(([v,label,icon,title])=>{
    const iconOnly=label==="";
    return `<button type="button" data-v="${v}" aria-pressed="false"${title?` title="${title}"`:""}${iconOnly&&title?` aria-label="${title}"`:""}>${icon||""}${iconOnly?"":`<span>${label}</span>`}</button>`;
  }).join("");
  const buttons=[...el.querySelectorAll("button")];
  buttons.forEach(b=>b.addEventListener("click",()=>onPick(b.dataset.v)));
  return value=>buttons.forEach((b,i)=>{
    const on=b.dataset.v===String(value);
    b.setAttribute("aria-pressed",String(on));
    if(on)el.style.setProperty("--i",i);
  });
}

/* A pill row holding a compact segmented control: Shape, Bit depth, Frame rate. */
function choiceRow(id,label,options,onPick){
  const row=document.createElement("div");row.className="pillrow";
  row.innerHTML=`<span id="${id}-label">${label}</span><div class="seg mini" role="group" aria-labelledby="${id}-label"></div>`;
  return {row,sync:segmented(row.querySelector(".seg"),options,onPick)};
}

const shapeChoice=choiceRow("shape","Shape",SHAPES.map(([v,name])=>[v,"",SHAPE_ICON[v],v==="all"?"All (each pixel by tone)":name]),v=>{
  state.pixelShape=v;syncUI();edited();
});
const bitChoice=choiceRow("bits","Bit depth",[1,2,3,4].map(n=>[n,n,"",n===4?"16 levels, shown as mark size":`${2**n} levels`]),v=>{
  state.bitDepth=Number(v);syncUI();edited();
});

$("#g-pixels").append(shapeChoice.row,pill("resolution"),bitChoice.row);
$("#g-composition").append(pill("fieldComplexity"),pill("pixelScale"),pill("blockScale"),pill("waveMix"));
/* Grain lives with tone: it jitters each cell's value before the threshold, the same place contrast acts. */
$("#g-tone").append(pill("contrast"),pill("threshold"),pill("grain"),pill("accentMix"));

/* Palette chips under the print. The interface borrows the accent and paper colors. */
const swatches=[...document.querySelectorAll(".swatch")];
swatches.forEach(sw=>{
  const k=sw.dataset.key,input=sw.querySelector("input");
  input.addEventListener("input",()=>{state[k]=input.value;paintPalette();edited();});
});
function luminance(hex){
  const n=parseInt(hex.slice(1),16);
  const ch=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4);};
  return .2126*ch((n>>16)&255)+.7152*ch((n>>8)&255)+.0722*ch(n&255);
}
function paintPalette(){
  swatches.forEach(sw=>{
    const k=sw.dataset.key;
    sw.style.setProperty("--c",state[k]);
    sw.title=`${COLOR_NAME[k]} ${state[k].toUpperCase()}`;
  });
  const root=document.documentElement.style;
  root.setProperty("--accent",luminance(state.accentColor)>.7?"#1d1e22":state.accentColor);
  root.setProperty("--paper",state.paper);
}

/* Replaces the original syncUI(); randomize() and nudge() call it. Controls built later
   (the Animate section's frame rate) add themselves to syncHooks. */
const syncHooks=[];
function syncUI(){
  Object.entries(sliders).forEach(([k,show])=>{if(k in state)show(state[k]);});
  shapeChoice.sync(state.pixelShape);
  bitChoice.sync(Math.round(state.bitDepth));
  syncHooks.forEach(sync=>sync());
  swatches.forEach(sw=>{sw.querySelector("input").value=state[sw.dataset.key];});
  paintPalette();
}

/* Called at the end of every render(). */
const seedEl=$("#seedValue"),metaEl=$("#capMeta");
function onRendered(){
  const res=Math.round(state.resolution);
  const shape=SHAPE_PHRASE[state.pixelShape];
  seedEl.textContent=state.seed;
  metaEl.textContent=`${shape[0].toUpperCase()+shape.slice(1)}, ${res} × ${res} grid, ${Math.round(state.bitDepth)}-bit`;
}

/* ── Interface: variations, transitions, actions ──────────── */
const strip=$("#history");
const entries=[];
const MAX_ENTRIES=12;
let current=-1,thumbTimer=0;
/* Animate state lives outside the image state: what moves, how fast, and the loop. */
const anim={on:false,req:0,last:0,acc:0,pending:0,gap:0};

/* Halve the 1800px canvas a few times before the final draw so fine dither averages out
   instead of aliasing into moiré. */
function paintThumb(cv){
  let src=canvas,w=canvas.width;
  while(w/2>=cv.width*2){
    w=Math.round(w/2);
    const half=document.createElement("canvas");half.width=half.height=w;
    const hc=half.getContext("2d");hc.imageSmoothingQuality="high";hc.drawImage(src,0,0,w,w);
    src=half;
  }
  const c=cv.getContext("2d");
  c.imageSmoothingQuality="high";c.clearRect(0,0,cv.width,cv.height);c.drawImage(src,0,0,cv.width,cv.height);
}
function markCurrent(){
  entries.forEach((e,i)=>{
    e.btn.setAttribute("aria-current",String(i===current));
    e.btn.title="Seed "+e.state.seed;
    e.btn.setAttribute("aria-label","Variation with seed "+e.state.seed);
  });
  strip.hidden=entries.length<2;
}
function addEntry(){
  const cv=document.createElement("canvas");cv.width=cv.height=96;paintThumb(cv);
  const btn=document.createElement("button");btn.type="button";btn.className="thumb";btn.append(cv);
  const entry={state:{...state},cv,btn};
  btn.addEventListener("click",()=>goTo(entries.indexOf(entry)));
  entries.push(entry);strip.prepend(btn);
  if(entries.length>MAX_ENTRIES)entries.shift().btn.remove();
  current=entries.length-1;
  strip.scrollTop=0;strip.scrollLeft=0;
  markCurrent();
}
/* Any tweak updates the variation you're on; its thumbnail catches up when you pause.
   While animating, the loop is already redrawing, and the variation you started from is
   left alone: pausing keeps the result as a new one. */
function edited(){
  if(anim.on)return;
  requestRender();
  if(current<0)return;
  entries[current].state={...state};
  clearTimeout(thumbTimer);
  thumbTimer=setTimeout(()=>{thumbTimer=0;paintThumb(entries[current].cv);},260);
}
function flushPending(){
  if(frameReq)renderNow();
  if(thumbTimer){clearTimeout(thumbTimer);thumbTimer=0;paintThumb(entries[current].cv);}
}

/* Ordered-dither dissolve: the old image clears block by block in 8×8 Bayer order. */
const fx=$("#fx"),fxc=fx.getContext("2d");
const BAYER8=[
   0,32, 8,40, 2,34,10,42, 48,16,56,24,50,18,58,26, 12,44, 4,36,14,46, 6,38, 60,28,52,20,62,30,54,22,
   3,35,11,43, 1,33, 9,41, 51,19,59,27,49,17,57,25, 15,47, 7,39,13,45, 5,37, 63,31,55,23,61,29,53,21
];
let fxReq=0;
function holdFrame(){
  if(reduceMotion.matches)return false;
  cancelAnimationFrame(fxReq);
  fxc.globalCompositeOperation="destination-over";   // keep any dissolve already in flight
  fxc.drawImage(canvas,0,0,fx.width,fx.height);
  fxc.globalCompositeOperation="source-over";
  return true;
}
function dissolve(duration=540){
  const n=fx.width,res=Math.round(state.resolution);
  const per=Math.max(1,Math.round(res/24)),count=Math.ceil(res/per);
  const edges=Array.from({length:count+1},(_,i)=>Math.min(n,Math.round(i*per*n/res)));
  let start=0,cleared=0;
  const step=now=>{
    start=start||now;   // time from the first painted frame, so a background tab still gets the full reveal
    const t=Math.min(1,(now-start)/duration);
    const eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const level=t>=1?64:Math.floor(eased*64);
    if(level>cleared){
      for(let by=0;by<count;by++)for(let bx=0;bx<count;bx++){
        const rank=BAYER8[(by&7)*8+(bx&7)];
        if(rank>=cleared&&rank<level)fxc.clearRect(edges[bx],edges[by],edges[bx+1]-edges[bx],edges[by+1]-edges[by]);
      }
      cleared=level;
    }
    if(t<1)fxReq=requestAnimationFrame(step);
    else fxc.clearRect(0,0,n,n);
  };
  fxReq=requestAnimationFrame(step);
}

function goTo(i){
  if(i<0||i===current)return;
  flushPending();
  const animate=holdFrame();
  Object.assign(state,entries[i].state);
  current=i;
  syncUI();renderNow();markCurrent();
  if(animate)dissolve(420);
}
/* A fresh seed starts at rest, as its own composition. */
const atRest=()=>{state.drift=null;};
function doRegenerate(){
  flushPending();
  const animate=holdFrame();
  atRest();randomizeMotion();randomize();   // randomize() syncs the controls and redraws
  addEntry();
  if(animate)dissolve();
}
function doNudge(){
  flushPending();
  const animate=holdFrame();
  atRest();nudge();
  addEntry();
  if(animate)dissolve(420);
}

/* ── Animate ──
   The field flows through the frame (see Drift in the generator): shapes travel with their
   layer's current, leave the canvas and are replaced by new ones coming in, so it never comes
   back round. Each animation started from a still picks its own directions and coin tosses.
   Speed: how fast it flows (0 holds it still). Range: how much varies on the way, from a steady
   conveyor of unchanging shapes to a meandering current where shapes move at their own pace and
   keep changing. Frame rate: standard rates; 12 gives a stepped, hand-animated feel.
   The settings live in state, so each variation keeps its own, and Regenerate picks new ones. */
const toggles=[$("#animate"),$("#animate-mini")];
const ANIM_SLIDERS=[["animSpeed","Speed",0,100,30],["animRange","Range",0,100,30]];
const FRAME_RATES=[[12,"Animation on twos"],[24,"Film"],[30,"Video"],[60,"Smooth"]];
/* Changing a motion setting updates the variation you're on without redrawing it. While
   animating it's left alone, like any other edit: pausing keeps the result as a new variation. */
function remember(){if(!anim.on&&current>=0)entries[current].state={...state};}
const fpsChoice=choiceRow("fps","Frame rate",FRAME_RATES.map(([n,use])=>[n,n,"",`${n} fps, ${use.toLowerCase()}`]),v=>{
  state.fps=Number(v);fpsChoice.sync(state.fps);remember();
});
$("#g-animate").append(...ANIM_SLIDERS.map(([key,label,min,max,reset])=>
  pill(key,{range:[key,label,min,max,1],label,reset,after:remember})),fpsChoice.row);
syncHooks.push(()=>fpsChoice.sync(state.fps));
/* Regenerate's share: Speed never lands on 0, so a new variation always moves. */
function randomizeMotion(){
  state.animSpeed=Math.round(15+Math.random()*55);
  state.animRange=Math.round(Math.random()*85);
  state.fps=pick(FRAME_RATES.map(([n])=>n),Math.random);
}

const flowSpeed=()=>state.animSpeed<=0?0:.03*Math.pow(2,(state.animSpeed-30)/15);   // canvas widths per second: 30 → 0.03
function tick(now){
  anim.req=requestAnimationFrame(tick);
  const dt=anim.last?Math.min(now-anim.last,1000):0;
  anim.last=now;anim.acc+=dt;anim.pending+=dt;
  // Frame rate sets the cadence; heavy settings stretch it rather than stall the controls.
  const interval=Math.max(1000/state.fps,anim.gap);
  if(anim.acc<interval-1)return;
  anim.acc=Math.min(anim.acc-interval,interval);
  const tau=Math.min(anim.pending,1000)/1000*flowSpeed();
  anim.pending=0;
  if(!tau)return;
  state.drift=stepDrift(state.drift||startDrift(),tau,state.animRange/100);   // a new object, so snapshots stay as they were
  const t0=performance.now();
  pixelBatch={};
  try{renderNow();}finally{pixelBatch=null;}
  anim.gap=(performance.now()-t0)*1.8;
}
function setAnimating(on){
  if(on===anim.on)return;
  if(on)flushPending();
  anim.on=on;
  toggles.forEach(b=>b.setAttribute("aria-pressed",String(on)));
  if(on){anim.last=0;anim.acc=Infinity;anim.pending=0;anim.req=requestAnimationFrame(tick);return;}
  cancelAnimationFrame(anim.req);
  renderNow();
  // Keep the paused frame as its own variation; the one you started from stays as it was.
  if(current<0||JSON.stringify(state)!==JSON.stringify(entries[current].state))addEntry();
}
toggles.forEach(b=>b.addEventListener("click",()=>setAnimating(!anim.on)));
/* Turning the print over. The back is the same sheet seen from behind, so the
   pattern reads mirrored; the shadow narrows with the card as it goes edge-on. */
const flipEl=$("#flip"),printEl=$(".print"),shadowEl=$(".shadow"),figureEl=$(".figure");
const FLIP_MS=820,FLIP_EASE="cubic-bezier(.6,0,.2,1.06)";
const SHADOW_FRAMES=Array.from({length:25},(_,i)=>({
  offset:i/24,transform:`scaleX(${Math.max(.03,Math.abs(Math.cos(Math.PI*i/24))).toFixed(3)})`
}));
let flipped=false,turning=null;
function setSide(back){
  if(back===flipped)return;
  flipped=back;
  figureEl.classList.toggle("is-back",back);
  flipEl.setAttribute("aria-pressed",String(back));
  flipEl.title=back?"Click to see the front (F)":"Click to see the back (F)";
  printEl.style.transform=back?"rotateY(180deg)":"none";   // resting pose once any turn ends
  if(turning){turning.forEach(a=>a.reverse());return;}      // clicked mid-turn: go back the way it came
  if(reduceMotion.matches)return;
  const from=back?0:180,to=back?180:0,opts={duration:FLIP_MS,easing:FLIP_EASE};
  turning=[
    printEl.animate([{transform:`rotateY(${from}deg)`},{transform:`rotateY(${to}deg)`}],opts),
    shadowEl.animate(SHADOW_FRAMES,opts)
  ];
  turning[0].onfinish=()=>{turning=null;};
}
flipEl.addEventListener("click",()=>setSide(!flipped));
flipEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){e.preventDefault();setSide(!flipped);}
});

/* Export saves the side you're looking at; the back comes out mirrored. */
let exportTimer=0;
function doExport(){
  flushPending();
  const name=`pixies-${state.seed}${flipped?"-back":""}.png`;
  if(flipped){
    render();
    const back=document.createElement("canvas");back.width=canvas.width;back.height=canvas.height;
    const bc=back.getContext("2d");bc.translate(back.width,0);bc.scale(-1,1);bc.drawImage(canvas,0,0);
    const a=document.createElement("a");a.download=name;a.href=back.toDataURL("image/png");a.click();
  }else downloadCanvas(canvas,name,render);
  const b=$("#export"),label=b.querySelector(".btn-label");
  b.classList.add("done");label.textContent="Exported";
  clearTimeout(exportTimer);
  exportTimer=setTimeout(()=>{b.classList.remove("done");label.textContent="Export";},1600);
}
$("#regenerate").addEventListener("click",doRegenerate);
$("#export").addEventListener("click",doExport);

addEventListener("keydown",e=>{
  if(e.defaultPrevented||e.isComposing)return;
  const t=e.target,tag=t.tagName;
  if(t.isContentEditable||tag==="TEXTAREA"||tag==="SELECT"||(tag==="INPUT"&&t.type!=="range"&&t.type!=="color"))return;
  const k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&!e.altKey&&k==="s"){e.preventDefault();if(!e.repeat)doExport();return;}
  if(e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;
  if(k==="a"||(e.key===" "&&t===document.body)){e.preventDefault();setAnimating(!anim.on);}
  else if(k==="r"){e.preventDefault();doRegenerate();}
  else if(k==="n"){e.preventDefault();doNudge();}
  else if(k==="f"){e.preventDefault();setSide(!flipped);}
  else if(k==="e"){e.preventDefault();doExport();}
});

/* Shortcut line: when it wraps, hide the separator left dangling at the end of a line. */
const keysEl=$(".keys");
function tidyKeys(){
  keysEl.querySelectorAll(".sep").forEach(sep=>{
    sep.style.visibility="";
    const next=sep.nextElementSibling;
    if(next&&next.offsetTop>sep.offsetTop+2)sep.style.visibility="hidden";
  });
}
addEventListener("resize",tidyKeys);
if(document.fonts)document.fonts.ready.then(tidyKeys);

syncUI();
render();
addEntry();
tidyKeys();
/* Opening moment: the first image resolves out of blank paper. */
if(!reduceMotion.matches){
  fxc.fillStyle=state.paper;fxc.fillRect(0,0,fx.width,fx.height);
  dissolve(900);
}
</script>
</body>
</html>
