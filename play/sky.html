<body>
<div class="app">
  <aside class="panel" id="panel">

    <section class="section">
      <div class="control slider"><input id="density" type="range" min="1" max="48" value="12" aria-label="Density"><span class="thumb-label" data-for="density">DENSITY</span></div>

<script>
const qs=id=>document.getElementById(id);
const canvas=qs('c');
const gl=canvas.getContext('webgl',{antialias:false,preserveDrawingBuffer:false,alpha:false,powerPreference:'high-performance'});
if(!gl) throw new Error('WebGL is required.');

const vertexSource=`
attribute vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;

const fragmentSource=`
precision highp float;
uniform vec2 u_resolution;
uniform float u_time;
uniform float u_seed;
uniform float u_distortion;
uniform float u_blur;
uniform float u_density;
uniform float u_scale;
uniform float u_noise;
uniform vec3 u_colorA;
uniform vec3 u_colorB;
uniform vec3 u_colorC;
uniform vec3 u_base;

#define PI 3.14159265359

float hash11(float p){
  p=fract(p*.1031);
  p*=p+33.33;
  p*=p+p;
  return fract(p);
}
float hash21(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 pickColor(float i){
  float k=mod(i,3.0);
  if(k<.5)return u_colorA;
  if(k<1.5)return u_colorB;
  return u_colorC;
}

// Smooth gradient noise supplies broad organic turbulence.
float noise2(vec2 p){
  vec2 i=floor(p),f=fract(p);
  f=f*f*(3.0-2.0*f);
  float a=hash21(i),b=hash21(i+vec2(1.,0.));
  float c=hash21(i+vec2(0.,1.)),d=hash21(i+vec2(1.,1.));
  return mix(mix(a,b,f.x),mix(c,d,f.x),f.y);
}
float fbm(vec2 p){
  float n=0.0;
  n+=.54*noise2(p); p=rot(.63)*p*2.03+4.7;
  n+=.29*noise2(p); p=rot(-.42)*p*2.14-3.4;
  n+=.17*noise2(p);
  return n;
}

void main(){
  vec2 uv=gl_FragCoord.xy/u_resolution.xy;
  float aspect=u_resolution.x/u_resolution.y;
  vec2 p=(uv-.5)*vec2(aspect,1.);
  float t=u_time*.22;
  float dist=clamp(u_distortion,0.,1.);
  float crowd=clamp((u_density-10.)/35.,0.,1.);
  float soft=clamp(u_blur/480.,0.,1.);
  // Neutral at 50, half size at 0, double size at 100.
  float scaleMultiplier=exp2((clamp(u_scale,0.,1.)-.5)*2.);
  float seed=mod(u_seed,1000000.);

  // Low frequency displacement bends entire swathes in a consistent direction.
  // Higher frequency detail creates folds and irregular boundaries.
  vec2 fieldP=p*1.4+vec2(seed*.00119,seed*.00073);
  vec2 flow=vec2(fbm(fieldP*1.3+vec2(t*.13,-t*.08)),
                 fbm(rot(1.4)*fieldP*1.5+vec2(-t*.09,t*.12)))-.5;
  vec2 curl=vec2(fbm(fieldP*3.5+vec2(.8,t*.2)),
                 fbm(fieldP*3.2+vec2(-2.3,-t*.15)))-.5;
  vec2 domain=p+flow*(.09+.41*dist)+curl*(.025+.13*dist);
  domain+=vec2(.038*sin(p.y*8.3+t*.33),.038*cos(p.x*6.5-t*.29))*dist;

  // Very broad atmospheric fields give the composition its underlying light.
  vec3 col=u_base;
  for(int bg=0;bg<5;bg++){
    float j=float(bg);
    float s=seed*.017+j*91.733;
    float h1=hash11(s+1.),h2=hash11(s+2.),h3=hash11(s+3.);
    vec2 c=vec2((h1-.5)*(aspect+1.1),(h2-.5)*1.6);
    c+=vec2(sin(t*.12+s),cos(t*.1+s))*.08;
    vec2 q=rot((h3-.5)*2.7)*(domain-c);
    q/=vec2(.54+h2*.85,.47+h1*.85);
    float a=exp(-dot(q,q)*(1.0+.9*(1.-soft)));
    col=mix(col,pickColor(j+floor(h3*3.)),a*(.35+.29*h3));
  }

  // Organic pigment clouds, softly diffusing into one another.
  // No ribbon centerlines, liquid folds, hard contours, or outlined boundaries.
  for(int ii=0;ii<48;ii++){
    float i=float(ii);
    if(i>=u_density)break;
    float s=seed*.01337+i*17.173;
    float r1=hash11(s+1.),r2=hash11(s+2.),r3=hash11(s+3.);
    float r4=hash11(s+4.),r5=hash11(s+5.),r6=hash11(s+6.);
    float phase=r6*PI*2.;
    vec2 c=vec2((r1-.5)*(aspect+1.05),(r2-.5)*1.64);
    c+=vec2(sin(t*(.21+r3*.24)+phase),cos(t*(.15+r4*.2)+phase))*(.06+.11*dist);
    float angle=(r5-.5)*PI*1.85+sin(t*.09+phase)*.15;
    vec2 q=rot(angle)*(domain-c);

    // Elliptical underpainting is reshaped with low-frequency fluid turbulence.
    // Individual clouds vary from broad pools to long, translucent plumes.
    float size=(.60+r3*.65)*mix(1.,.73,crowd)*scaleMultiplier;
    float elong=mix(1.0,2.9,r4);
    vec2 shapeScale=vec2(size*(.33+.37*r2)*elong,
                         size*(.30+.46*r1)/sqrt(elong));
    vec2 w=q/max(shapeScale,vec2(.035));
    vec2 bend=vec2(fbm(w*.69+vec2(phase,t*.055)),
                   fbm(rot(1.09)*w*.76+vec2(-t*.055,phase)))-.5;
    w+=bend*(.15+.64*dist);
    w+=vec2(sin(w.y*1.47+phase+t*.08),cos(w.x*1.3-phase-t*.06))*(.08+.19*dist);

    // Gaussian falloff keeps every boundary atmospheric, not contour-like.
    float radius=dot(w,w);
    float body=exp(-radius*mix(2.3,.68,soft));
    float veil=exp(-radius*mix(.86,.23,soft));
    float pigment=mix(body,veil,.19+.23*soft);
    float opacity=(.43+.38*r5)*mix(1.,.45,crowd);
    col=mix(col,pickColor(i),clamp(pigment*opacity,0.,.95));
  }

  // Luminous pigment diffusion, subtle film texture, and optical falloff.
  float light=fbm(domain*2.1+vec2(t*.055,seed*.0009));
  col=mix(col,col*vec3(1.055,1.018,.987),.21+.28*light);
  float micro=hash21(gl_FragCoord.xy+vec2(mod(seed,997.),mod(seed,619.)))-.5;
  float fine=hash21(floor(gl_FragCoord.xy*.48)+vec2(seed*.01,0.))-.5;
  float grain=(micro*.73+fine*.27)*(u_noise/50.)*.115;
  col+=grain;
  float vignette=1.-.065*smoothstep(.28,1.12,length(p));
  gl_FragColor=vec4(clamp(col*vignette,0.,1.),1.);
}
`;

function compile(type,source){
  const shader=gl.createShader(type);gl.shaderSource(shader,source);gl.compileShader(shader);
  if(!gl.getShaderParameter(shader,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(shader));
  return shader;
}
function makeProgram(vs,fs){
  const program=gl.createProgram();gl.attachShader(program,compile(gl.VERTEX_SHADER,vs));gl.attachShader(program,compile(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);
  if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
  return program;
}

const program=makeProgram(vertexSource,fragmentSource);
gl.useProgram(program);
const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const posLoc=gl.getAttribLocation(program,'a_position');gl.enableVertexAttribArray(posLoc);gl.vertexAttribPointer(posLoc,2,gl.FLOAT,false,0,0);
const U={};['resolution','time','seed','distortion','blur','density','scale','noise','colorA','colorB','colorC','base'].forEach(n=>U[n]=gl.getUniformLocation(program,'u_'+n));

let seed=87021,paused=false,uiHidden=false,elapsed=0,lastStamp=performance.now();
let rafId=0,resizeRaf=0,uniformsDirty=true;
const THUMB_WIDTH=46;
const BASE_DISPLAY_PIXELS=2500000;
const MIN_DISPLAY_PIXELS=600000;
const MAX_EXPORT_PIXELS=8500000;

const controls={
  distortion:qs('distortion'),blur:qs('blur'),density:qs('density'),scale:qs('scale'),noise:qs('noise'),speed:qs('speed'),
  a:qs('a'),b:qs('b'),d:qs('d'),base:qs('base')
};
const labels={};
document.querySelectorAll('.thumb-label').forEach(el=>labels[el.dataset.for]=el);
const sliders=['density','scale','distortion','blur','noise','speed'];
const colors=['a','b','d','base'];
const state={
  distortion:+controls.distortion.value/400,
  blur:+controls.blur.value,
  density:+controls.density.value,
  scale:+controls.scale.value/100,
  noise:+controls.noise.value,
  speed:+controls.speed.value/100,
  a:null,b:null,d:null,base:null
};

function hexToVec3(hex){
  const n=parseInt(hex.slice(1),16);
  return [(n>>16&255)/255,(n>>8&255)/255,(n&255)/255];
}
function syncColors(){
  state.a=hexToVec3(controls.a.value);
  state.b=hexToVec3(controls.b.value);
  state.d=hexToVec3(controls.d.value);
  state.base=hexToVec3(controls.base.value);
}
function setVec3(loc,v){gl.uniform3f(loc,v[0],v[1],v[2]);}
function uploadStaticUniforms(){
  gl.uniform1f(U.seed,seed%1000000);
  gl.uniform1f(U.distortion,state.distortion);
  gl.uniform1f(U.blur,state.blur);
  gl.uniform1f(U.density,state.density);
  gl.uniform1f(U.scale,state.scale);
  gl.uniform1f(U.noise,state.noise);
  setVec3(U.colorA,state.a);setVec3(U.colorB,state.b);setVec3(U.colorC,state.d);setVec3(U.base,state.base);
  uniformsDirty=false;
}
function renderFrame(){
  if(uniformsDirty)uploadStaticUniforms();
  gl.uniform1f(U.time,elapsed);
  gl.drawArrays(gl.TRIANGLES,0,3);
}
function positionThumbLabel(id){
  const input=controls[id],label=labels[id];
  const min=+input.min,max=+input.max,val=+input.value;
  const ratio=(val-min)/(max-min||1);
  const usable=Math.max(0,input.clientWidth-THUMB_WIDTH);
  const left=Math.round(ratio*usable);
  label.style.left=`${left}px`;
  input.closest('.slider').style.setProperty('--thumb-left',`${left}px`);
}
function positionAllThumbLabels(){sliders.forEach(positionThumbLabel);}
function displayDpr(){
  const cssPixels=Math.max(1,window.innerWidth*window.innerHeight);
  const densityFactor=Math.min(1,10/Math.max(1,state.density));
  const pixelBudget=Math.max(MIN_DISPLAY_PIXELS,BASE_DISPLAY_PIXELS*densityFactor);
  const byBudget=Math.sqrt(pixelBudget/cssPixels);
  return Math.max(.25,Math.min(window.devicePixelRatio||1,1.5,byBudget));
}
function resizeGLBuffer(width,height){
  if(canvas.width!==width)canvas.width=width;
  if(canvas.height!==height)canvas.height=height;
  gl.viewport(0,0,width,height);
  gl.uniform2f(U.resolution,width,height);
}
function resizeCanvas(){
  const dpr=displayDpr();
  resizeGLBuffer(Math.max(1,Math.round(window.innerWidth*dpr)),Math.max(1,Math.round(window.innerHeight*dpr)));
  positionAllThumbLabels();
  renderFrame();
}
function queueResize(){
  if(resizeRaf)return;
  resizeRaf=requestAnimationFrame(()=>{resizeRaf=0;resizeCanvas();});
}
function animate(stamp){
  const dt=Math.min((stamp-lastStamp)/1000,.05);lastStamp=stamp;
  elapsed+=dt*state.speed;
  renderFrame();
  rafId=requestAnimationFrame(animate);
}
function startAnimation(){
  if(paused||rafId)return;
  lastStamp=performance.now();
  rafId=requestAnimationFrame(function tick(stamp){rafId=0;animate(stamp);});
}
function stopAnimation(){
  if(rafId){cancelAnimationFrame(rafId);rafId=0;}
}
function requestRender(){
  uniformsDirty=true;
  if(paused)renderFrame();
}
function syncRange(id){
  const v=+controls[id].value;
  if(id==='scale')state.scale=v/100;
  else if(id==='distortion')state.distortion=v/400;
  else if(id==='speed')state.speed=v/100;
  else state[id]=v;
}
function bindRange(id){
  const e=controls[id];
  e.addEventListener('input',()=>{
    syncRange(id);
    positionThumbLabel(id);
    if(id==='density'){uniformsDirty=true;queueResize();}
    else if(id!=='speed')requestRender();
  },{passive:true});
  positionThumbLabel(id);
}
function setRange(id,value){
  controls[id].value=String(value);
  syncRange(id);
  positionThumbLabel(id);
}
function randInt(min,max){return Math.floor(min+Math.random()*(max-min+1));}
// Randomize each initial slider within its specified percentage of the full track.
function randomizeInitialSliders(){
  const ranges={
    distortion:[34,82],
    blur:[13,49],
    density:[17,45],
    scale:[38,62],
    noise:[72,88],
    speed:[62,78]
  };
  for(const [id,[low,high]] of Object.entries(ranges)){
    const input=controls[id];
    const min=Number(input.min),max=Number(input.max);
    const start=Math.ceil(min+(max-min)*low/100);
    const end=Math.floor(min+(max-min)*high/100);
    setRange(id,randInt(start,end));
  }
}
function randomize(){
  seed=Math.floor(Math.random()*1e9);
  setRange('distortion',randInt(0,400));
  setRange('blur',randInt(0,480));
  setRange('density',randInt(1,48));
  setRange('scale',randInt(0,100));
  setRange('noise',randInt(0,50));
  setRange('speed',randInt(20,720));
  queueResize();
  requestRender();
}
function nudge(){seed++;requestRender();}
function randomHslColor(minLightness,maxLightness){
  const hue=Math.random()*360;
  const saturation=.5+Math.random()*.5;
  const lightness=minLightness+Math.random()*(maxLightness-minLightness);
  const a=saturation*Math.min(lightness,1-lightness);
  const channel=n=>{
    const k=(n+hue/30)%12;
    return Math.round(255*(lightness-a*Math.max(-1,Math.min(k-3,9-k,1))));
  };
  return '#'+[channel(0),channel(8),channel(4)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
// Color families inspired by light leaks, prismatic film, and dyed clouds.
// Keep the colors editable in the existing four swatches.
const palettes=[
  ['#ff5a19','#fa2e91','#32c4f2','#e4c6b5'],
  ['#fe672b','#302c95','#0bc4ef','#f2dfcc'],
  ['#fa7a57','#744bf3','#42b0ff','#f5c6e0'],
  ['#97b9ff','#8d37f5','#5ce3f3','#92a5f9'],
  ['#ff6b00','#ff0d66','#ffd5a5','#edc9e4'],
  ['#ffad08','#ff4b69','#45eec5','#0942a1'],
  ['#fd6243','#ef6dcd','#93d2ff','#f1d8bf'],
  ['#2251cc','#009da3','#ffe02d','#b3cee0'],
  ['#f86556','#5141ab','#75dcff','#dfc7eb'],
  ['#b785ff','#00c9e9','#ffb13b','#f3cbde'],
  ['#c8eaff','#7a5cff','#00bbd9','#a6dbfa'],
  ['#ff4e50','#ef8a42','#9d83fd','#e9bfec']
];
let paletteIndex=-1;
function shufflePalette(){
  let next=Math.floor(Math.random()*palettes.length);
  if(next===paletteIndex)next=(next+1)%palettes.length;
  paletteIndex=next;
  colors.forEach((id,index)=>controls[id].value=palettes[next][index]);
  syncColors();requestRender();
}
function updateStatus(){qs('status').innerHTML=paused?'PAUSED':'CLOUDS BE DRIFTING<span class="status-dots">...</span>';}
function togglePause(){
  paused=!paused;
  if(paused){stopAnimation();renderFrame();}else startAnimation();
  updateStatus();
}
function toggleUI(){uiHidden=!uiHidden;qs('panel').classList.toggle('is-hidden',uiHidden);qs('legendHud').classList.toggle('is-hidden',uiHidden);}
function exportSize(){
  const cssW=Math.max(1,window.innerWidth),cssH=Math.max(1,window.innerHeight);
  const cssPixels=cssW*cssH;
  const budgetScale=Math.sqrt(MAX_EXPORT_PIXELS/cssPixels);
  const scale=Math.max(1,Math.min(window.devicePixelRatio||1,2,budgetScale));
  return [Math.round(cssW*scale),Math.round(cssH*scale)];
}
function savePNG(){
  const displayW=canvas.width,displayH=canvas.height;
  const [w,h]=exportSize();
  resizeGLBuffer(w,h);renderFrame();
  const pixels=new Uint8Array(w*h*4);
  gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
  const flipped=new Uint8ClampedArray(pixels.length);
  const row=w*4;
  for(let y=0;y<h;y++)flipped.set(pixels.subarray((h-1-y)*row,(h-y)*row),y*row);
  const out=document.createElement('canvas');out.width=w;out.height=h;
  out.getContext('2d').putImageData(new ImageData(flipped,w,h),0,0);
  resizeGLBuffer(displayW,displayH);renderFrame();
  out.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.download='sky.png';a.href=url;a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
}

randomizeInitialSliders();
shufflePalette();
sliders.forEach(bindRange);
colors.forEach(id=>controls[id].addEventListener('input',()=>{syncColors();requestRender();},{passive:true}));
qs('randomize').addEventListener('click',randomize);
qs('shufflePalette').addEventListener('click',shufflePalette);
// Do not leave controls focused after pointer interaction.
document.querySelectorAll('button,input').forEach(control=>{
  control.addEventListener('pointerup',()=>control.blur());
  control.addEventListener('change',()=>control.blur());
});
window.addEventListener('resize',queueResize,{passive:true});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)stopAnimation();else if(!paused)startAnimation();
});
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  // Space always controls animation, even immediately after using a slider or button.
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)togglePause();return;}
  const t=e.target;if(t&&(/INPUT|TEXTAREA|SELECT/.test(t.tagName)||t.isContentEditable))return;
  if(e.code==='KeyR'){e.preventDefault();randomize();}
  else if(e.code==='KeyN'){e.preventDefault();nudge();}
  else if(e.code==='KeyH'){e.preventDefault();toggleUI();}
  else if(e.code==='KeyS'){e.preventDefault();savePNG();}
});

updateStatus();
resizeCanvas();
startAnimation();
</script>
