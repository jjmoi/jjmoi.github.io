<style>
:root{
  --ui:#ffffff;
  --ink:#0a0a0a;
  --muted:#777;
  --line:#d8d8d8;
  --accent:#f2184f;
  --paper:#efede7;
  --panel:350px;
}
*{box-sizing:border-box}
html,body{
  margin:0;height:100%;background:var(--ui);color:var(--ink);
  font-family:Helvetica,Arial,sans-serif;font-optical-sizing:auto;font-weight:600;
}
body{overflow:hidden}
button,input,select{
  font:inherit;font-weight:600;font-optical-sizing:auto;text-transform:uppercase;color:var(--ink)
}
button{border:0;background:none;cursor:pointer}
.mobile-nav,.mobile-panel-head,.mobile-panel-actions{display:none}
.app{height:100vh;display:grid;grid-template-columns:var(--panel) 1fr}
.panel{
  height:100vh;overflow:auto;padding:18px 18px 92px;
  background:#fff;border-right:0
}
h1{font-size:15px;line-height:1;margin:0 0 8px}
.desc{font-size:10px;line-height:1.15;max-width:280px;margin-bottom:34px}
.section-title{
  font-size:9px;line-height:1;margin:30px 0 12px;padding-top:0;border-top:0
}
.row{
  display:grid;grid-template-columns:104px 1fr 38px;
  align-items:center;gap:8px;margin:10px 0
}
.row label{font-size:9px;line-height:1}
.value{font-size:9px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{
  height:2px;background:linear-gradient(90deg,var(--accent) 0 var(--fill,50%),#d5d5d5 var(--fill,50%) 100%)
}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:10px;height:10px;border-radius:50%;background:#fff;border:1px solid #cfcfcf;margin-top:-4px
}
input[type=range]::-moz-range-track{height:2px;background:#d5d5d5}
input[type=range]::-moz-range-progress{height:2px;background:var(--accent)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border:1px solid #cfcfcf;border-radius:50%;background:#fff}
input[type=color]{
  appearance:none;-webkit-appearance:none;width:18px;height:18px;padding:0;border:0;background:none;cursor:pointer
}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:0}
input[type=color]::-moz-color-swatch{border:0;border-radius:0}
.segmented{display:grid;gap:0;margin:8px 0 12px;border:1px solid var(--line);overflow:hidden}
.segmented.two{grid-template-columns:repeat(2,1fr)}
.segmented.three{grid-template-columns:repeat(3,1fr)}
.segmented.four{grid-template-columns:repeat(4,1fr)}
.segmented button{
  height:31px;border:0;border-left:1px solid var(--line);font-size:8px;background:#fff
}
.segmented button:first-child{border-left:0}
#aspectModes{margin-bottom:34px}
.segmented button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.palette{display:grid;grid-template-columns:104px 1fr 38px;align-items:center;gap:8px;margin-top:12px}
.palette label{font-size:9px}
.swatches{display:flex;gap:5px}
.seed-row{display:grid;grid-template-columns:104px 1fr;align-items:center;margin-top:10px}
.seed-row label{font-size:9px}
.seed-value{font-size:9px;text-align:right}
.toggle-row{
  display:grid;grid-template-columns:104px 1fr;align-items:center;gap:8px;margin:10px 0
}
.toggle-row label{font-size:9px}
.switch{
  width:34px;height:18px;background:#d4d4d4;position:relative;cursor:pointer;border:0
}
.switch::after{
  content:"";position:absolute;width:14px;height:14px;background:#fff;left:2px;top:2px;transition:.12s
}
.switch.on{background:var(--accent)}
.switch.on::after{left:18px}
.actions{
  position:fixed;left:0;bottom:0;width:var(--panel);height:70px;background:#fff;
  display:grid;grid-template-columns:1fr;z-index:10;padding:13px 12px 15px;gap:7px
}
.actions button{background:#f3f3f3;border-radius:4px;font-size:9px}
.actions button:active{background:#000;color:#fff}
.stage{
  position:relative;min-width:0;min-height:0;background:#efefef;
  display:flex;align-items:center;justify-content:center;padding:34px
}
.canvas-shell{
  --canvas-ratio:1;
  position:relative;width:min(calc(82vh * var(--canvas-ratio)),calc(100vw - var(--panel) - 70px));
  aspect-ratio:var(--canvas-ratio);
  display:flex;align-items:center;justify-content:center
}
canvas{
  display:block;width:100%;height:100%;background:var(--paper);
  box-shadow:0 0 0 1px rgba(0,0,0,.08)
}
.stage-export{
  position:absolute;top:12px;right:12px;z-index:2;width:28px;height:28px;padding:6px;
  display:flex;align-items:center;justify-content:center;background:transparent;color:var(--ink);
  text-decoration:none;opacity:0;pointer-events:none;transition:opacity .12s ease
}
.stage-export svg{display:block;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.canvas-shell:hover .stage-export,.stage-export:focus-visible{opacity:1;pointer-events:auto}
/* Small screens: prioritize the artwork, with settings in a fullscreen sheet. */
@media(max-width:800px){
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .mobile-nav{
    display:flex;align-items:center;justify-content:space-between;
    flex:0 0 54px;padding:0 18px;background:#fff;
  }
  .mobile-nav span,.mobile-nav button,.mobile-panel-head span,.mobile-panel-head button{
    font-size:11px;line-height:1;text-transform:uppercase;
  }
  .mobile-nav button,.mobile-panel-head button{padding:12px 0 12px 16px}
  .panel{display:none}
  body.config-open .panel{
    display:block;position:fixed;inset:0;z-index:50;
    width:100%;height:100vh;height:100dvh;max-width:none;
    overflow-y:auto;overscroll-behavior:contain;
    padding:0 18px calc(102px + env(safe-area-inset-bottom));
    background:#fff;border:0;
  }
  .mobile-panel-head{
    display:flex;position:sticky;top:0;z-index:1;
    align-items:center;justify-content:space-between;height:54px;
    margin:0 -18px;padding:0 18px;background:#fff;
  }
  .panel h1,.panel .desc{display:none}
  .panel .layout-title{margin-top:24px}
  .row{grid-template-columns:104px minmax(0,1fr) 38px}
  .mobile-panel-actions{
    display:grid;position:fixed;bottom:0;left:0;right:0;
    grid-template-columns:1fr 1fr;gap:8px;z-index:2;
    padding:12px 18px calc(14px + env(safe-area-inset-bottom));background:#fff;
  }
  .mobile-panel-actions button{
    min-height:44px;background:#f3f3f3;border-radius:4px;font-size:9px;
  }
  .mobile-panel-actions button:active{background:#000;color:#fff}
  .stage{flex:1;min-height:0;width:100%;padding:16px}
  .canvas-shell{
    width:min(calc(100vw - 32px),calc((100dvh - 94px) * var(--canvas-ratio)));max-width:100%;
    aspect-ratio:var(--canvas-ratio);
  }
  .stage-export,.actions{display:none}
}
@media(max-width:360px){
  .segmented button{font-size:7px}
  .row{grid-template-columns:90px minmax(0,1fr) 34px}
  .palette{grid-template-columns:90px 1fr 34px}
}

<body>
<div class="app">
<nav class="mobile-nav" aria-label="Main navigation">
  <span>DIANOUNCE</span><button id="configOpen" type="button" aria-controls="configPanel" aria-expanded="false">CONFIG</button>
</nav>
<aside class="panel" id="configPanel">
  <div class="mobile-panel-head"><span>CONFIG</span><button id="configClose" type="button">CLOSE</button></div>
  <h1>Dianounce</h1>
  <div class="desc">Network diagrams &amp; flows</div>
  <div class="section-title layout-title">LAYOUT</div>
  <div class="segmented four" id="layouts">
    <button data-layout="hierarchy">TREE</button><button data-layout="matrix">MATRIX</button>
    <button data-layout="radial">RADIAL</button><button data-layout="flow">FLOW</button>
  </div>

  <div class="section-title">STYLE</div>
  <div class="segmented four" id="lineStyles">
    <button data-line="straight">STRAIGHT</button><button data-line="elbow">ELBOW</button><button data-line="curve">CURVE</button><button data-line="handdrawn">HANDDRAWN</button>
  </div>

  <div class="section-title">FORMAT</div>
  <div class="segmented two" id="aspectModes" role="group" aria-label="Canvas format">
    <button type="button" data-aspect="1:1">1:1</button><button type="button" data-aspect="16:9">16:9</button>
  </div>

  <div id="controls"></div>

  <div class="toggle-row"><label>LABELS</label><button id="labelsToggle" class="switch on" aria-label="Labels"></button></div>

  <div class="palette"><label>PALETTE</label><div class="swatches">
    <input id="ink" type="color" value="#111111"><input id="accentColor" type="color" value="#ef1749">
    <input id="gray" type="color" value="#b2b2ae"><input id="paper" type="color" value="#efede7">
  </div></div>
  <div class="mobile-panel-actions">
    <button id="mobileRandomize" type="button">REGENERATE</button>
    <button id="mobileExport" type="button">DOWNLOAD PNG</button>
  </div>
</aside>
<main class="stage">
  <div class="canvas-shell"><button class="stage-export" id="export" aria-label="Download" title="Download"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"></path><path d="m7 10 5 5 5-5"></path><path d="M5 21h14"></path></svg></button><canvas id="canvas" width="1800" height="1800"></canvas></div>
</main>
<div class="actions"><button id="randomize">REGENERATE</button></div>
</div>
<script>
"use strict";

function rng(seed){
  let a=seed>>>0;
  return function(){
    a+=0x6D2B79F5;
    let t=a;
    t=Math.imul(t^t>>>15,t|1);
    t^=t+Math.imul(t^t>>>7,t|61);
    return ((t^t>>>14)>>>0)/4294967296;
  }
}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=(a,r)=>a[Math.floor(r()*a.length)];
function hexAlpha(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function updateFill(el){
  const min=Number(el.min),max=Number(el.max),v=Number(el.value);
  el.style.setProperty("--fill",`${((v-min)/(max-min))*100}%`);
}
function makeSlider(root,state,def,render){
  const [key,label,min,max,step]=def;
  const row=document.createElement("div");row.className="row";
  const lab=document.createElement("label");lab.textContent=label;
  const input=document.createElement("input");
  input.type="range";input.min=min;input.max=max;input.step=step;input.value=state[key];input.id=key;
  const value=document.createElement("div");value.className="value";value.id="v_"+key;value.textContent=state[key];
  input.addEventListener("input",()=>{
    state[key]=Number(input.value);value.textContent=input.value;updateFill(input);render();
  });
  row.append(lab,input,value);root.append(row);updateFill(input);
}
function syncSliders(state,defs){
  defs.forEach(([key])=>{
    const el=document.getElementById(key); if(!el)return;
    el.value=state[key];document.getElementById("v_"+key).textContent=Math.round(state[key]);updateFill(el);
  });
}
function downloadCanvas(canvas,name,render){
  render();
  const a=document.createElement("a");
  a.download=name;a.href=canvas.toDataURL("image/png");a.click();
}

const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
const canvasShell=document.querySelector(".canvas-shell");
let W=canvas.width,H=canvas.height;
function applyAspect(){
  const wide=state.aspect==="16:9";
  canvas.width=wide?3200:1800;
  canvas.height=1800;
  W=canvas.width;H=canvas.height;
  canvasShell.style.setProperty("--canvas-ratio",String(W/H));
}
const state={
  seed:19374,layout:"flow",lineStyle:"curve",aspect:"1:1",labels:true,
  nodeCount:32,branching:2,nodeScale:47,lineWeight:30,spacing:41,connectionDensity:34,
  hierarchyBias:33,accentMix:100,shapeMix:71,labelScale:61,
  ink:"#111111",accentColor:"#ef1749",gray:"#b2b2ae",paper:"#efede7"
};
const defs=[
  ["nodeCount","COUNT",6,40,1],["branching","BRANCHING",1,5,1],["nodeScale","SCALE",20,100,1],
  ["lineWeight","WEIGHT",10,100,1],["spacing","SPACING",20,100,1],
  ["connectionDensity","CONNECTIONS",10,100,1],["hierarchyBias","HIERARCHY",0,100,1],
  ["accentMix","ACCENT",0,100,1],["shapeMix","SHAPE",0,100,1],
  ["labelScale","LABEL",20,100,1]
];
// Screenshot values are the center of a randomized 20–40% slider travel window.
const baseline={
  nodeCount:32,branching:2,nodeScale:47,lineWeight:30,spacing:41,
  connectionDensity:34,hierarchyBias:33,accentMix:100,shapeMix:71,labelScale:61
};
function randomizeSliderValues(r){
  defs.forEach(([key,,min,max,step])=>{
    const halfWindow=(max-min)*(.20+r()*.20)/2;
    const lower=Math.max(min,baseline[key]-halfWindow);
    const upper=Math.min(max,baseline[key]+halfWindow);
    const picked=lower+r()*(upper-lower);
    state[key]=clamp(min+Math.round((picked-min)/step)*step,min,max);
  });
}
randomizeSliderValues(Math.random);
defs.forEach(d=>makeSlider(document.getElementById("controls"),state,d,render));
function syncUI(){
  syncSliders(state,defs);
  ["ink","accentColor","gray","paper"].forEach(k=>document.getElementById(k).value=state[k]);
  document.querySelectorAll("#layouts button").forEach(b=>b.classList.toggle("active",b.dataset.layout===state.layout));
  document.querySelectorAll("#lineStyles button").forEach(b=>b.classList.toggle("active",b.dataset.line===state.lineStyle));
  document.querySelectorAll("#aspectModes button").forEach(b=>{
    const active=b.dataset.aspect===state.aspect;
    b.classList.toggle("active",active);
    b.setAttribute("aria-pressed",String(active));
  });
  document.getElementById("labelsToggle").classList.toggle("on",state.labels);
}
document.querySelectorAll("#layouts button").forEach(b=>b.onclick=()=>{state.layout=b.dataset.layout;syncUI();render();});
document.querySelectorAll("#lineStyles button").forEach(b=>b.onclick=()=>{state.lineStyle=b.dataset.line;syncUI();render();});
document.querySelectorAll("#aspectModes button").forEach(b=>b.onclick=()=>{
  state.aspect=b.dataset.aspect;applyAspect();syncUI();render();
});
document.getElementById("labelsToggle").onclick=()=>{state.labels=!state.labels;syncUI();render();};
["ink","accentColor","gray","paper"].forEach(k=>document.getElementById(k).oninput=e=>{state[k]=e.target.value;render();});

function labelFor(i){
  const prefixes=["SYS","NODE","MOD","IO","BUS","SEQ","REF","AUX"];
  return `${prefixes[i%prefixes.length]}.${String(i+1).padStart(2,"0")}`;
}
function nodeShape(i,r){
  const t=state.shapeMix/100;
  if(i===0)return "circle";
  const v=r();
  if(v<t*.33)return "circle";
  if(v<t*.66)return "pill";
  return "rect";
}

function buildHierarchy(r,n){
  const nodes=[{id:0,parent:null,depth:0}],queue=[0];
  let next=1;
  while(next<n && queue.length){
    const parent=queue.shift();
    const depth=nodes[parent].depth+1;
    const b=clamp(Math.round(1+r()*state.branching),1,state.branching);
    for(let k=0;k<b && next<n;k++){
      nodes.push({id:next,parent,depth});queue.push(next);next++;
    }
  }
  const maxDepth=Math.max(...nodes.map(n=>n.depth));
  const bands=Array.from({length:maxDepth+1},()=>[]);
  nodes.forEach(n=>bands[n.depth].push(n));
  const marginX=W*(.09+(100-state.spacing)/100*.035);
  const marginY=H*(.09+(100-state.spacing)/100*.035);
  bands.forEach((band,d)=>{
    band.forEach((node,i)=>{
      const x=marginX+(W-2*marginX)*(band.length===1?.5:i/(band.length-1));
      const y=marginY+(H-2*marginY)*(maxDepth===0?.5:d/maxDepth);
      node.x=x;
      node.y=y;
    });
  });
  const edges=nodes.filter(n=>n.parent!==null).map(n=>[n.parent,n.id]);
  return {nodes,edges};
}

function buildMatrix(r,n){
  const cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),mx=W*.11,my=H*.11;
  const nodes=[];
  for(let i=0;i<n;i++){
    const c=i%cols,rr=Math.floor(i/cols);
    nodes.push({id:i,x:mx+(W-2*mx)*(cols===1?.5:c/(cols-1)),y:my+(H-2*my)*(rows===1?.5:rr/(rows-1))});
  }
  const edges=[];
  for(let i=0;i<n;i++){
    const c=i%cols,rr=Math.floor(i/cols);
    if(c<cols-1 && i+1<n && r()<.82)edges.push([i,i+1]);
    if(rr<rows-1 && i+cols<n && r()<.72)edges.push([i,i+cols]);
  }
  return {nodes,edges};
}

function buildRadial(r,n){
  const nodes=[{id:0,x:W*.5,y:H*.5}],edges=[];
  const rings=Math.max(1,Math.ceil((n-1)/8));
  for(let i=1;i<n;i++){
    const ring=1+((i-1)%rings);
    const index=Math.floor((i-1)/rings);
    const count=Math.ceil((n-1)/rings);
    const ang=(index/count)*Math.PI*2+ring*.38;
    const radiusX=(W*.34)*(ring/rings),radiusY=(H*.34)*(ring/rings);
    nodes.push({id:i,x:W*.5+Math.cos(ang)*radiusX,y:H*.5+Math.sin(ang)*radiusY});
    edges.push([0,i]);
    if(i>1 && r()<state.connectionDensity/150)edges.push([i-1,i]);
  }
  return {nodes,edges};
}

function buildFlow(r,n){
  const cols=clamp(Math.round(3+state.hierarchyBias/25),3,7);
  const groups=Array.from({length:cols},()=>[]);
  for(let i=0;i<n;i++)groups[i%cols].push(i);
  const nodes=Array(n),mx=W*.10,my=H*.10;
  groups.forEach((g,c)=>g.forEach((id,j)=>{
    nodes[id]={id,x:mx+(W-2*mx)*(c/(cols-1)),y:my+(H-2*my)*(g.length===1?.5:j/(g.length-1))};
  }));
  const edges=[];
  for(let c=0;c<cols-1;c++){
    groups[c].forEach(a=>{
      const targets=groups[c+1];
      if(!targets.length)return;
      const b=targets[Math.floor(r()*targets.length)];
      edges.push([a,b]);
      if(r()<state.connectionDensity/140 && targets.length>1)edges.push([a,targets[Math.floor(r()*targets.length)]]);
    });
  }
  return {nodes,edges};
}

function buildGraph(){
  const r=rng(state.seed+412),n=Math.round(state.nodeCount);
  let graph=state.layout==="matrix"?buildMatrix(r,n):state.layout==="radial"?buildRadial(r,n):state.layout==="flow"?buildFlow(r,n):buildHierarchy(r,n);
  graph.nodes.forEach((node,i)=>{
    node.shape=nodeShape(i,r);
    node.size=(H*.018+H*.030*state.nodeScale/100)*(i===0?1.9:(.75+r()*.75));
    node.color=(r()<state.accentMix/100*.30)?state.accentColor:(r()<.16?state.gray:state.ink);
  });
  return graph;
}

function drawEdge(a,b){
  ctx.strokeStyle=hexAlpha(state.ink,.45);ctx.lineWidth=.8+state.lineWeight/100*4.2;ctx.beginPath();
  if(state.lineStyle==="curve"){
    const mx=(a.x+b.x)/2;
    ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(mx,a.y,mx,b.y,b.x,b.y);
  }else if(state.lineStyle==="elbow"){
    const horizontalFirst=state.layout!=="hierarchy";
    ctx.moveTo(a.x,a.y);
    if(horizontalFirst){ctx.lineTo(b.x,a.y);ctx.lineTo(b.x,b.y);}
    else{ctx.lineTo(a.x,b.y);ctx.lineTo(b.x,b.y);}
  }else if(state.lineStyle==="handdrawn"){
    const edgeSeed=(state.seed + Math.round(a.x*13+a.y*17+b.x*19+b.y*23))>>>0;
    const r=rng(edgeSeed);
    const dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const nx=-dy/len,ny=dx/len;
    const steps=10;
    ctx.moveTo(a.x,a.y);
    for(let i=1;i<steps;i++){
      const t=i/steps;
      const taper=Math.sin(Math.PI*t);
      const wobble=(r()-.5)*Math.min(22,len*.035)*taper;
      ctx.lineTo(a.x+dx*t+nx*wobble,a.y+dy*t+ny*wobble);
    }
    ctx.lineTo(b.x,b.y);
  }else{ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}
  ctx.stroke();
}
function drawNode(n,r){
  const s=n.size;
  ctx.save();ctx.translate(n.x,n.y);ctx.fillStyle=n.color;ctx.strokeStyle=n.color;
  if(n.shape==="circle"){ctx.beginPath();ctx.arc(0,0,s*.5,0,Math.PI*2);ctx.fill();}
  else if(n.shape==="pill"){ctx.beginPath();ctx.roundRect(-s*.72,-s*.26,s*1.44,s*.52,s*.26);ctx.fill();}
  else{ctx.fillRect(-s*.5,-s*.5,s,s);}
  ctx.restore();

  if(state.labels){
    const fs=12+state.labelScale/100*18;
    ctx.font=`600 ${fs}px Helvetica,Arial,sans-serif`;ctx.fillStyle=state.ink;ctx.textBaseline="top";
    ctx.fillText(labelFor(n.id),n.x+s*.72,n.y-s*.18);
  }
}

function render(){
  ctx.fillStyle=state.paper;ctx.fillRect(0,0,W,H);
  const r=rng(state.seed+811),g=buildGraph();

  // Registration grid: intentionally faint and sparse.
  ctx.strokeStyle=hexAlpha(state.ink,.07);ctx.lineWidth=1;
  for(let i=1;i<10;i++){
    const x=i*W/10,y=i*H/10;
    ctx.beginPath();ctx.moveTo(x,H*.04);ctx.lineTo(x,H*.96);ctx.stroke();
    ctx.beginPath();ctx.moveTo(W*.04,y);ctx.lineTo(W*.96,y);ctx.stroke();
  }

  g.edges.forEach(([a,b])=>drawEdge(g.nodes[a],g.nodes[b]));
  g.nodes.forEach(n=>drawNode(n,r));

  // Diagram furniture.
  ctx.fillStyle=state.ink;
  ctx.font="600 16px Helvetica,Arial,sans-serif";ctx.fillText("SYSTEM MAP",W*.055,H*.955);
  ctx.font="600 11px Helvetica,Arial,sans-serif";ctx.fillText(`NODES ${g.nodes.length} / ${state.layout.toUpperCase()} / ${state.seed}`,W*.055,H*.973);
  ctx.fillRect(W*.84,H*.952,W*.105,2);
}

function randomize(){
  const r=rng((Date.now()^Math.floor(performance.now()*100000))>>>0);
  state.seed=Math.floor(10000+r()*89999);state.layout=pick(["hierarchy","matrix","radial","flow"],r);state.lineStyle=pick(["straight","elbow","curve","handdrawn"],r);
  randomizeSliderValues(r);state.labels=r()>.18;
  syncUI();render();
}
document.getElementById("randomize").onclick=randomize;
const exportImage=()=>downloadCanvas(canvas,`dianounce-${state.seed}-${state.aspect.replace(":","x")}.png`,render);
document.getElementById("export").onclick=exportImage;

const configPanel=document.getElementById("configPanel");
const configOpen=document.getElementById("configOpen");
const configClose=document.getElementById("configClose");
const compactScreen=window.matchMedia("(max-width:800px)");
function setConfig(open){
  const isOpen=Boolean(open && compactScreen.matches);
  const wasOpen=document.body.classList.contains("config-open");
  document.body.classList.toggle("config-open",isOpen);
  configOpen.setAttribute("aria-expanded",String(isOpen));
  if(isOpen){
    configPanel.setAttribute("role","dialog");
    configPanel.setAttribute("aria-modal","true");
    configPanel.setAttribute("aria-label","Configuration");
    configPanel.scrollTop=0;
    configClose.focus();
  }else{
    configPanel.removeAttribute("role");
    configPanel.removeAttribute("aria-modal");
    configPanel.removeAttribute("aria-label");
    if(wasOpen && compactScreen.matches)configOpen.focus();
  }
}
configOpen.onclick=()=>setConfig(true);
configClose.onclick=()=>setConfig(false);
compactScreen.addEventListener("change",()=>setConfig(false));
document.addEventListener("keydown",e=>{
  if(!document.body.classList.contains("config-open"))return;
  if(e.key==="Escape"){e.preventDefault();setConfig(false);return;}
  if(e.key!=="Tab")return;
  const focusable=Array.from(configPanel.querySelectorAll("button,input")).filter(el=>el.getClientRects().length);
  const first=focusable[0],last=focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement===first){e.preventDefault();last.focus();}
  else if(!e.shiftKey && document.activeElement===last){e.preventDefault();first.focus();}
});
document.getElementById("mobileRandomize").onclick=()=>{randomize();setConfig(false);};
document.getElementById("mobileExport").onclick=()=>{exportImage();setConfig(false);};
applyAspect();syncUI();render();
</script></body></html>
