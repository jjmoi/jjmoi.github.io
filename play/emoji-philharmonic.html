<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JJ → EMOJI PHILHARMONIC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* hall */
    --color-hall-deep: #110605;
    --color-hall: #22100b;
    --color-velvet: #6e1420;
    --color-velvet-deep: #34070d;
    --color-velvet-shine: #9a2a33;
    --color-wood: #5a3418;
    --color-wood-light: #7a4a22;
    --color-wood-dark: #3a1f0d;
    /* gilt */
    --color-gold: #d9a54a;
    --color-gold-light: #f6dc9a;
    --color-gold-soft: #f0cf8a;
    --color-gold-dim: #8a6a33;
    --color-gold-deep: #6b4718;
    /* paper + ink */
    --color-parchment: #f1e5c9;
    --color-parchment-deep: #e3d0a6;
    --color-parchment-edge: #c9ae7a;
    --color-ink: #2a1a10;
    --color-ink-soft: #5b4330;
    --color-ink-faint: rgba(42, 26, 16, 0.38);
    --color-ink-ghost: rgba(42, 26, 16, 0.10);
    --color-oxblood: #7a1a1f;
    --color-oxblood-deep: #561015;
    /* light */
    --color-cream: #f6ead2;
    --color-cream-dim: #c9b48f;
    --color-spot: rgba(255, 214, 150, 0.16);
    --color-light: rgba(255, 214, 150, 0.55);
    --color-light-edge: rgba(255, 214, 150, 0);
    --color-spot-edge: rgba(255, 214, 150, 0);
    --color-chandelier: rgba(255, 220, 160, 0.10);
    --color-riser: rgba(240, 207, 138, 0.14);
    --color-scrim: rgba(17, 6, 5, 0.86);
    --color-shadow: rgba(0, 0, 0, 0.55);
    --color-shadow-soft: rgba(42, 26, 16, 0.25);
    --color-glow: rgba(255, 200, 110, 0.55);
    --color-muted-label: #8c7556;
    --color-focus: #ffd98a;
    --color-focus-ink: #7a1a1f;

    /* type */
    --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    --font-ui: "Instrument Sans", system-ui, sans-serif;
    --font-music: "Apple Symbols", "Noto Music", "Segoe UI Symbol", serif;
    --text-hero: clamp(2.4rem, 5vw, 4.2rem);
    --text-title: clamp(1.7rem, 3vw, 2.6rem);
    --text-xl: clamp(1.4rem, 2.4vw, 1.9rem);
    --text-lg: clamp(1.15rem, 1.8vw, 1.45rem);
    --text-md: 1.05rem;
    --text-intro: calc(var(--text-md) + 2pt);
    --text-sm: 0.875rem;
    --text-xs: 0.75rem;
    --text-label: clamp(0.95rem, 1.4vw, 1.25rem);
    --text-emoji: clamp(1.5rem, 3.1vw, 2.7rem);
    --text-conductor: clamp(2.2rem, 4.4vw, 3.6rem);
    --tracking-caps: 0.22em;
    --tracking-wide: 0.12em;
    --leading-tight: 1.02;

    /* space */
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --space-7: 3rem;

    /* radii + borders */
    --radius-xs: 2px;
    --radius-sm: 4px;
    --radius-md: 10px;
    --radius-pill: 999px;
    --radius-arch: 50% 50% var(--radius-sm) var(--radius-sm) / 16% 16% var(--radius-sm) var(--radius-sm);
    --border-hair: 1px;
    --border-thick: 2px;
    --border-frame: clamp(10px, 1.6vw, 18px);

    /* sizes */
    --size-page-max: 1240px;
    --size-meter-h: 2px;
    --size-score-h: clamp(64px, 11vh, 112px);

    /* motion */
    --bob-distance: -12px;
    --sway-angle: 7deg;
    --bob-scale: 0.12;
    --ease-out: cubic-bezier(.2, .8, .2, 1);
    --dur-fast: 160ms;
    --dur-med: 360ms;
    --dur-float: 1400ms;
    --dur-curtain: 1600ms;
    --dur-bow: 700ms;
    --dur-ripple: 700ms;
    --bow-angle: 32deg;
    --bow-dip: 6px;
    --stagger-bow: 14ms;
    --size-light-w: 38%;
    --size-light-h: 44%;
    --size-ripple: 64px;
    --glow-lead-1: 0 0 6px var(--color-gold-light);
    --glow-lead-2: 0 0 16px var(--color-gold);
    --float-distance: -56px;
  }
  @media (prefers-reduced-motion: reduce) {
    :root { --bob-distance: -3px; --sway-angle: 1.5deg; --bob-scale: 0.03; --float-distance: -16px; }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(30% 18% at 50% 0%, var(--color-chandelier) 0%, transparent 100%),
      radial-gradient(120% 70% at 50% 0%, var(--color-hall) 0%, var(--color-hall-deep) 70%);
    color: var(--color-cream);
    font-family: var(--font-ui);
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: var(--border-thick) solid var(--color-focus); outline-offset: var(--border-thick); }

  /* ---------- curtains (swagged) ---------- */
  .curtain {
    position: fixed; top: 0; bottom: 0; width: 8vw; z-index: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg,
      var(--color-velvet-deep) 0, var(--color-velvet) 1.2vw, var(--color-velvet-shine) 1.7vw,
      var(--color-velvet) 2.2vw, var(--color-velvet-deep) 3.4vw);
    box-shadow: 0 0 var(--space-7) var(--color-shadow);
  }
  .curtain.left { left: 0; border-bottom-right-radius: 100% 30%; }
  .curtain.right { right: 0; border-bottom-left-radius: 100% 30%; }
  .curtain::after { display: none; /* gold tie-back */
    content: ""; position: absolute; top: 58%; height: var(--space-3); width: 100%;
    background: linear-gradient(180deg, var(--color-gold-light), var(--color-gold) 50%, var(--color-gold-deep));
    box-shadow: 0 var(--space-1) var(--space-2) var(--color-shadow);
  }

  main {
    position: relative; z-index: 1;
    max-width: var(--size-page-max);
    height: 100vh; height: 100dvh;
    margin: 0 auto;
    padding: var(--space-3) calc(8vw + var(--space-4));
    display: flex; flex-direction: column; gap: var(--space-3);
  }
  @media (min-height: 520px) { body { overflow: hidden; } }

  /* ---------- header + song picker ---------- */
  header { display: flex; justify-content: center; }
  h1 { font-family: var(--font-display); font-weight: 400; font-size: var(--text-title); line-height: var(--leading-tight); margin: 0; }
  h1 em { color: var(--color-gold-soft); }
  .songs { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: var(--space-1); }
  .song {
    display: grid; justify-items: center; gap: 0;
    padding: var(--space-2) var(--space-4); border: 0; border-radius: var(--radius-pill);
    background: none; cursor: pointer;
    color: var(--color-cream-dim); font-family: var(--font-display);
    transition: color var(--dur-fast), background var(--dur-fast);
  }
  .song .t { font-size: var(--text-md); line-height: 1.1; }
  .song .c { font-size: var(--text-xs); font-style: italic; }
  .desk .song { color: var(--color-ink-soft); }
  .desk .song:hover { color: var(--color-ink); background: var(--color-ink-ghost); }
  .desk .song[aria-checked="true"] { color: var(--color-parchment); background: var(--color-ink); }
  .desk .songs { flex: 1; justify-content: center; }

  /* ---------- gilded proscenium ---------- */
  .proscenium {
    position: relative; flex: 1 1 auto; min-height: 0;
    padding: var(--border-frame);
    border-radius: var(--radius-arch);
    background:
      linear-gradient(135deg, var(--color-gold-deep) 0%, var(--color-gold) 18%, var(--color-gold-light) 32%, var(--color-gold) 48%, var(--color-gold-deep) 62%, var(--color-gold) 80%, var(--color-gold-light) 100%);
    box-shadow: 0 var(--space-5) var(--space-7) var(--color-shadow), inset 0 0 0 var(--border-hair) var(--color-gold-light);
  }
  .proscenium::before { /* inner moulding */
    content: ""; position: absolute; inset: calc(var(--border-frame) / 2 - var(--border-hair));
    border-radius: var(--radius-arch);
    border: var(--border-hair) solid var(--color-gold-deep);
    pointer-events: none;
  }
  /* ---------- stage ---------- */
  .stage {
    position: relative;
    height: 100%;
    border-radius: var(--radius-arch);
    background:
      radial-gradient(60% 55% at 50% 52%, var(--color-spot) 0%, var(--color-spot-edge) 100%),
      linear-gradient(180deg, var(--color-hall-deep) 0%, var(--color-wood-dark) 30%, var(--color-wood) 100%);
    box-shadow: inset 0 0 var(--space-7) var(--color-shadow);
    overflow: hidden;
  }
  .stage::after { /* floorboards */
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, transparent 0, transparent 5.5%, var(--color-wood-dark) 5.5%, transparent 5.8%);
    opacity: 0.35;
    mask-image: linear-gradient(180deg, transparent 25%, black 100%);
  }
  .risers { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .risers path { fill: none; stroke: var(--color-riser); stroke-width: var(--border-thick); vector-effect: non-scaling-stroke; }

  .musician {
    position: absolute;
    left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
    transform: translate(-50%, -50%) scale(var(--depth, 1));
    z-index: 2;
    transition: opacity var(--dur-med) var(--ease-out), filter var(--dur-med) var(--ease-out);
  }
  .musician .body {
    display: block; position: relative;
    transform-origin: 50% 90%;
    /* transform written per frame from --bob-distance, --sway-angle, --bob-scale */
    will-change: transform;
  }
  .musician { background: none; border: 0; padding: var(--space-1); cursor: pointer; border-radius: var(--radius-md); color: inherit; font: inherit; }
  .musician .inst {
    font-size: var(--text-emoji); line-height: 1; display: block;
    filter: drop-shadow(0 var(--space-1) var(--space-1) var(--color-shadow));
    transition: transform var(--dur-bow) var(--ease-out), filter var(--dur-med) var(--ease-out);
    transition-delay: calc(var(--i, 0) * var(--stagger-bow));
  }
  .musician.muted { opacity: 0.32; filter: grayscale(0.9); }
  .musician.lead .inst { filter: drop-shadow(var(--glow-lead-1)) drop-shadow(var(--glow-lead-2)); transition-delay: 0s; }
  .stage.soloing .musician:not(.solo) { opacity: 0.22; filter: grayscale(0.85); }
  .musician.solo { z-index: 6; }
  .musician.solo::after {
    content: attr(data-name); position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, calc(var(--space-1) * -1));
    padding: 0 var(--space-2); border-radius: var(--radius-pill); white-space: nowrap;
    background: var(--color-gold-soft); color: var(--color-ink);
    font-family: var(--font-display); font-size: var(--text-sm);
  }
  .stage.bowing .musician .inst { transform: rotate(var(--bow-angle)) translateY(var(--bow-dip)); }
  .stage.bowing .conductor .baton { transform: rotate(70deg); }

  /* section spotlights — brightness follows each section's real output */
  .light {
    position: absolute; z-index: 1; pointer-events: none;
    left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
    width: var(--size-light-w); height: var(--size-light-h);
    transform: translate(-50%, -50%);
    background: radial-gradient(closest-side, var(--color-light), var(--color-light-edge));
    opacity: var(--level, 0);
    mix-blend-mode: screen;
  }

  /* tap-to-conduct */
  .ripple {
    position: absolute; z-index: 7; pointer-events: none;
    left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
    width: var(--size-ripple); height: var(--size-ripple); border-radius: 50%;
    border: var(--border-thick) solid var(--color-gold-light);
    transform: translate(-50%, -50%) scale(0.2);
    animation: ripple var(--dur-ripple) var(--ease-out) forwards;
  }
  @keyframes ripple { to { transform: translate(-50%, -50%) scale(1); opacity: 0; } }
  /* the baton is the cursor: over the open stage it leaves the podium and follows the pointer */
  .stage { touch-action: none; }
  .stage.hovering:not(.closed), .stage.hovering:not(.closed) * { cursor: none; }
  .stage.hovering:not(.closed) .conductor .baton { opacity: 0; }
  .guide { position: absolute; inset: 0; z-index: 8; pointer-events: none; }
  .guide-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .guide-svg #guideOrigin { fill: none; stroke: var(--color-gold-light); stroke-width: var(--border-thick); opacity: 0; transition: opacity var(--dur-fast); }
  .stage.holding .guide-svg #guideOrigin { opacity: 1; }
  .guide-baton { /* the handle sits on the pointer; the tip leans with the stroke */
    position: absolute; left: calc(var(--hx) * 1px); top: calc(var(--hy) * 1px);
    font-size: var(--text-conductor); line-height: 1;
    transform-origin: 15% 85%;
    transform: translate(-15%, -85%) rotate(calc(var(--tilt, 0) * 1deg));
    filter: drop-shadow(0 var(--space-1) var(--space-2) var(--color-shadow));
    opacity: 0;
  }
  .stage.hovering:not(.closed) .guide-baton, .stage.holding .guide-baton { opacity: 1; }
  .section-label.focus { color: var(--color-gold-light); background: var(--color-ink-ghost); box-shadow: 0 0 var(--space-5) var(--color-glow); }

  /* stage curtains */
  .drape {
    position: absolute; top: 0; bottom: 0; width: 51%; z-index: 9; pointer-events: none;
    background: repeating-linear-gradient(90deg,
      var(--color-velvet-deep) 0, var(--color-velvet) 1.6%, var(--color-velvet-shine) 2.4%,
      var(--color-velvet) 3.2%, var(--color-velvet-deep) 5%);
    box-shadow: 0 0 var(--space-7) var(--color-shadow);
    transition: transform var(--dur-curtain) cubic-bezier(.65, 0, .35, 1);
  }
  .drape.left { left: 0; transform: translateX(-101%); }
  .drape.right { right: 0; transform: translateX(101%); }
  .stage.closed .drape { transform: none; }

  .note {
    position: absolute; z-index: 1; pointer-events: none;
    left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
    color: var(--color-gold-soft); font-family: var(--font-display); font-size: var(--text-lg);
    animation: float var(--dur-float) var(--ease-out) forwards;
  }
  @keyframes float {
    from { opacity: 0.95; transform: translate(-50%, -120%) rotate(0deg); }
    to { opacity: 0; transform: translate(calc(-50% + var(--drift) * 1px), calc(-120% + var(--float-distance))) rotate(calc(var(--drift) * 1deg)); }
  }

  .section-label {
    position: absolute; z-index: 3;
    left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
    transform: translate(-50%, -50%);
    font-family: var(--font-display); font-style: italic; font-size: var(--text-label);
    color: var(--color-gold-soft);
    background: none; border: 0; padding: var(--space-1) var(--space-3); border-radius: var(--radius-pill);
    cursor: pointer; white-space: nowrap;
    text-shadow: 0 var(--border-hair) var(--space-2) var(--color-shadow);
    transition: color var(--dur-fast), background var(--dur-fast), box-shadow var(--dur-med);
  }
  .section-label:hover { background: var(--color-ink-ghost); }
  .section-label[aria-pressed="false"] { color: var(--color-muted-label); text-decoration: line-through; }

  .conductor { position: absolute; left: 50%; bottom: 0; z-index: 4; transform: translate(-50%, 0); line-height: 1; text-align: center; }
  .podium {
    width: calc(var(--text-conductor) * 2); height: var(--space-4);
    margin: 0 auto; border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    background: linear-gradient(180deg, var(--color-wood-light), var(--color-wood-dark));
    border-top: var(--border-thick) solid var(--color-gold);
  }
  .conductor .who { display: inline-block; position: relative; transform: translateY(calc(var(--bob, 0) * var(--bob-distance) * 0.5)); }
  .conductor .baton { display: inline-block; font-size: var(--text-conductor); transform-origin: 15% 85%; transform: rotate(calc(var(--baton, 0) * 1deg)); }

  .now {
    position: absolute; bottom: var(--space-3); left: var(--space-5); right: var(--space-5); z-index: 5;
    display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-4);
    font-family: var(--font-display); font-size: var(--text-md); color: var(--color-cream-dim);
    pointer-events: none;
  }
  .now span { max-width: 36%; }
  .now span:last-child { text-align: right; }
  .now i { color: var(--color-gold-soft); }
  .rmark { /* rehearsal mark */
    display: inline-grid; place-items: center; min-width: 1.5em; height: 1.5em; margin-right: var(--space-2);
    border: var(--border-hair) solid var(--color-gold); border-radius: var(--radius-xs);
    color: var(--color-gold-soft); font-style: normal; font-weight: 400;
  }

  .overlay {
    position: absolute; inset: 0; z-index: 10;
    display: grid; place-items: center; text-align: center;
    background: transparent;
    transition: opacity var(--dur-med) var(--ease-out);
  }
  .overlay.hidden { opacity: 0; pointer-events: none; }
  .overlay p.sub { font-family: var(--font-display); font-style: italic; font-size: var(--text-lg); color: var(--color-gold-light); margin: var(--space-4) 0 0; }
  .btn-hero { background: var(--color-scrim); }
  .overlay p.intro {
    /* same parchment and ink as the score */
    max-width: 34em; margin: var(--space-6) auto 0; padding: var(--space-4) var(--space-6);
    font-size: var(--text-intro); line-height: 1.45; font-style: italic; color: var(--color-ink); letter-spacing: 0.4px;
  }
  .overlay p.intro { box-shadow: none; }
  .overlay p.intro::before { display: none; } /* parchment without the engraved double rule or shadow */
  .overlay .error { color: var(--color-gold-light); font-family: var(--font-ui); font-size: var(--text-sm); margin: var(--space-3) 0 0; }
  .btn-hero {
    font-family: var(--font-display); font-size: var(--text-hero); line-height: 1.1;
    padding: var(--space-3) var(--space-7);
    color: var(--color-gold-light); background: transparent; cursor: pointer;
    border: var(--border-hair) solid var(--color-gold);
    outline: var(--border-hair) solid var(--color-gold-dim); outline-offset: var(--space-1);
    border-radius: var(--radius-sm);
    transition: background var(--dur-fast), color var(--dur-fast);
  }
  .btn-hero:hover { background: var(--color-gold); color: var(--color-ink); }

  /* ---------- paper: score strip + programme ---------- */
  .paper {
    position: relative;
    background:
      radial-gradient(120% 140% at 50% 40%, var(--color-parchment) 55%, var(--color-parchment-deep) 100%);
    color: var(--color-ink);
    border-radius: var(--radius-xs);
    box-shadow: 0 var(--space-3) var(--space-6) var(--color-shadow);
  }
  .paper::before { /* engraved double rule */
    content: ""; position: absolute; inset: var(--space-2); pointer-events: none;
    border: var(--border-hair) solid var(--color-ink-faint);
    outline: var(--border-hair) solid var(--color-ink-faint); outline-offset: calc(var(--space-1) * -1 - var(--border-hair));
  }
  .paper :focus-visible { outline-color: var(--color-focus-ink); }

  .desk { flex: none; padding: var(--space-5) var(--space-6); display: grid; gap: var(--space-3); } /* clear of the engraved rule inset */
  .staff { display: block; width: 100%; height: var(--size-score-h); }
  .staff-wrap { position: relative; overflow: hidden; }
  .staff-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  .roll { position: absolute; top: 0; left: 0; height: 100%; will-change: transform; } /* slides on the compositor, no relayout */
  .roll svg { display: block; height: 100%; }
  .staff .line { stroke: var(--color-ink); stroke-width: 1.1; }
  .staff .bar { stroke: var(--color-ink); stroke-width: 1; }
  .staff .bar.final { stroke-width: 3; }
  .staff .head { fill: var(--color-ink); }
  .staff .head.open { fill: none; stroke: var(--color-ink); stroke-width: 1.5; }
  .staff .stem, .staff .flag, .staff .ledger { stroke: var(--color-ink); stroke-width: 1.1; fill: none; }
  .staff .dot { fill: var(--color-ink); }
  .staff .n.active .head { fill: var(--color-oxblood); }
  .staff .n.active .head.open { fill: none; stroke: var(--color-oxblood); }
  .staff .n.active .stem, .staff .n.active .flag { stroke: var(--color-oxblood); }
  .staff .glyph { fill: var(--color-ink); font-family: var(--font-music); }
  .staff .num { fill: var(--color-ink); font-family: var(--font-display); }
  .staff .rm rect { fill: none; stroke: var(--color-ink); stroke-width: 1; }
  .staff .rm text { fill: var(--color-ink); font-family: var(--font-display); }
  .staff .mark { fill: var(--color-ink-soft); font-family: var(--font-display); font-style: italic; }
  .staff .paperbg { fill: var(--color-parchment); }
  .staff .fade { fill: url(#fadeGrad); }
  .staff stop { stop-color: var(--color-parchment); }
  .staff .playhead { stroke: var(--color-oxblood); stroke-width: 1.2; stroke-dasharray: 2 3; }

  .desk-row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); }
  #resetBtn { margin-left: auto; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    padding: var(--space-2) var(--space-4);
    border: var(--border-hair) solid var(--color-ink); border-radius: var(--radius-sm);
    background: transparent; color: var(--color-ink);
    font-family: var(--font-display); font-size: var(--text-md); line-height: 1.15; cursor: pointer;
    transition: background var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
  }
  .btn:hover { background: var(--color-ink-ghost); }
  .btn:active { transform: scale(0.97); }

    transpose: [0, 0, 0, 0],
    verses: [{ melody: line(A), harmony: HA }, { melody: line(B), harmony: HB }, { melody: line(A), harmony: HA }],
    captions: ['<i>Grazioso</i> — the first strain', '<i>Seconda parte</i> — the second strain', '<i>Da capo, tutti</i> — the first strain again', '<i>Coda, ritardando</i>'],

const SONGS = [ODE, CANON, MINUET];
const REHEARSAL = 'ABCDEFGHIJKLM';
const TEMPO_TERMS = [[60, 'Largo'], [66, 'Larghetto'], [76, 'Adagio'], [108, 'Andante'], [120, 'Moderato'], [156, 'Allegro'], [176, 'Vivace'], [999, 'Presto']];
const tempoTerm = bpm => TEMPO_TERMS.find(([x]) => bpm < x)[1];

/* current song + derived geometry */
let SONG, BPB, VERSE_BEATS, LOOP_BEATS, LOOP_STEPS, GLOBAL_MELODY;
function setSong(song) {
  SONG = song; BPB = song.bpb; VERSE_BEATS = VERSE_BARS * BPB;

setSong(ODE);

/* ============================================================
   ORCHESTRA — 5 sections of instruments
   part spec per verse: role string, [role, fromBar], or null
   ============================================================ */
const SECTIONS = [
  { id:'brass', name:'Brass', it:'Ottoni', icon:'🎺', key:'1', row:{ ax:44, ay:50, a0:30, a1:72 } },
  { id:'strings', name:'Strings', it:'Archi', icon:'🎻', key:'2', row:{ ax:30, ay:28, a0:-64, a1:64 } },
  { id:'percussion', name:'Percussion', it:'Percussioni', icon:'🥁', key:'3', row:{ ax:20, ay:60, a0:-26, a1:26 } },
  { id:'keys', name:'Keys', it:'Tastiere', icon:'🎹', key:'4', row:{ ax:44, ay:50, a0:-72, a1:-30 } },
  { id:'winds', name:'Woodwinds', it:'Legni', icon:'🪈', key:'5', row:{ ax:40, ay:86, a0:-38, a1:38 } },
];
const M = (section, name, inst, voice, parts, o = {}) => ({ section, name, inst, voice, parts, oct: 0, center: 62, gain: 1, ...o });
const MUSICIANS = [
  // brass — sawtooth + filter
  M('brass','Trumpet I','🎺','brass',[null,'melody','melody'],{ oct:0, gain:.9 }),
  M('brass','Trumpet II','🎺','brass',[null,'melody',['harm3',0]],{ oct:0, gain:.75 }),
  M('brass','Trumpet III','🎺','brass',[null,['harm3',8],'harm3'],{ oct:0, gain:.7 }),
  M('brass','Horn I','📯','brass',[['pad1',12],'pad1','pad2'],{ center:62, gain:.6 }),
  M('brass','Horn II','📯','brass',[['pad2',12],'pad2','pad1'],{ center:57, gain:.6 }),
  M('brass','Trombone I','🎺','brass',[null,'stab','bass4'],{ center:50, gain:.6 }),
  M('brass','Trombone II','🎺','brass',[null,['bass',8],'bass'],{ center:43, gain:.65 }),
  // strings — sawtooth + vibrato
  M('strings','Violin I','🎻','strings',['melody','melody','melody'],{ oct:12, gain:.75 }),
  M('strings','Violin I','🎻','strings',['melody','melody','melody'],{ oct:12, gain:.7 }),
  M('strings','Violin I','🎻','strings',['melody',['harm3',8],'melody'],{ oct:12, gain:.7 }),
  M('strings','Violin II','🎻','strings',['pad1','harm3','pulse1'],{ oct:12, center:66, gain:.6 }),
  M('strings','Violin II','🎻','strings',['pad1','harm3','pulse1'],{ oct:12, center:66, gain:.55 }),
  M('strings','Viola','🎻','strings',['pad2','pad2','pulse2'],{ center:57, gain:.6 }),
  M('strings','Cello','🎻','strings',['bass','bass','bass4'],{ center:45, gain:.85 }),
  M('strings','Cello','🎻','strings',[['bass',8],'bass','bass'],{ center:40, gain:.75 }),
  M('strings','Harp I','🪉','harp',['harpArp','harpArp','harpRun'],{ center:50, gain:.75, spot:[6, 86] }),
  M('strings','Harp II','🪉','harp',[['harpDown',8],'harpDown','harpGliss'],{ center:62, gain:.6, spot:[11.5, 85] }),
  M('strings','Harp III','🪉','harp',[null,['harpArp',8],'harpGliss'],{ center:43, gain:.6, spot:[17, 84] }),
  // percussion — noise + bandpass
  M('percussion','Timpani I','🪘','perc',['timp1','timp1','timp1'],{ center:45, gain:1 }),
  M('percussion','Timpani II','🪘','perc',[null,'timp2','timp2'],{ center:40, gain:.9 }),
  M('percussion','Bass drum','🥁','perc',[null,'kick','kick'],{ gain:1 }),
  M('percussion','Snare','🥁','perc',[null,'snare','snare'],{ gain:.8 }),
  // keys — triangle + harmonics
  M('keys','Piano RH','🎹','piano',['arp','block','arpHi'],{ center:62, gain:.7 }),
  M('keys','Piano II','🎹','piano',[null,['arp',8],'arp'],{ center:55, gain:.55 }),
  M('keys','Piano LH','🎹','piano',['bass','bass','bass'],{ center:38, gain:.7 }),

  M('keys','Organ','🎹','organ',[null,'padChord','padChord'],{ center:55, gain:.35 }),
  M('keys','Organ pedal','🎹','organ',[null,['bass',8],'bass'],{ center:33, gain:.5 }),

  M('winds','Piccolo','🪈','wind',[null,null,'melody'],{ oct:24, wind:'flute', gain:.45 }),
  M('winds','Flute I','🪈','wind',[['melody',8],'melody','melody'],{ oct:12, wind:'flute', gain:.7 }),
  M('winds','Flute II','🪈','wind',[['harm3',8],'harm3','harm3'],{ oct:12, wind:'flute', gain:.6 }),
  M('winds','Alto sax','🎷','wind',[null,'pad1','pad1'],{ center:66, wind:'sax', gain:.55 }),
  M('winds','Alto sax','🎷','wind',[null,['pad2',8],'pad2'],{ center:62, wind:'sax', gain:.5 }),
  M('winds','Tenor sax','🎷','wind',[['pad2',8],'pad2','pulse2'],{ center:57, wind:'sax', gain:.55 }),
  M('winds','Baritone sax','🎷','wind',[null,'bass','bass4'],{ center:45, wind:'sax', gain:.6 }),

/* ---------------- role → note events ---------------- */
function bassPitch(c, center) { return toneNear(c, 0, center); }
function verseLine(verse, delay = 0) { // melody notes landing in this verse, verse-relative beats
  const lo = verse * VERSE_BEATS, hi = lo + VERSE_BEATS;
  return GLOBAL_MELODY.filter(n => n.b + delay >= lo && n.b + delay < hi).map(n => ({ ...n, b: n.b + delay - lo }));
}
function genRole(role, mu, verse, fromBar) {
  const ev = [], base = verse * VERSE_BEATS, H = SONG.verses[verse].harmony, SL = SONG.slot, NS = VERSE_BEATS / SL;
  const push = (beat, midi, dur, vel = 1, extra = {}) => { if (beat < fromBar * BPB || beat >= VERSE_BEATS) return; ev.push({ beat: base + beat, midi, dur, vel, verse, ...extra }); };
  const chordAt = b => H[Math.min(NS - 1, Math.floor(b / SL))];
  const sustain = pitchFn => { // merged sustains, re-struck at each phrase
    let last = null;
    for (let h = 0; h < NS; h++) {
      if (h * SL < fromBar * BPB) continue;
      const p = pitchFn(H[h]), phraseStart = (h * SL) % (PHRASE_BARS * BPB) === 0;
      if (last && JSON.stringify(last.midi) === JSON.stringify(p) && !phraseStart) { last.dur += SL; continue; }

    case 'melody': verseLine(verse).forEach(n => push(n.b, n.m + mu.oct, n.d, accent(n.b), { lead: true })); break;
    case 'canon': case 'canon2': verseLine(verse, SONG.canonDelay * (role === 'canon2' ? 2 : 1) || 0).forEach(n => push(n.b, n.m + mu.oct, n.d, accent(n.b) * .9, { lead: true })); break;
    case 'harm3': verseLine(verse).forEach(n => push(n.b, below(chordAt(n.b), n.m) + mu.oct, n.d, .8)); break;
    case 'pad1': sustain(c => toneNear(c, 1, mu.center)); break;
    case 'pad2': sustain(c => toneNear(c, 2, mu.center)); break;
    case 'bass': sustain(c => bassPitch(c, mu.center)); break;
    case 'padChord': sustain(c => chordTones(c, mu.center).slice(0, 3)); break;
    case 'bass4': for (let b = 0; b < VERSE_BEATS; b++) push(b, bassPitch(chordAt(b), mu.center), .9, b % BPB ? .75 : 1); break;
    case 'pulse1': case 'pulse2': {
      const deg = role === 'pulse1' ? 1 : 2;
      for (let s = 0; s < VERSE_BEATS * 2; s++) { const b = s / 2; push(b, toneNear(chordAt(b), deg, mu.center), .42, s % 2 ? .7 : .95); }
      break;
    }
    case 'harpArp': case 'harpRun': { // rolled chords up two octaves
      const per = (role === 'harpRun' ? 4 : 2) * SL, stepB = SL / per;
      for (let h = 0; h < NS; h++) {
        const c = H[h], t = chordTones(c, mu.center).concat(chordTones(c, mu.center + 12), chordTones(c, mu.center + 24));
        for (let k = 0; k < per; k++) push(h * SL + k * stepB, t[k % t.length], 1.6, k === 0 ? 1 : Math.max(.4, .75 - k * .03));
      }
      break;
    }
    case 'harpDown': { // descending rolls, an eighth behind Harp I
      for (let h = 0; h < NS; h++) {
        const c = H[h], t = chordTones(c, mu.center).concat(chordTones(c, mu.center + 12)).reverse();
        for (let k = 0; k < 4; k++) push(h * SL + .5 + k * (SL - .5) / 4, t[k % t.length], 1.4, .7 - k * .05);
      }
      break;
    }
    case 'harpGliss': { // rolled downbeats, diatonic glissandi into each phrase
      const SCALE = [0, 2, 4, 5, 7, 9, 11].map(i => (SONG.tonicPc + i) % 12);
      for (let bar = 0; bar < VERSE_BARS; bar++) {
        const b0 = bar * BPB;
        if (bar % PHRASE_BARS === PHRASE_BARS - 1) {
          const run = []; for (let m = mu.center; run.length < 16; m++) if (SCALE.includes(m % 12)) run.push(m);
          run.forEach((m, k) => push(b0 + BPB - 2 + k / 8, m, 1.2, .45 + k * .035));
        } else chordTones(chordAt(b0), mu.center).forEach((m, k) => push(b0 + k * .125, m, 2.5, .9));
      }
      break;
    }
    case 'arp': case 'arpHi': {
      const shift = role === 'arpHi' ? 12 : 0; const pat = [0, 2, 1, 2];
      for (let s = 0; s < VERSE_BEATS * 2; s++) { const b = s / 2; const t = chordTones(chordAt(b), mu.center - 2 + shift); push(b, t[pat[s % 4] % t.length], .9, s % (BPB * 2) === 0 ? 1 : .7); }
      break;

  if (cur !== activeNote) { if (activeNote) activeNote.g.classList.remove('active'); if (cur) cur.g.classList.add('active'); activeNote = cur; }
}

/* floating notes */
const GLYPHS = ['♪', '♫', '♩', '♬'];
let liveNotes = 0;
function spawnNote(mu) {
  if (liveNotes > 18) return; liveNotes++;
  const n = document.createElement('span'); n.className = 'note';
  n.textContent = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
  n.style.setProperty('--x', mu.x.toFixed(2)); n.style.setProperty('--y', mu.y.toFixed(2));
  n.style.setProperty('--drift', ((Math.random() * 2 - 1) * 24).toFixed(1));
  n.setAttribute('aria-hidden', 'true');
  n.addEventListener('animationend', () => { n.remove(); liveNotes--; });
  stage.appendChild(n);
}

/* render loop */
function currentBeat(now) {
  if (!beatTimeline.length) return { beat: curBeat };
  let ref = beatTimeline[0];
  for (const b of beatTimeline) { if (b.t <= now) ref = b; else break; }
  return { beat: ref.beat + Math.max(0, now - ref.t) * ref.bpm / 60, info: ref.info, bpm: ref.bpm };
}
let lastVerse = -1, lastScoreKey = '';
const MOTION = {};
function readMotionTokens() { // motion distances live in CSS tokens (and shrink under reduced motion)
  const cs = getComputedStyle(document.documentElement);
  MOTION.bob = parseFloat(cs.getPropertyValue('--bob-distance')); MOTION.sway = parseFloat(cs.getPropertyValue('--sway-angle')); MOTION.scale = parseFloat(cs.getPropertyValue('--bob-scale'));
  MUSICIANS.forEach(mu => { mu.pBob = mu.pSway = 99; });
}
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', readMotionTokens);
const UI = { roll: $('roll'), baton: $('baton'), conductor: $('conductor'), nowVerse: $('nowVerse'), nowMeta: $('nowMeta') };
let rafId = 0, idleFrames = 0, lastLightT = 0, pAng = 99, pCBob = 99, pNowVerse = '', pNowMeta = '';
const LIGHT_GAIN = 26;
function frame() {
  rafId = 0;
  const now = ctx ? ctx.currentTime : performance.now() / 1000;
  const cb = playing ? currentBeat(now) : { beat: curBeat };
  if (playing) curBeat = cb.beat;
  const sectionLevel = {};
  MUSICIANS.forEach(mu => {
    while (mu.queue.length && mu.queue[0].t <= now) {
      const h = mu.queue.shift(); mu.hit = h.t; mu.hitVel = h.v; if (h.lead) mu.leadUntil = h.end;
      if (h.v > .55 && Math.random() < .07) spawnNote(mu);
    }
    const since = now - mu.hit;
    const bob = playing ? Math.min(1, mu.hitVel * 1.4) * Math.exp(-since * 7) : 0;
    const swayBase = playing && !S.muted[mu.section] ? (.35 + .65 * curDyn) * mu.swayAmt : .15;
    const sway = Math.sin(cb.beat * Math.PI / 2 + mu.swayPhase) * swayBase;
    if (Math.abs(bob - mu.pBob) > .004 || Math.abs(sway - mu.pSway) > .004) { // one transform write, sized by the CSS motion tokens
      mu.pBob = bob; mu.pSway = sway;
      mu.body.style.transform = `translateY(${(bob * MOTION.bob).toFixed(2)}px) rotate(${(sway * MOTION.sway).toFixed(2)}deg) scale(${(1 + bob * MOTION.scale).toFixed(3)})`;
    }
    sectionLevel[mu.section] = Math.max(sectionLevel[mu.section] || 0, bob);
    const lead = playing && now < (mu.leadUntil || 0);
    if (lead !== mu.isLead) { mu.isLead = lead; mu.el.classList.toggle('lead', lead); }
  });
  if (nodes && now - lastLightT > 1 / 30) { lastLightT = now; SECTIONS.forEach(sec => { // meters at 30 Hz
    sec.analyser.getFloatTimeDomainData(sec.buf);
    let ss = 0; for (let k = 0; k < sec.buf.length; k++) ss += sec.buf[k] * sec.buf[k];
    const target = Math.min(1, Math.sqrt(ss / sec.buf.length) * LIGHT_GAIN);
    sec.lvl += (target - sec.lvl) * (target > sec.lvl ? .5 : .09);
    if (Math.abs(sec.lvl - (sec.pLvl ?? 9)) > .006) { sec.pLvl = sec.lvl; sec.light.style.setProperty('--level', sec.lvl.toFixed(3)); }
  }); }
  // conductor: 4-beat pattern
  const bf = cb.beat % BPB, ph = bf % 1;
  const patt = BPB === 3 ? [-38, 26, 4] : [-38, 22, -6, 30]; const from = patt[Math.floor(bf)], to = patt[(Math.floor(bf) + 1) % BPB];
  const ang = playing ? from + (to - from) * (1 - Math.cos(ph * Math.PI)) / 2 : -20;
  const cbob = playing ? Math.exp(-ph * 5) * curDyn : 0;
  if (Math.abs(ang - pAng) > .3) { pAng = ang; UI.baton.style.setProperty('--baton', ang.toFixed(1)); }
  if (Math.abs(cbob - pCBob) > .004) { pCBob = cbob; UI.conductor.style.setProperty('--bob', cbob.toFixed(3)); }
  // now line
  if (playing && cb.info) {
    const i = sectionOfStep(Math.floor(cb.beat * STEPS_PER_BEAT) % LOOP_STEPS);
    const rm = REHEARSAL[Math.min(12, i.verse * 4 + i.phrase)];
    const nv = `<span class="rmark">${rm}</span><i>${SONG.marks[i.verse]}</i>`;
    const nm = `${tempoTerm(cb.bpm)} ♩ = ${Math.round(cb.bpm)} · <i>${dynMark(curDyn)}</i>`;
    if (nv !== pNowVerse) { pNowVerse = nv; UI.nowVerse.innerHTML = nv; } // DOM writes only when the text changes
    if (nm !== pNowMeta) { pNowMeta = nm; UI.nowMeta.innerHTML = nm; }
  }
  drawScore(cb.beat);
  // keep animating while playing; once stopped, run ~1.5 s more so motion settles, then sleep
  idleFrames = playing ? 0 : idleFrames + 1;
  rafId = idleFrames < 90 ? requestAnimationFrame(frame) : 0;
}
function wake() { idleFrames = 0; if (!rafId) rafId = requestAnimationFrame(frame); }
function keyName(verse) { const t = SONG.transpose[verse] + S.transpose; return `${NOTE_NAMES[(((SONG.tonicPc + t) % 12) + 12) % 12]} ${S.minor ? 'minor' : 'major'}`; }

/* ============================================================
   CONTROLS
   ============================================================ */
function updatePlayBtn() { wake(); stage.classList.toggle('playing', playing); const b = $('playBtn'); b.textContent = playing ? '❚❚ Pause' : '▶ Play'; b.setAttribute('aria-label', playing ? 'Pause' : 'Play'); }
function syncControls() {
  if (!playing) { $('nowMeta').innerHTML = `${tempoTerm(S.tempo)} ♩ = ${S.tempo}`; }
  syncSections();
}
$('startBtn').addEventListener('click', () => play());
$('playBtn').addEventListener('click', () => { if (playing) pause(); else play(); });

const say = html => { $('receipt').innerHTML = html; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const rnd = (a, b) => a + Math.random() * (b - a);
function reset() {
  S = DEFAULTS(); curDyn = S.dyn;
  MUSICIANS.forEach(mu => mu.octShift = 0);
  if (solo != null) setSolo(null);
  applyReverb(); applyMutes(); applyTimbre(); prewarm(); syncControls();
  say(`Restored: ${keyName(0)}, <i>${tempoTerm(SONG.tempo)}</i> ♩ = ${SONG.tempo}, every section in.`);
}
/* ---------------- conduct it yourself ---------------- */
let taps = [], drag = null;
function ripple(x, y) {
  const r = document.createElement('span'); r.className = 'ripple'; r.setAttribute('aria-hidden', 'true');
  r.style.setProperty('--x', x.toFixed(2)); r.style.setProperty('--y', y.toFixed(2));
  r.addEventListener('animationend', () => r.remove()); stage.appendChild(r);
}
function conductTap(x = 50, y = 84) {
  if (!playing) return;
  stage.classList.add('conducted'); ripple(x, y);
  const now = ctx.currentTime;
  if (taps.length && now - taps[taps.length - 1] > 2) taps = [];
  taps.push(now); if (taps.length > 5) taps.shift();
  if (taps.length >= 2) {
    const avg = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
    S.tempo = Math.round(Math.max(50, Math.min(200, 60 / avg)));
  }
  // pull the orchestra toward the tap: halve the phase error
  const b = currentBeat(now).beat, err = b - Math.round(b);
  if (Math.abs(err) < .35) nextTime += err * (60 / curBpm) * .5;
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const G = { svg: $('guideSvg'), origin: $('guideOrigin'), baton: $('guideBaton') };
function conductReadout() { return `${tempoTerm(S.tempo)} ♩ = ${S.tempo} · <i>${dynMark(S.dyn)}</i>`; }
let suppressClick = false, tilt = 0, lastX = null;
const stageXY = e => { const r = stage.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, r }; };
function placeBaton(x, y) {
  if (lastX != null) tilt += (clamp((x - lastX) * 1.6, -28, 28) - tilt) * .35; // lean into the stroke
  lastX = x;
  G.baton.style.setProperty('--hx', x.toFixed(0)); G.baton.style.setProperty('--hy', y.toFixed(0)); G.baton.style.setProperty('--tilt', tilt.toFixed(1));
}
function sectionAt(x, y, r) { // the section nearest the press point, if it's close enough to be "on" it
  let best = null, bestD = Math.min(r.width, r.height) * .1;
  MUSICIANS.forEach(mu => { const d = Math.hypot(mu.x / 100 * r.width - x, mu.y / 100 * r.height - y); if (d < bestD) { bestD = d; best = mu.section; } });
  SECTIONS.forEach(sec => { const d = Math.hypot(sec.lx / 100 * r.width - x, sec.ly / 100 * r.height - y); if (d < bestD) { bestD = d; best = sec.id; } });
  return best;
}
function setFocus(id) {
  if (focusSec === id) return; focusSec = id; applyMutes();
  SECTIONS.forEach(sec => sec.label.classList.toggle('focus', sec.id === id));
}
const HYST = 10, MIN_STROKE = 24; // px: a turn must travel back 10 px, and a stroke must span 24 px, to count as a beat
function strokeBeat(amp, x, y) {
  const now = ctx.currentTime;
  if (amp < MIN_STROKE || now - drag.lastBeat < .2) return; // one beat per stroke, even when both axes turn at once
  drag.lastBeat = now; drag.beats.push(now); if (drag.beats.length > 5) drag.beats.shift();
  if (drag.beats.length >= 2) { // tempo = the pace of your strokes (median of recent intervals)
    const iv = drag.beats.slice(1).map((t, i) => t - drag.beats[i]).filter(v => v < 2).sort((a, b) => a - b);
    if (iv.length) S.tempo = Math.round(clamp(60 / iv[iv.length >> 1], 40, 220));
  }
  // volume = the size of your strokes
  S.dyn = clamp(S.dyn * .5 + clamp(amp / (drag.h * .45), .15, 1) * .5, .15, 1); curDyn = S.dyn;
  // the beat lands on the turn: pull the band halfway toward it
  const b = currentBeat(now).beat, err = b - Math.round(b);
  if (Math.abs(err) < .35) nextTime += err * (60 / curBpm) * .5;
  ripple(x / drag.w * 100, y / drag.h * 100); wake();
}
function conductMove(x, y) {
  const dx = x - drag.x0, dy = y - drag.y0;
  if (!drag.moved) {
    if (Math.hypot(dx, dy) < 8) return;
    drag.moved = true; stage.classList.add('conducted');
    if (drag.onButton) { stage.setPointerCapture(drag.id); suppressClick = true; } // a drag that starts on an instrument conducts, not solos
    if (drag.focus) setFocus(drag.focus);
  }
  for (const k of ['x', 'y']) { // a beat is a turn-around on either axis
    const a = drag.ax[k], v = k === 'x' ? x : y;
    if (!a.dir) { if (Math.abs(v - a.ext) > HYST) { a.dir = Math.sign(v - a.ext); a.ext = v; } continue; }
    if ((v - a.ext) * a.dir > 0) a.ext = v;
    else if (Math.abs(v - a.ext) > HYST) { const amp = Math.abs(a.ext - a.prev); a.prev = a.ext; a.dir = -a.dir; a.ext = v; strokeBeat(amp, x, y); }
  }
}
stage.addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') stage.classList.add('hovering'); });
stage.addEventListener('pointerleave', () => { stage.classList.remove('hovering'); lastX = null; });
stage.addEventListener('pointerdown', e => {
  suppressClick = false;
  if (e.target.closest('.overlay') || !playing || e.button > 0) return;
  const { x, y, r } = stageXY(e), onButton = !!e.target.closest('button');
  drag = { x0: x, y0: y, t0: performance.now(), moved: false, onButton, id: e.pointerId, w: r.width, h: r.height,
    ax: { x: { ext: x, prev: x, dir: 0 }, y: { ext: y, prev: y, dir: 0 } }, beats: [], lastBeat: -1, focus: sectionAt(x, y, r) };
  if (!onButton) stage.setPointerCapture(e.pointerId);
  G.svg.setAttribute('viewBox', `0 0 ${r.width} ${r.height}`); G.origin.setAttribute('cx', x); G.origin.setAttribute('cy', y);
  stage.classList.add('holding'); placeBaton(x, y);
});
stage.addEventListener('pointermove', e => {
  const { x, y } = stageXY(e); placeBaton(x, y);
  if (drag) conductMove(x, y);
});
stage.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);
function endHold() {
  if (!drag) return;
  if (!drag.moved && !drag.onButton && performance.now() - drag.t0 < 250) conductTap(drag.x0 / drag.w * 100, drag.y0 / drag.h * 100); // a quick click is a beat tap
  else if (drag.moved) say(`Conducting at ${conductReadout()}. The band keeps your tempo until you conduct again; Restore returns to the written tempo.`);
  setFocus(null); stage.classList.remove('holding'); drag = null;
}
stage.addEventListener('pointerup', endHold);
stage.addEventListener('pointercancel', endHold);
// keyboard: arrows conduct while the music plays
function nudge(dTempo, dDyn) {
  S.tempo = Math.round(clamp(S.tempo + dTempo, 40, 220)); S.dyn = clamp(S.dyn + dDyn, .15, 1); curDyn = S.dyn;
  say(`Conducting at ${conductReadout()}.`); wake();
}

/* ---------------- song picker ---------------- */
function buildPicker() {
  const wrap = $('songPicker'); wrap.innerHTML = '';
  SONGS.forEach((song, i) => {
    const b = document.createElement('button');
    b.className = 'song'; b.setAttribute('role', 'radio');
    b.innerHTML = `<span class="t">${song.title}</span><span class="c">${song.short}</span>`;
    b.addEventListener('click', () => loadSong(song));
    b.addEventListener('keydown', e => {
      const d = e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 0;
      if (!d) return; e.preventDefault(); const next = SONGS[(i + d + SONGS.length) % SONGS.length];
      loadSong(next); song.btn && SONGS[SONGS.indexOf(next)].btn.focus();
    });
    wrap.appendChild(b); song.btn = b;
  });
  syncPicker();
}
function syncPicker() {
  SONGS.forEach(song => { const on = song === SONG; song.btn.setAttribute('aria-checked', String(on)); song.btn.tabIndex = on ? 0 : -1; });
  document.title = `The Emoji Philharmonic — ${SONG.title}`;
}
async function loadSong(song) {
  if (song === SONG) return;
  const wasPlaying = playing;
  if (playing) { playing = false; clearInterval(timer); }
  setSong(song); buildScore(); rewind();
  if (!wasPlaying) { stage.classList.add('closed'); $('startBtn').textContent = 'Are you dragging?'; $('overlay').classList.remove('hidden'); }
  S.tempo = song.tempo; curBpm = song.tempo;
  MUSICIANS.forEach(mu => mu.queue.length = 0);
  buildScoreStrip(); syncPicker(); syncControls();
  UI.nowVerse.innerHTML = ''; pNowVerse = ''; prewarm();
  say(`Now playing <b>${song.title}</b> by ${song.composer}, in ${keyName(0)}, ${BPB}/4 time.`);
  if (wasPlaying) await play(); else updatePlayBtn();
}

$('resetBtn').addEventListener('click', reset);
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  const sec = SECTIONS.find(s => s.key === e.key);
  if (sec) { toggleSection(sec.id); return; }
  if (e.key === 'Escape' && solo != null) { setSolo(null); say('The full orchestra is back.'); return; }
  if (e.code === 'Space' && !e.target.matches('button')) { e.preventDefault(); $('playBtn').click(); }
  else if ((e.key === 't' || e.key === 'T') && playing) conductTap();
  else if (playing && !e.target.closest('#songPicker') && e.key.startsWith('Arrow')) {
    e.preventDefault();
    ({ ArrowLeft: () => nudge(-4, 0), ArrowRight: () => nudge(4, 0), ArrowUp: () => nudge(0, .05), ArrowDown: () => nudge(0, -.05) })[e.key]?.();
  }
  else if (e.key === 'r' || e.key === 'R') reset();
});

/* boot */
personality(); layout(); readMotionTokens(); buildScore(); buildPicker(); buildScoreStrip(); syncControls();
let rsz; window.addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { buildScoreStrip(); wake(); }, 120); });
wake();
})();
</script>
