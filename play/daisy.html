<style>
/* Layout: one full-bleed WebGL stage. The device floats alone in white; two whispers of type pinned to the edges. */
:root{
  --paper:#ffffff;
  --ink:#1d1730;
  --ink-soft:#8a84a3;
  --chip:#f3f1f8;
  --hot:#ff3d9a;
  --hair:rgba(29,23,48,.12);
  --f-display:"Major Mono Display",ui-monospace,monospace;
  --f-lcd:"Silkscreen",ui-monospace,monospace;
  --f-body:"Silkscreen",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);text-transform:uppercase;overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;outline:none}
.mark{position:fixed;top:calc(24px + env(safe-area-inset-top,0px));left:24px;pointer-events:none;display:grid;gap:8px}
.mark h1{margin:0;text-transform:none;font:400 22px/1 var(--f-display);letter-spacing:.02em;color:var(--ink)}
.mark h1 .ai{color:inherit;transition:color .35s ease,text-shadow .35s ease}
.mark h1 .ai.lit{color:var(--hot);text-shadow:0 0 10px rgba(255,61,154,.55);animation:think 1.1s ease-in-out infinite}
@keyframes think{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.mark h1 .ai.lit{animation:none}}
.mark p{margin:0;font:400 11px/1.4 var(--f-body);color:var(--ink-soft);letter-spacing:.12em;text-transform:uppercase}
/* sound history: a quiet card column on the right; a swipeable strip on phones */
.history{position:fixed;right:20px;top:calc(20px + env(safe-area-inset-top,0px));width:216px;max-height:calc(100% - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:8px;padding:12px 12px 14px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 12px 40px rgba(29,23,48,.08),0 1px 2px rgba(29,23,48,.05)}
.history.collapsed{padding-bottom:12px}
.history.collapsed .history-body{display:none}
.history-head{display:flex;justify-content:space-between;align-items:center;padding:0 0 0 6px;font:400 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.history.collapsed{width:auto;background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;padding:4px}
.hist-link{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:6px 8px;border-radius:10px;font:400 11px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;transition:color .2s ease}
.hist-link:hover{color:var(--ink)}
.hist-link:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.hist-x{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:50%;background:none;color:var(--ink-soft);cursor:pointer;padding:0;transition:color .2s ease,background .2s ease}
.hist-x:hover{color:var(--ink);background:var(--chip)}
.hist-x:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.history.collapsed .hist-x{display:none}
.history:not(.collapsed) .history-head{padding-left:0}
.history:not(.collapsed) .hist-link{padding-left:12px}   /* H sits right above the first letter of the song names */
.history.bump,.mark.bump{animation:bump .32s ease-out}
@keyframes bump{30%{translate:var(--bx,0) var(--by,0)}}
.history-body{display:flex;flex-direction:column;gap:8px;min-height:0}
.history-empty{margin:0;padding:4px 12px 6px;font:400 11px/1.6 var(--f-body);color:var(--ink-soft)}
.history ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;overflow-y:auto;overscroll-behavior:contain;min-height:0;scrollbar-width:none;-ms-overflow-style:none}
.history ol::-webkit-scrollbar{display:none}
.take{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-items:center;width:100%;box-sizing:border-box;padding:10px 12px;border:0;border-radius:16px;background:transparent;color:var(--ink);text-align:left;font:inherit;cursor:pointer;transition:background .2s ease,box-shadow .2s ease}
.history li:hover .take,.take:focus-visible{background:#fff;box-shadow:0 1px 6px rgba(29,23,48,.10)}

.take:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.take .nm{display:block;font:400 11px/1.3 var(--f-lcd);letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere}
.take .mt{display:flex;align-items:center;gap:6px;margin-top:4px;font:400 10px/1 var(--f-body);color:var(--ink-soft);font-variant-numeric:tabular-nums}
.take .dots{display:flex;gap:3px}
.take .dots i{width:7px;height:7px;border-radius:50%;display:block}
.history li{position:relative}
.history.can-dl .take{padding-right:44px}
.dl{position:absolute;right:9px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(29,23,48,.14);display:none;place-items:center;padding:0;cursor:pointer;opacity:0;transition:opacity .2s ease,transform .2s ease}
.history.can-dl .dl{display:grid}
.history li:hover .dl,.dl:focus-visible,.dl.busy,.dl.done,.dl.err{opacity:1}
.dl:hover{transform:translateY(-50%) scale(1.08)}
.dl:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.dl svg{display:none}
.dl .i-dl{display:block}
.dl.busy .i-dl,.dl.done .i-dl,.dl.err .i-dl{display:none}
.dl.busy .i-busy{display:block;animation:spin .8s linear infinite}
.dl.done .i-ok,.dl.err .i-err{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (hover:none){.history li .dl{opacity:0}.history li.current .dl,.dl.busy,.dl.done,.dl.err{opacity:1}}
/* small screens: the History link stays pinned top-right, level with the wordmark; when open the panel floats over the header */
@media (max-width:720px){
  .history{right:16px;width:184px;max-height:calc(100% - 40px);z-index:3}
}
@media (max-width:520px){.mark{left:16px;top:calc(18px + env(safe-area-inset-top,0px))}.mark h1{font-size:18px}.history{top:calc(14px + env(safe-area-inset-top,0px))}}
/* keyboard + screen-reader control card: invisible until something inside it has focus */
.kbd{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(700px,calc(100% - 32px));box-sizing:border-box;background:var(--paper);border-radius:24px;box-shadow:0 12px 40px rgba(29,23,48,.10),0 1px 3px rgba(29,23,48,.06);padding:16px;display:grid;gap:12px}
.kbd:not(:focus-within){clip-path:inset(50%);width:1px;height:1px;overflow:hidden;padding:0;white-space:nowrap}
.kbd-row{display:flex;flex-wrap:wrap;gap:6px}
.kbd button{font:500 12px/1 var(--f-body);color:var(--ink);background:var(--chip);border:0;border-radius:999px;padding:9px 13px;cursor:pointer}
.kbd button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.kbd button:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.fallback[hidden]{display:none}
.fallback{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font:400 13px/1.7 var(--f-body);color:var(--ink-soft)}
</style>

</head>
<body>
<div id="stage"></div>

<header class="mark">
  <h1>d<span class="ai">Ai</span>sy</h1>
  <p>KT-0827 · audiologo engine</p>
</header>

<aside class="history collapsed" id="history" aria-label="History">
  <div class="history-head">
    <button type="button" class="hist-link" id="histToggle" aria-expanded="false" aria-controls="histBody">History</button>
    <button type="button" class="hist-x" id="histClose" aria-label="Close history"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
  </div>
  <div class="history-body" id="histBody">
    <p class="history-empty" id="histEmpty">Every new take you play lands here. Tap one to go straight back to it.</p>
    <ol id="histList"></ol>
  </div>
</aside>

<nav class="kbd" aria-label="Daisy controls">
  <div class="kbd-row" id="kbVibes" role="group" aria-label="Vibes"></div>
  <div class="kbd-row" role="group" aria-label="Takes">
    <button type="button" id="kb-screen" data-act="screen">Play / pause</button>
    <button type="button" id="kb-regen" data-act="regen">Regen (surprise mix)</button>
    <button type="button" id="kb-power" data-act="power" aria-pressed="true">Remote power</button>
  </div>
</nav>

(function buildEnv(){

    let c = y > 0 ? mid.map((m, i) => lerp(m, top[i], ss(0, .7, y))) : mid.map((m, i) => lerp(m, bot[i], ss(0, .7, -y)));
    const band = (col, k) => { c = c.map((m, i) => lerp(m, col[i], k)); };
    band([1, .62, .88], ss(.14, 0, Math.abs(y - .1)) * .6);
    band([.5, 1, .86], ss(.1, 0, Math.abs(y + .22)) * .5);
    band([.55, .82, 1], ss(.08, 0, Math.abs(x - .5)) * .35);
    if (y > .55 && Math.abs(x) < .35) c = [1, 1, 1];
    if (x < -.75 && Math.abs(y) < .45 && z > -.2) c = [1, 1, 1];
    if (y < -.5 && z > .3 && Math.abs(x) < .3) band([1, .85, .95], .7);
    return c;
  };
  const faces = [0, 1, 2, 3, 4, 5].map(f => {
    const [c, x] = mk(N, N), img = x.createImageData(N, N);
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const a = (i + .5) / N * 2 - 1, b = (j + .5) / N * 2 - 1; let d;
      switch (f) { case 0: d = [1, -b, -a]; break; case 1: d = [-1, -b, a]; break; case 2: d = [a, 1, b]; break; case 3: d = [a, -1, -b]; break; case 4: d = [a, -b, 1]; break; default: d = [-a, -b, -1]; }
      const l = Math.hypot(d[0], d[1], d[2]), col = sky(d[0] / l, d[1] / l, d[2] / l), o = (j * N + i) * 4;
      img.data[o] = col[0] * 255; img.data[o + 1] = col[1] * 255; img.data[o + 2] = col[2] * 255; img.data[o + 3] = 255;
    }
    x.putImageData(img, 0, 0); return c;
  });

  scene.environment = cube;
})();

          if (impact > .55) { P.vy = impact * BOUNCE; P.vx *= .86; P.w.x *= .6; P.w.y *= .6; P.w.z = P.w.z * .4 - P.vx / RR * .6; thud(impact); }
          else { P.vy = 0; P.rest = true; }
        } else P.w.multiplyScalar(Math.pow(.85, pdt));
        if (Math.abs(P.x) > 4.4 && P.x * P.vx > 0) P.vx *= -.5;
        ndcV.set(P.x, P.y, 0).project(camera); if (ndcV.y > .92 && P.vy > 0) P.vy *= -.6;
      }
      if (P.rest && !P.held) { P.vx *= Math.pow(.32, pdt); P.x += P.vx * pdt; P.w.z = -P.vx / RR; P.w.x *= Math.pow(.2, pdt); P.w.y *= Math.pow(.2, pdt); if (Math.abs(P.x) > 4.4 && P.x * P.vx > 0) P.vx *= -.5; }
      const wl = P.w.length(); if (wl > 1e-4) { tmpQ.setFromAxisAngle(tmpW2.copy(P.w).divideScalar(wl), wl * pdt); P.q.premultiply(tmpQ); }
    }
    remoteKnocks(P, now);
    ctrlRig.position.set(P.x, P.y, 0); ctrlRig.quaternion.copy(P.q);
  } else {
    // alive (or just revived): glide back to the hover spot and settle upright
    ctrlRig.position.x = lerp(ctrlRig.position.x, 0, .08); ctrlRig.position.z = lerp(ctrlRig.position.z, 0, .08);
    ctrlRig.position.y = lerp(ctrlRig.position.y, CTRL_Y + bob2, .08);
    ctrlRig.quaternion.slerp(tmpQ.setFromEuler(tmpE.set(0, 0, Math.sin(t * .6 + 1) * .03 * m)), .08);
  }
  if (!(down && down.target === 'remote')) { cRotY += cVelY; cRotX = clamp(cRotX + cVelX, -1.2, 1.2); cVelY *= .94; cVelX *= .9; }
  if (!(down && down.target === 'remote') && !state.doorOpen && !state.dead && now - Math.max(cLastInteract, touchAt) > AUTO_RETURN_MS) {
    const baseY = Math.round(cRotY / (Math.PI * 2)) * Math.PI * 2;
    cRotY = lerp(cRotY, baseY + Math.sin(t * .5) * .08 * m, .03);
    cRotX = lerp(cRotX, -.06, .03);
  }
  ctrl.rotation.set(cRotX + pointer.y * .04 * m, cRotY + pointer.x * .1 * m, 0);
  if (now - cLastInteract < AUTO_RETURN_MS) remSpin += Math.abs(cRotY - prevCRotY);
  remSpin *= Math.exp(-dt / 1.2); prevCRotY = cRotY;
  if (remSpin > SPIN_LIMIT && !state.dead) { remSpin = 0; killRemote(); }
  doorPivot.rotation.y = lerp(doorPivot.rotation.y, state.doorOpen ? 1.3 : 0, .12);
  slots.forEach(sl => { if (sl.kind === 'trinket' && !sl.busy && sl.item) { if (sl.item.userData.slotLay) sl.item.rotation.x += dt * .8; else sl.item.rotation.y += dt * .8; } });   // turns slowly about the cell's own axis

  // petals: lift on hover, sink when chosen; while a take plays the unchosen ones go white
  const nudgeT = (now - state.nudge) / 900, sdt = Math.min(dt, 1 / 30);
  petals.forEach(p => {
    const on = state.sel.has(p.v.id);
    const nudge = nudgeT < 1 ? Math.sin(nudgeT * Math.PI * 6 + p.i) * .05 * (1 - nudgeT) : 0;
    const tz = (on ? -.02 : 0) + (p.down && !state.bodyDead ? -.07 : p.hover ? .05 : 0) + nudge;
    const ts = p.down ? .94 : p.hover ? 1.05 : 1;
    springStep(p, 'off', 'offV', tz, sdt); springStep(p, 'sc', 'scV', ts, sdt);
    p.group.position.copy(p.base).addScaledVector(p.n, p.off);
    p.group.scale.set(p.sc, p.sc, 1 + (p.sc - 1) * 2);
    p.cur.lerp(on ? p.cOn : (playing ? C_WHITE : p.cOff), .12); p.mat.color.copy(p.cur);   // a dead flower keeps whatever petals were lit when it died
    if (on && state.bodyDead) p.mat.emissiveIntensity = .2;
    else if (on) p.mat.emissiveIntensity = .2 + (playing ? .08 + level * 1.8 : .04 * Math.sin(t * 2 + p.i) + .04);
  });
  // the wheel turns, and the colored light rides on it
  cd.rotation.z -= dt * (playing ? 2.4 : .25) * (REDUCED ? .3 : 1);
  glow.rotation.z = cd.rotation.z;
  glow.material.opacity = lerp(glow.material.opacity, playing ? Math.min(.95, .55 + level * 1.6) : 0, .12);
  matHeart.emissiveIntensity = playing ? .08 + level * .6 : .03;

  buttons.forEach(b => {
    springStep(b, 'off', 'offV', b.down ? -.06 : b.hover ? .012 : 0, sdt);
    springStep(b, 'sc', 'scV', b.down ? .95 : b.hover ? b.grow : 1, sdt);
    b.dome.position.z = b.off; b.group.scale.setScalar(b.sc);
  });
  matHot.emissiveIntensity = deviceOn() ? (playing ? .12 + level * .8 : .06 + .04 * Math.sin(t * 2.4) * m) : 0;
  matPower.emissiveIntensity = deviceOn() ? (playing ? .9 + level * 1.2 : .9) : 0;
  updateDrifters(t); updatePulses(now); updatePuffs(now, dt); updateFlights(now); updateBoard(dt, playing, now); updateSparks(rdt);

  // trinkets: orbit, or fly free after a throw. They bounce off the edges of the view and always find their way home.
  sats.forEach(s => {
    s.ang += dt * s.speed * (playing ? 3 : 1) * (REDUCED ? .2 : 1);
    orbitTarget(s, t * m, tmpT);
    if (s.mode === 'orbit') s.pos.copy(tmpT);
    else if (s.mode === 'free') {
      s.freeT += dt;
      tmpD.subVectors(tmpT, s.pos);
      const launched = now < (s.launchUntil || 0);
      s.vel.addScaledVector(tmpD, launched ? 0 : 2.6 * dt).multiplyScalar(Math.pow(launched ? .8 : .4, dt));
      s.pos.addScaledVector(s.vel, dt);
      ndcV.copy(s.pos).project(camera);
      if (ndcV.x > .97 && s.vel.x > 0) s.vel.x *= -.7; else if (ndcV.x < -.97 && s.vel.x < 0) s.vel.x *= -.7;
      if (ndcV.y > .95 && s.vel.y > 0) s.vel.y *= -.7; else if (ndcV.y < -.95 && s.vel.y < 0) s.vel.y *= -.7;
      if (s.pos.z > 9 && s.vel.z > 0) s.vel.z *= -.7; else if (s.pos.z < -9 && s.vel.z < 0) s.vel.z *= -.7;
      if (s.freeT > 5) s.pos.lerp(tmpT, Math.min(1, (s.freeT - 5) * .05));
      if (!isFinite(s.pos.x + s.pos.y + s.pos.z) || !isFinite(s.vel.x + s.vel.y + s.vel.z)) { s.pos.copy(tmpT); s.vel.set(0, 0, 0); s.mode = 'orbit'; }
      if (tmpD.length() < .05 && s.vel.length() < .15) s.mode = 'orbit';
    }
    s.mesh.rotation.x += dt * (s.spin.x + s.spinBoost.x); s.mesh.rotation.y += dt * (s.spin.y + s.spinBoost.y); s.mesh.rotation.z += dt * (s.spin.z + s.spinBoost.z);
    s.spinBoost.multiplyScalar(Math.pow(.45, dt));
    if (s.kind === 'take' && s.mode !== 'held') {   // drift back to face the viewer after a knock
      const e = 1 - Math.pow(.3, dt), wrap = v => v - Math.round(v / (Math.PI * 2)) * Math.PI * 2, r = s.mesh.rotation;
      r.x = wrap(r.x) * (1 - e); if (s.upright) r.z = wrap(r.z) * (1 - e); else r.y = wrap(r.y) * (1 - e);
    }
  });
  collideTrinkets();
  const gone = [];
  sats.forEach(s => {
    s.mesh.position.copy(s.pos);
    // size: bloom in, wilt out, and the take now loaded breathes a little larger
    let k = 1;
    if (s.spawnAt) { const u = Math.min(1, (now - s.spawnAt) / 650); k *= 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2); }
    if (s.fadeAt) { const u = (now - s.fadeAt) / 1300; k *= Math.max(0, 1 - u); if (u >= 1) gone.push(s); }
    if (s.take && s.take === state.plan) k *= 1.18 + .05 * Math.sin(t * 3);
    if (s.sq > .002) { s.sq *= Math.exp(-dt * 5); s.sqPh += dt * 30; } else s.sq = 0;
    const f = s.sq * Math.cos(s.sqPh), b = s.base * Math.max(k, .001);
    s.mesh.scale.set(b * (1 + .16 * f), b * (1 - .22 * f), b * (1 + .16 * f));
    if (s.shadow) { s.shadow.position.set(s.pos.x + .04, s.pos.y - .4, s.pos.z - .3); s.shadow.quaternion.copy(camera.quaternion); s.shadow.material.opacity = .16 * Math.min(1, k); }
  });
  if (gone.length) { gone.forEach(s => { scene.remove(s.mesh); if (s.shadow) scene.remove(s.shadow); sats.splice(sats.indexOf(s), 1); }); rebuildHits(); }
  // the remote's shadow tightens and darkens as it nears the floor
  const fh = Math.max(0, rig.position.y - BODY_R - FLOOR_Y);
  // the shadow sits right under the flower, wherever it has rolled to (including the step back it takes when it falls)
  flowerShadow.position.x = rig.position.x; flowerShadow.position.z = rig.position.z - (bodyPhys ? 0 : .3);
  if (bodyPhys) { const fl = Math.max(0, rig.position.y - (FLOOR_Y + bodyExtent(0, -1))), k = clamp(1 - fl * .25, .35, 1); flowerShadow.scale.set(.85 + (1 - k) * .4, 1, 1.25 + (1 - k) * .4); flowerShadow.material.opacity = .42 + .4 * k; }
  else { flowerShadow.scale.set(1, 1, 1); flowerShadow.material.opacity = .42; }
  const hgt = Math.max(0, ctrlRig.position.y - RR - FLOOR_Y);
  shadow.position.x = ctrlRig.position.x;
  shadow.scale.set(.72 + hgt * .45, 1, .72 + hgt * .45); shadow.material.opacity = clamp(1.05 - hgt * .5, .35, 1);

  zoom = lerp(zoom, zoomT, .15);
  if (!(down && down.target === 'pan')) { panX = lerp(panX, panTX, .12); panY = lerp(panY, panTY, .12); }
  camera.position.set(panX, .1 + panY, baseDist * zoom); camera.lookAt(panX, -1.2 + panY, 0);

  lcdClock += dt;
  const glitching = now < state.glitchUntil;
  if (state.lcdDirty || (playing && lcdClock > 1 / 30) || (glitching && lcdClock > 1 / 20) || (state.flashMsg && now < state.flashUntil + 250 && lcdClock > .1) || (now < state.errUntil + 120 && lcdClock > .05) || now - (state.bootAt || -1e9) < BOOT_MS + 60 || (state.helloUntil && now < state.helloUntil + 80 && lcdClock > .2)) { drawLCD(now); state.lcdDirty = false; lcdClock = 0; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
