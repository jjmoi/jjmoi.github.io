    ctrlRig.quaternion.slerp(tmpQ.setFromEuler(tmpE.set(0, 0, Math.sin(t * .6 + 1) * .03 * m)), .08);
  }
  if (!(down && down.target === 'remote')) { cRotY += cVelY; cRotX = clamp(cRotX + cVelX, -1.2, 1.2); cVelY *= .94; cVelX *= .9; }
  if (!(down && down.target === 'remote') && !state.doorOpen && !state.dead && now - Math.max(cLastInteract, touchAt) > AUTO_RETURN_MS) {
    const baseY = Math.round(cRotY / (Math.PI * 2)) * Math.PI * 2;
    cRotY = lerp(cRotY, baseY + Math.sin(t * .5) * .08 * m, .03);
    cRotX = lerp(cRotX, -.06, .03);
  }
  ctrl.rotation.set(cRotX + pointer.y * .04 * m, cRotY + pointer.x * .1 * m, 0);
  if (now - cLastInteract < AUTO_RETURN_MS) remSpin += Math.abs(cRotY - prevCRotY);
  remSpin *= Math.exp(-dt / 1.2); prevCRotY = cRotY;
  if (remSpin > SPIN_LIMIT && !state.dead) { remSpin = 0; killRemote(); }
  doorPivot.rotation.y = lerp(doorPivot.rotation.y, state.doorOpen ? 1.3 : 0, .12);
  slots.forEach(sl => { if (sl.kind === 'trinket' && !sl.busy && sl.item) sl.item.rotation.y += dt * .8; });

  // petals: lift on hover, sink when chosen; while a take plays the unchosen ones go white
  const nudgeT = (now - state.nudge) / 900, sdt = Math.min(dt, 1 / 30);
  petals.forEach(p => {
    const on = state.sel.has(p.v.id);
    const nudge = nudgeT < 1 ? Math.sin(nudgeT * Math.PI * 6 + p.i) * .05 * (1 - nudgeT) : 0;
    const tz = (on ? -.02 : 0) + (p.down && !state.bodyDead ? -.07 : p.hover ? .05 : 0) + nudge;
    const ts = p.down ? .94 : p.hover ? 1.05 : 1;
    springStep(p, 'off', 'offV', tz, sdt); springStep(p, 'sc', 'scV', ts, sdt);
    p.group.position.copy(p.base).addScaledVector(p.n, p.off);
    p.group.scale.set(p.sc, p.sc, 1 + (p.sc - 1) * 2);
    p.cur.lerp(on ? p.cOn : (playing ? C_WHITE : p.cOff), .12); p.mat.color.copy(p.cur);   // a dead flower keeps whatever petals were lit when it died
    if (on && state.bodyDead) p.mat.emissiveIntensity = .2;
    else if (on) p.mat.emissiveIntensity = .2 + (playing ? .08 + level * 1.8 : .04 * Math.sin(t * 2 + p.i) + .04);
  });
  // the wheel turns, and the colored light rides on it
  cd.rotation.z -= dt * (playing ? 2.4 : .25) * (REDUCED ? .3 : 1);
  glow.rotation.z = cd.rotation.z;
  glow.material.opacity = lerp(glow.material.opacity, playing ? Math.min(.95, .55 + level * 1.6) : 0, .12);
  matHeart.emissiveIntensity = playing ? .08 + level * .6 : .03;

  buttons.forEach(b => {
    springStep(b, 'off', 'offV', b.down ? -.06 : b.hover ? .012 : 0, sdt);
    springStep(b, 'sc', 'scV', b.down ? .95 : b.hover ? b.grow : 1, sdt);
    b.dome.position.z = b.off; b.group.scale.setScalar(b.sc);
  });
  matHot.emissiveIntensity = deviceOn() ? (playing ? .12 + level * .8 : .06 + .04 * Math.sin(t * 2.4) * m) : 0;
  matPower.emissiveIntensity = deviceOn() ? (playing ? .9 + level * 1.2 : .9) : 0;
  updatePulses(now); updatePuffs(now, dt); updateFlights(now); updateBoard(dt, playing, now); updateSparks(rdt);

  // trinkets: orbit, or fly free after a throw. They bounce off the edges of the view and always find their way home.
  sats.forEach(s => {
    s.ang += dt * s.speed * (playing ? 3 : 1) * (REDUCED ? .2 : 1);
    orbitTarget(s, t * m, tmpT);
    if (s.mode === 'orbit') s.pos.copy(tmpT);
    else if (s.mode === 'free') {
      s.freeT += dt;
      tmpD.subVectors(tmpT, s.pos);
      const launched = now < (s.launchUntil || 0);
      s.vel.addScaledVector(tmpD, launched ? 0 : 2.6 * dt).multiplyScalar(Math.pow(launched ? .8 : .4, dt));
      s.pos.addScaledVector(s.vel, dt);
      ndcV.copy(s.pos).project(camera);
      if (ndcV.x > .97 && s.vel.x > 0) s.vel.x *= -.7; else if (ndcV.x < -.97 && s.vel.x < 0) s.vel.x *= -.7;
      if (ndcV.y > .95 && s.vel.y > 0) s.vel.y *= -.7; else if (ndcV.y < -.95 && s.vel.y < 0) s.vel.y *= -.7;
      if (s.pos.z > 9 && s.vel.z > 0) s.vel.z *= -.7; else if (s.pos.z < -9 && s.vel.z < 0) s.vel.z *= -.7;
      if (s.freeT > 5) s.pos.lerp(tmpT, Math.min(1, (s.freeT - 5) * .05));
      if (!isFinite(s.pos.x + s.pos.y + s.pos.z) || !isFinite(s.vel.x + s.vel.y + s.vel.z)) { s.pos.copy(tmpT); s.vel.set(0, 0, 0); s.mode = 'orbit'; }
      if (tmpD.length() < .05 && s.vel.length() < .15) s.mode = 'orbit';
    }
    s.mesh.rotation.x += dt * (s.spin.x + s.spinBoost.x); s.mesh.rotation.y += dt * (s.spin.y + s.spinBoost.y); s.mesh.rotation.z += dt * (s.spin.z + s.spinBoost.z);
    s.spinBoost.multiplyScalar(Math.pow(.45, dt));
    if (s.kind === 'take' && s.mode !== 'held') {   // drift back to face the viewer after a knock
      const e = 1 - Math.pow(.3, dt), wrap = v => v - Math.round(v / (Math.PI * 2)) * Math.PI * 2, r = s.mesh.rotation;
      r.x = wrap(r.x) * (1 - e); if (s.upright) r.z = wrap(r.z) * (1 - e); else r.y = wrap(r.y) * (1 - e);
    }
  });
  collideTrinkets();
  const gone = [];
  sats.forEach(s => {
    s.mesh.position.copy(s.pos);
    // size: bloom in, wilt out, and the take now loaded breathes a little larger
    let k = 1;
    if (s.spawnAt) { const u = Math.min(1, (now - s.spawnAt) / 650); k *= 1 + 2.7 * Math.pow(u - 1, 3) + 1.7 * Math.pow(u - 1, 2); }
    if (s.fadeAt) { const u = (now - s.fadeAt) / 1300; k *= Math.max(0, 1 - u); if (u >= 1) gone.push(s); }
    if (s.take && s.take === state.plan) k *= 1.18 + .05 * Math.sin(t * 3);
    if (s.sq > .002) { s.sq *= Math.exp(-dt * 5); s.sqPh += dt * 30; } else s.sq = 0;
    const f = s.sq * Math.cos(s.sqPh), b = s.base * Math.max(k, .001);
    s.mesh.scale.set(b * (1 + .16 * f), b * (1 - .22 * f), b * (1 + .16 * f));
    if (s.shadow) { s.shadow.position.set(s.pos.x + .04, s.pos.y - .4, s.pos.z - .3); s.shadow.quaternion.copy(camera.quaternion); s.shadow.material.opacity = .16 * Math.min(1, k); }
  });
  if (gone.length) { gone.forEach(s => { scene.remove(s.mesh); if (s.shadow) scene.remove(s.shadow); sats.splice(sats.indexOf(s), 1); }); rebuildHits(); }
  // the remote's shadow tightens and darkens as it nears the floor
  const fh = Math.max(0, rig.position.y - BODY_R - FLOOR_Y);
  // the shadow sits right under the flower, wherever it has rolled to (including the step back it takes when it falls)
  flowerShadow.position.x = rig.position.x; flowerShadow.position.z = rig.position.z - (bodyPhys ? 0 : .3);
  if (bodyPhys) { const fl = Math.max(0, rig.position.y - (FLOOR_Y + bodyExtent(0, -1))), k = clamp(1 - fl * .25, .35, 1); flowerShadow.scale.set(.85 + (1 - k) * .4, 1, 1.25 + (1 - k) * .4); flowerShadow.material.opacity = .42 + .4 * k; }
  else { flowerShadow.scale.set(1, 1, 1); flowerShadow.material.opacity = .42; }
  const hgt = Math.max(0, ctrlRig.position.y - RR - FLOOR_Y);
  shadow.position.x = ctrlRig.position.x;
  shadow.scale.set(.72 + hgt * .45, 1, .72 + hgt * .45); shadow.material.opacity = clamp(1.05 - hgt * .5, .35, 1);

  zoom = lerp(zoom, zoomT, .15);
  camera.position.set(0, .1, baseDist * zoom); camera.lookAt(0, -1.2, 0);

  lcdClock += dt;
  const glitching = now < state.glitchUntil;
  if (state.lcdDirty || (playing && lcdClock > 1 / 30) || (glitching && lcdClock > 1 / 20) || (state.flashMsg && now < state.flashUntil + 250 && lcdClock > .1) || (now < state.errUntil + 120 && lcdClock > .05) || now - (state.bootAt || -1e9) < BOOT_MS + 60 || (state.helloUntil && now < state.helloUntil + 80 && lcdClock > .2)) { drawLCD(now); state.lcdDirty = false; lcdClock = 0; }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
