<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JJ — Collage Portfolio</title><style>:root{
  --paper:#f1efe8; --ink:#0b0b0a; --muted:#6f6d66; --line:rgba(11,11,10,.14);
  --orange:#ed6339; --blue:#315fce; --green:#456757; --copper:#b46f45;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow-x:hidden}
button,a{font:inherit;color:inherit}.topbar{height:64px;padding:0 3vw;display:flex;align-items:center;gap:44px;position:relative;z-index:100;border-bottom:1px solid rgba(11,11,10,.08);background:rgba(241,239,232,.88);backdrop-filter:blur(8px)}
.brand{font-weight:800;text-decoration:none;font-size:17px}.topbar nav{display:flex;gap:32px}.topbar nav a{font:10px "Courier New",monospace;text-decoration:none;letter-spacing:.06em}.topbar .meta{margin-left:auto;font:10px "Courier New",monospace;color:var(--muted);letter-spacing:.05em}
.canvas{height:calc(100dvh - 64px);min-height:620px;position:relative;overflow:hidden;touch-action:none;user-select:none;background-image:linear-gradient(rgba(0,0,0,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.022) 1px,transparent 1px);background-size:96px 96px}
.canvas:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,rgba(255,255,255,.42),transparent 48%);pointer-events:none}
.piece{position:absolute;left:var(--x);top:var(--y);width:var(--w);padding:0;border:0;background:transparent;cursor:grab;touch-action:none;transform:rotate(var(--r,0deg));transform-origin:center;box-shadow:0 1px 0 rgba(0,0,0,.06);transition:box-shadow .16s ease,filter .16s ease;z-index:var(--z,1)}
.piece:active{cursor:grabbing}.piece.dragging{box-shadow:0 18px 40px rgba(0,0,0,.16);filter:saturate(1.03);transition:none}.piece img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none}.piece:focus-visible{outline:1px solid var(--ink);outline-offset:5px}
.canvas-note{position:absolute;left:3vw;bottom:2.8vw;font:9px "Courier New",monospace;color:var(--muted);letter-spacing:.04em;pointer-events:none}.canvas-note span{display:inline-block;width:28px;border-top:1px solid var(--ink);vertical-align:middle;margin-right:8px}
.dialog{width:100vw;max-width:none;height:100dvh;max-height:none;margin:0;padding:0;border:0;background:var(--paper);color:var(--ink);overflow-y:auto}.dialog::backdrop{background:rgba(0,0,0,.22)}.dialog[open]{animation:fadein .2s ease}.close{position:fixed;right:26px;top:18px;z-index:1000;width:42px;height:42px;border:1px solid rgba(0,0,0,.18);border-radius:50%;background:rgba(241,239,232,.92);font-size:24px;cursor:pointer;backdrop-filter:blur(8px)}
.case-nav{height:64px;padding:0 3vw;display:flex;align-items:center;border-bottom:1px solid var(--line);font:10px "Courier New",monospace;letter-spacing:.05em}.case-nav .index{margin-left:auto;margin-right:62px;color:var(--muted)}
.case-hero{min-height:720px;padding:6vw 4vw 5vw;display:grid;grid-template-columns:30% 70%;gap:36px;border-bottom:1px solid var(--line)}.case-kicker{font:10px "Courier New",monospace;letter-spacing:.06em;color:var(--muted);margin-bottom:16px}.case-title{align-self:center}.case-title h1{font-size:clamp(62px,7.5vw,118px);line-height:.88;letter-spacing:-.07em;margin:0 0 28px}.case-tags{font:10px "Courier New",monospace;letter-spacing:.06em}.case-dek{font-size:22px;line-height:1.3;max-width:330px;margin-top:55px;padding-left:18px;border-left:1px solid var(--ink)}.hero-visual{position:relative;min-height:560px;display:flex;align-items:center;justify-content:center}.hero-visual img{width:min(860px,100%);max-height:560px;object-fit:cover}.hero-visual:after{content:"";position:absolute;inset:10% 7% auto auto;width:15%;height:20%;border:1px solid var(--line);transform:translate(30%, -30%)}
.section{padding:92px 4vw;border-bottom:1px solid var(--line);display:grid;grid-template-columns:22% 78%;gap:30px}.section-label{font:10px "Courier New",monospace;color:var(--muted);letter-spacing:.06em;padding-top:7px}.section-body{max-width:1100px}.section h2{font-size:clamp(38px,4.8vw,70px);line-height:.98;letter-spacing:-.05em;margin:0 0 28px;max-width:850px}.section p{font-size:17px;line-height:1.6;max-width:760px;color:#2f2e2a;margin:0 0 38px}.copy-grid{display:grid;grid-template-columns:1fr 1fr;gap:64px}.copy-grid p{margin:0}.visual-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;align-items:start}.visual-grid img{width:100%;display:block;object-fit:cover;min-height:280px}.visual-grid img:first-child{grid-row:span 2;min-height:580px}.visual-grid img:not(:first-child){height:281px}.full-image{width:100%;max-height:650px;object-fit:cover;display:block}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:42px}.metric{background:var(--paper);padding:36px 28px;min-height:165px}.metric strong{display:block;font-size:42px;letter-spacing:-.05em;margin-bottom:18px}.metric span{font:10px "Courier New",monospace;color:var(--muted)}
.diagram{position:relative;height:520px;border:1px solid var(--line);overflow:hidden;background:rgba(255,255,255,.18)}.diagram svg{width:100%;height:100%;display:block}.diagram .node{fill:var(--paper);stroke:rgba(11,11,10,.3);stroke-width:1}.diagram .edge{stroke:rgba(11,11,10,.32);stroke-width:1;fill:none}.diagram .accent{fill:var(--accent);stroke:none}.diagram text{font-family:"Courier New",monospace;font-size:12px;fill:var(--ink)}
.ui-board{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:82px;gap:14px}.ui-card{border:1px solid var(--line);background:#f6f4ed;position:relative;overflow:hidden}.ui-card.dark{background:#111;color:#fff}.ui-card.large{grid-column:span 8;grid-row:span 5}.ui-card.medium{grid-column:span 4;grid-row:span 3}.ui-card.small{grid-column:span 4;grid-row:span 2}.ui-card .minihead{padding:15px 16px;font:9px "Courier New",monospace;letter-spacing:.05em;border-bottom:1px solid currentColor;opacity:.7}.ui-lines{padding:20px}.ui-lines i{display:block;height:7px;background:currentColor;opacity:.12;margin-bottom:12px}.ui-lines i:nth-child(2){width:65%}.ui-lines i:nth-child(3){width:82%}.ui-chart{position:absolute;left:8%;right:8%;bottom:10%;height:46%;display:flex;align-items:flex-end;gap:4%}.ui-chart b{flex:1;background:var(--accent);opacity:.75}.ui-chart b:nth-child(1){height:31%}.ui-chart b:nth-child(2){height:48%}.ui-chart b:nth-child(3){height:39%}.ui-chart b:nth-child(4){height:61%}.ui-chart b:nth-child(5){height:76%}.ui-chart b:nth-child(6){height:90%}
.chart-panel{border:1px solid var(--line);padding:28px}.chart-top{display:flex;justify-content:space-between;font:10px "Courier New",monospace;color:var(--muted);margin-bottom:22px}.chart-panel svg{display:block;width:100%;height:360px}.gridline{stroke:rgba(11,11,10,.10);stroke-width:1}.trend{stroke:var(--accent);stroke-width:3;fill:none}.area{fill:var(--accent);opacity:.08}.dot{fill:var(--accent)}
.system-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.system-card{border:1px solid var(--line);min-height:210px;padding:20px;position:relative}.system-card .swatch{width:100%;height:70px;background:var(--accent);opacity:.84;margin-bottom:30px}.system-card:nth-child(2) .swatch{opacity:.3}.system-card:nth-child(3) .swatch{background:#111;opacity:1}.system-card:nth-child(4) .swatch{background:linear-gradient(90deg,var(--accent) 0 25%,#d9d5cb 25% 50%,#111 50% 75%,#fff 75%)}.system-card strong{font-size:15px}.system-card small{display:block;font:10px "Courier New",monospace;color:var(--muted);margin-top:8px}
.timeline{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);margin-top:48px}.step{padding:28px 24px 0 0;min-height:180px;border-right:1px solid var(--line)}.step:last-child{border-right:0}.step b{font:10px "Courier New",monospace;color:var(--muted)}.step strong{display:block;font-size:19px;margin:20px 0 10px}.step p{font-size:13px;line-height:1.45;margin:0;max-width:180px}
.quote{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,5vw,74px);line-height:1.05;letter-spacing:-.035em;max-width:980px;margin:0 0 56px}.next{padding:80px 4vw 110px;display:grid;grid-template-columns:22% 78%;gap:30px}.next button{border:0;background:transparent;padding:0;text-align:left;cursor:pointer}.next img{width:100%;height:520px;object-fit:cover;display:block}.next h2{font-size:54px;letter-spacing:-.05em;margin:20px 0 0}.next .eyebrow{font:10px "Courier New",monospace;color:var(--muted);letter-spacing:.05em}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media(max-width:900px){.topbar{padding:0 20px}.topbar nav{gap:18px}.topbar .meta{display:none}.canvas{min-height:650px}.piece{width:calc(var(--w) * 1.2)}.case-hero{grid-template-columns:1fr;padding:80px 24px 50px;min-height:auto}.case-dek{margin-top:32px}.hero-visual{min-height:360px}.section{grid-template-columns:1fr;padding:64px 24px}.section-label{margin-bottom:18px}.copy-grid{grid-template-columns:1fr;gap:18px}.visual-grid{grid-template-columns:1fr}.visual-grid img:first-child,.visual-grid img:not(:first-child){height:auto;min-height:0;grid-row:auto}.metrics{grid-template-columns:1fr}.ui-board{display:block}.ui-card{min-height:260px;margin-bottom:12px}.system-grid{grid-template-columns:1fr 1fr}.timeline{grid-template-columns:1fr}.step{border-right:0;border-bottom:1px solid var(--line)}.next{grid-template-columns:1fr;padding:64px 24px}.next img{height:auto}}
</style></head><body>

const canvas=document.querySelector('#canvas');
const dlg=document.querySelector('#caseStudy');
const caseContent=document.querySelector('#caseContent');
const closeBtn=document.querySelector('.close');
const storageKey='jj-collage-positions-v3';
let saved={}; try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
let topZ=30;

collage.forEach((item,i)=>{
  const b=document.createElement('button');
  b.className='piece'; b.type='button'; b.dataset.i=i; b.dataset.project=item.project;
  b.style.setProperty('--x',(saved[i]?.x ?? item.x)+'%');
  b.style.setProperty('--y',(saved[i]?.y ?? item.y)+'%');
  b.style.setProperty('--w',item.w+'vw');
  b.style.setProperty('--r',item.r+'deg');
  b.style.setProperty('--z',saved[i]?.z ?? item.z);
  b.setAttribute('aria-label',`Open ${projects[item.project].title} case study`);
  b.innerHTML=`<img src="${item.src}" alt="${projects[item.project].title} project fragment">`;
  canvas.appendChild(b);
  enableDrag(b);
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openCase(item.project)}});
});

function enableDrag(el){
  let state=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    const r=el.getBoundingClientRect(), cr=canvas.getBoundingClientRect();
    state={id:e.pointerId,startX:e.clientX,startY:e.clientY,left:r.left-cr.left,top:r.top-cr.top,moved:false};
    topZ++; el.style.zIndex=topZ; el.classList.add('dragging'); el.setPointerCapture(e.pointerId); e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(!state||state.id!==e.pointerId)return;
    const dx=e.clientX-state.startX,dy=e.clientY-state.startY;
    if(Math.hypot(dx,dy)>5)state.moved=true;
    if(!state.moved)return;
    const cr=canvas.getBoundingClientRect(), er=el.getBoundingClientRect();
    const x=Math.min(cr.width-24,Math.max(-er.width+24,state.left+dx));
    const y=Math.min(cr.height-24,Math.max(-er.height+24,state.top+dy));
    el.style.left=x+'px';el.style.top=y+'px';el.style.removeProperty('--x');el.style.removeProperty('--y');
  });
  el.addEventListener('pointerup',e=>{
    if(!state||state.id!==e.pointerId)return;
    const moved=state.moved; el.classList.remove('dragging');
    if(moved){
      const x=(el.offsetLeft/canvas.clientWidth)*100,y=(el.offsetTop/canvas.clientHeight)*100;
      const i=el.dataset.i;saved[i]={x:+x.toFixed(3),y:+y.toFixed(3),z:+el.style.zIndex||topZ};
      localStorage.setItem(storageKey,JSON.stringify(saved));
    }
    state=null;
    if(!moved)openCase(el.dataset.project);
  });
  el.addEventListener('pointercancel',()=>{state=null;el.classList.remove('dragging')});
  el.addEventListener('click',e=>e.preventDefault());
}

 <div class="ui-card small"><div class="minihead">FILTERS / ACTIONS</div><div class="ui-lines"><i></i><i></i></div></div>
 </div>`
}

function renderCase(id){
 const p=projects[id]; if(!p)return;
 const imgs=p.images;
 const nextId=id==='cerebras'?'lumiflow':id==='lumiflow'?'tachyus':'cerebras';
 const next=projects[nextId];
 caseContent.innerHTML=`<article class="case" style="--accent:${p.accent}">
 <div class="case-nav"><strong>JJ</strong><span class="index">${p.num} / 03</span></div>
 <section class="case-hero"><div class="case-title"><div class="case-kicker">${p.num} / CASE STUDY</div><h1>${p.title}</h1><div class="case-tags">${p.tags}</div><div class="case-dek">${p.dek}</div></div><div class="hero-visual"><img src="${p.hero}" alt="${p.title} hero visual"></div></section>
 <section class="section"><div class="section-label">01 / CONTEXT</div><div class="section-body"><h2>Start with the system, not the screen.</h2><div class="copy-grid"><p>${p.context}</p><p>${p.problem}</p></div><div class="metrics"><div class="metric"><strong>3×</strong><span>PLACEHOLDER IMPROVEMENT</span></div><div class="metric"><strong>42%</strong><span>PLACEHOLDER REDUCTION</span></div><div class="metric"><strong>08</strong><span>CORE WORKFLOWS</span></div></div></div></section>
 <section class="section"><div class="section-label">02 / EVIDENCE</div><div class="section-body"><h2>Build the story from artifacts.</h2><p>Placeholder imagery can hold interface states, research evidence, environmental context, hardware, diagrams, or process fragments. The layout intentionally behaves more like an evidence wall than a conventional gallery.</p><div class="visual-grid"><img src="${imgs[0]}" alt="${p.title} visual"><img src="${imgs[1]||imgs[0]}" alt="${p.title} detail"><img src="${imgs[2]||imgs[0]}" alt="${p.title} detail"></div></div></section>
 <section class="section"><div class="section-label">03 / MODEL</div><div class="section-body"><h2>Expose how the product fits together.</h2><p>A system diagram gives the reader a quick mental model before introducing individual screens. Replace this placeholder with the real architecture, actors, inputs, decision points, and outputs.</p>${diagramSVG(p.accent)}</div></section>
 <section class="section"><div class="section-label">04 / PRODUCT</div><div class="section-body"><h2>Show the interface at working scale.</h2><p>The case study can alternate between real screenshots and abstracted interface diagrams. Dense screens deserve enough space to be understood rather than compressed into decorative thumbnails.</p>${uiBoard(p.accent)}</div></section>
 <section class="section"><div class="section-label">05 / DETAIL</div><div class="section-body"><h2>Zoom from system to decision.</h2><p>${p.system}</p><div class="visual-grid"><img src="${imgs[3]||imgs[0]}" alt="${p.title} project detail"><img src="${imgs[4]||imgs[1]||imgs[0]}" alt="${p.title} project detail"><img src="${imgs[5]||imgs[2]||imgs[0]}" alt="${p.title} project detail"></div></div></section>
 <section class="section"><div class="section-label">06 / SIGNAL</div><div class="section-body"><h2>Let data carry part of the argument.</h2><p>Use graphs for the part of the case study that needs evidence. These values are intentionally illustrative placeholders, ready to be replaced with actual product or research metrics.</p>${chartSVG(p.accent)}</div></section>
 <section class="section"><div class="section-label">07 / SYSTEM</div><div class="section-body"><h2>A small language that scales.</h2><p>Placeholder system primitives show how color, typography, spacing, data visualization, and reusable components can be documented without turning the case study into a component catalog.</p><div class="system-grid" style="--accent:${p.accent}"><div class="system-card"><div class="swatch"></div><strong>Signal</strong><small>ACCENT / EMPHASIS</small></div><div class="system-card"><div class="swatch"></div><strong>Surface</strong><small>LAYERS / STATES</small></div><div class="system-card"><div class="swatch"></div><strong>Contrast</strong><small>HIERARCHY / FOCUS</small></div><div class="system-card"><div class="swatch"></div><strong>Range</strong><small>TOKENS / SCALE</small></div></div></div></section>
 <section class="section"><div class="section-label">08 / PROCESS</div><div class="section-body"><h2>Keep the path visible.</h2><p>Placeholder process content can show how the work moved from ambiguity through research, framing, prototyping, validation, and systemization.</p><div class="timeline"><div class="step"><b>01</b><strong>Frame</strong><p>Define the decisions that matter before producing interface volume.</p></div><div class="step"><b>02</b><strong>Observe</strong><p>Gather behavior, constraints, evidence, and technical context.</p></div><div class="step"><b>03</b><strong>Model</strong><p>Map the system and expose the highest leverage relationships.</p></div><div class="step"><b>04</b><strong>Prototype</strong><p>Test interaction and hierarchy at realistic density.</p></div><div class="step"><b>05</b><strong>Scale</strong><p>Turn successful patterns into reusable product language.</p></div></div></div></section>
 <section class="section"><div class="section-label">09 / OUTCOME</div><div class="section-body"><div class="quote">“${p.outcome}”</div><img class="full-image" src="${imgs[6]||imgs[0]}" alt="${p.title} concluding visual"></div></section>
 <section class="next"><div class="section-label">NEXT PROJECT</div><button type="button" data-next="${nextId}"><span class="eyebrow">${next.num} / ${next.tags}</span><img src="${next.hero}" alt="Open ${next.title} case study"><h2>${next.title} →</h2></button></section>
 </article>`;
 if(!dlg.open)dlg.showModal();dlg.scrollTop=0;history.replaceState(null,'',`#case/${id}`);document.body.style.overflow='hidden';
 caseContent.querySelector('[data-next]').addEventListener('click',e=>renderCase(e.currentTarget.dataset.next));
}

function openCase(id){renderCase(id)}
function closeCase(){if(dlg.open)dlg.close();document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search+'#work')}
closeBtn.addEventListener('click',closeCase);
dlg.addEventListener('cancel',e=>{e.preventDefault();closeCase()});
function route(){const m=location.hash.match(/^#case\/(.+)$/);if(m&&projects[m[1]])renderCase(m[1])}
window.addEventListener('hashchange',route);route();
</script></body></html>
