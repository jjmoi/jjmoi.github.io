<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JJ — Hover Depth Stack MVP</title>
<style>
  * {
    box-sizing: border-box;
    font-family: Helvetica, Arial, sans-serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-style: normal;
    margin: 0;
    padding: 0;
    font-size: 15px;
    line-height: 1.35;
    text-transform: uppercase;
    color: #000;
  }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    background: #fff;
  }

  body {
    overflow-x: hidden;
  }

  a {
    color: #000;
    text-decoration: none;
  }

  .container {
    width: 98%;
    margin-left: auto;
    margin-right: auto;
  }

  .row {
    position: relative;
    width: 100%;
  }

  .row::after {
    content: "";
    display: table;
    clear: both;
  }

  .col {
    float: left;
    min-height: .125rem;
  }

  .col-1 { width: 10%; }
  .col-2 { width: 20%; }
  .col-4 { width: 40%; }
  .col-5 { width: 50%; }
  .col-10 { width: 100%; }
  .right { text-align: right; }

  /* Matches the current jjmoi.com desktop navigation geometry. */
  .nav a {
    padding-top: 60px;
    line-height: 0;
  }

  .desktop { display: block; }
  .rwd { display: none; }

  .project {
    margin-top: 75px;
    margin-bottom: 200px;
  }

  .project-stage-link {
    display: block;
    width: 100%;
  }

  .project-stage {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
    border-radius: 2rem;
    background: #f3f3f3;
    cursor: pointer;
    isolation: isolate;
  }

  .cover {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    opacity: 1;
    transform: scale(1);
    filter: blur(0);
    transition:
      opacity 420ms cubic-bezier(.22,.61,.36,1),
      transform 760ms cubic-bezier(.22,.61,.36,1),
      filter 520ms ease;
    z-index: 1;
  }

  .stack {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }

  .fragment {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--w);
    height: auto;
    display: block;
    opacity: 0;
    transform: translate(-50%, -50%) scale(.58) rotate(0deg);
    transform-origin: 50% 50%;
    filter: blur(12px);
    box-shadow: 0 14px 38px rgba(0,0,0,.06);
    transition:
      left 920ms cubic-bezier(.16,1,.3,1),
      top 920ms cubic-bezier(.16,1,.3,1),
      transform 920ms cubic-bezier(.16,1,.3,1),
      opacity 360ms ease,
      filter 720ms ease;
    transition-delay: 0ms;
    will-change: left, top, transform, opacity, filter;
  }

  .fragment:nth-child(1) { z-index: 8; }
  .fragment:nth-child(2) { z-index: 5; }
  .fragment:nth-child(3) { z-index: 7; }
  .fragment:nth-child(4) { z-index: 4; }
  .fragment:nth-child(5) { z-index: 6; }
  .fragment:nth-child(6) { z-index: 3; }
  .fragment:nth-child(7) { z-index: 2; }

  @media (hover: hover) and (pointer: fine) {
    .project-stage:hover .cover,
    .project-stage:focus-within .cover {
      opacity: .08;
      transform: scale(.985);
      filter: blur(3px);
    }

    .project-stage:hover .fragment,
    .project-stage:focus-within .fragment,
    .project-stage.is-open .fragment {
      left: var(--x);
      top: var(--y);
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(var(--r));
      filter: blur(0);
    }

    .project-stage:hover .fragment:nth-child(1),
    .project-stage:focus-within .fragment:nth-child(1) { transition-delay: 15ms; }
    .project-stage:hover .fragment:nth-child(2),
    .project-stage:focus-within .fragment:nth-child(2) { transition-delay: 55ms; }
    .project-stage:hover .fragment:nth-child(3),
    .project-stage:focus-within .fragment:nth-child(3) { transition-delay: 95ms; }
    .project-stage:hover .fragment:nth-child(4),
    .project-stage:focus-within .fragment:nth-child(4) { transition-delay: 135ms; }
    .project-stage:hover .fragment:nth-child(5),
    .project-stage:focus-within .fragment:nth-child(5) { transition-delay: 175ms; }
    .project-stage:hover .fragment:nth-child(6),
    .project-stage:focus-within .fragment:nth-child(6) { transition-delay: 215ms; }
    .project-stage:hover .fragment:nth-child(7),
    .project-stage:focus-within .fragment:nth-child(7) { transition-delay: 255ms; }
  }

  .project-meta {
    display: block;
    margin-top: 0;
  }

  .project-meta p {
    padding-top: 6px;
  }

  .project-meta:hover p {
    color: orangered;
  }

  .hint {
    position: absolute;
    right: 20px;
    bottom: 18px;
    z-index: 20;
    opacity: .42;
    pointer-events: none;
    transition: opacity 220ms ease;
  }

  .project-stage:hover .hint {
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .cover, .fragment { transition: none; }
  }

  @media only screen and (max-width: 1111px) {
    .desktop { display: none; }
    .rwd { display: block; }
    .container.rwd { width: 92%; }
    .nav a { padding-top: 30px; }
    .col-9-sm { width: 90%; float: left; }
    .col-1-sm { width: 10%; float: left; }
    .project {
      width: 92%;
      margin-top: 60px;
      margin-bottom: 120px;
    }
    .project-stage {
      aspect-ratio: 4 / 3;
      border-radius: 1.375rem;
    }
    .project-meta .mobile-copy { width: 90%; float:left; }
    .project-meta .mobile-arrow { width: 10%; float:left; text-align:right; }
    .project-meta p { padding-top: 2px; }
    .hint { display:none; }
  }
</style>
</head>
<body>
  <div class="container nav desktop">
    <div class="row">
      <div class="col col-5"><a href="https://www.jjmoi.com/">JJ</a></div>
      <div class="col col-2"><a href="https://www.jjmoi.com/">-1 → 0</a></div>
      <div class="col col-1 right"><a href="https://www.google.com/maps/place/Portland,+OR/@45.5161077,-122.7368012,12z">45°N 122°W</a></div>
      <div class="col col-1 right"><a href="https://www.jjmoi.com/thoughts">Thoughts</a></div>
      <div class="col col-1 right"><a href="https://www.jjmoi.com/info">Info</a></div>
    </div>
  </div>

  <div class="container nav rwd">
    <div class="row">
      <div class="col-9-sm"><a href="https://www.jjmoi.com/">JJ</a></div>
      <div class="col-1-sm right"><a href="https://www.jjmoi.com/info">Info</a></div>
    </div>
  </div>

  <main class="container project">
    <a class="project-stage-link" href="https://www.jjmoi.com/cerebras" aria-label="Open Cerebras case study">
      <div class="project-stage" id="projectStage">
        <img class="cover" src="https://jjmoi.com/cerebras/cerebras-99.webp" alt="Cerebras project cover">

        <div class="stack" aria-hidden="true">
          <img class="fragment" src="assets/cerebras-case-01.jpg" style="--x:24%;--y:30%;--w:27%;--r:-2.4deg" alt="">
          <img class="fragment" src="assets/cerebras-case-02.jpg" style="--x:48%;--y:24%;--w:20%;--r:1.6deg" alt="">
          <img class="fragment" src="assets/cerebras-case-03.jpg" style="--x:69%;--y:34%;--w:24%;--r:-1deg" alt="">
          <img class="fragment" src="assets/cerebras-case-04.jpg" style="--x:34%;--y:68%;--w:22%;--r:1.3deg" alt="">
          <img class="fragment" src="assets/cerebras-case-05.jpg" style="--x:57%;--y:61%;--w:29%;--r:-1.7deg" alt="">
          <img class="fragment" src="assets/cerebras-case-06.jpg" style="--x:78%;--y:70%;--w:17%;--r:2.2deg" alt="">
          <img class="fragment" src="assets/cerebras-case-07.jpg" style="--x:15%;--y:65%;--w:15%;--r:-.8deg" alt="">
        </div>

        <span class="hint">Hover to open project</span>
      </div>
    </a>

    <a class="row project-meta desktop" href="https://www.jjmoi.com/cerebras">
      <div class="col col-5"><p>Cerebras</p></div>
      <div class="col col-4"><p>Building the world’s fastest AI</p></div>
      <div class="col col-1 right"><p>→</p></div>
    </a>

    <a class="row project-meta rwd" href="https://www.jjmoi.com/cerebras">
      <div class="mobile-copy"><p>Cerebras<br>Building the world’s fastest AI</p></div>
      <div class="mobile-arrow"><p>→</p></div>
    </a>
  </main>

<script>
  const stage = document.getElementById('projectStage');
  const coarse = window.matchMedia('(hover: none), (pointer: coarse)');

  if (coarse.matches) {
    const link = stage.closest('a');
    let open = false;
    link.addEventListener('click', (event) => {
      if (!open) {
        event.preventDefault();
        open = true;
        stage.classList.add('is-open');
        stage.querySelector('.cover').style.opacity = '.08';
        stage.querySelector('.cover').style.transform = 'scale(.985)';
        stage.querySelectorAll('.fragment').forEach((el) => {
          el.style.left = getComputedStyle(el).getPropertyValue('--x');
          el.style.top = getComputedStyle(el).getPropertyValue('--y');
          el.style.opacity = '1';
          el.style.filter = 'blur(0)';
          el.style.transform = `translate(-50%, -50%) scale(1) rotate(${getComputedStyle(el).getPropertyValue('--r')})`;
        });
      }
    });
  }
</script>
</body>
</html>
