<script>const projects={

    hero:'assets/tachyus-hero.jpg', images:['assets/tachyus-case-01.jpg','assets/tachyus-case-02.jpg','assets/tachyus-case-03.jpg','assets/tachyus-case-04.jpg','assets/tachyus-case-05.jpg','assets/tachyus-case-06.jpg','assets/tachyus-case-07.jpg'],

const collage=[
 {src:'assets/collage-lumiflow-01.jpg',project:'lumiflow',x:35,y:4,w:15,r:-1,z:5},
 {src:'assets/collage-tachyus-01.jpg',project:'tachyus',x:54,y:8,w:10,r:0,z:3},
 {src:'assets/collage-tachyus-02.jpg',project:'tachyus',x:64,y:10,w:17,r:1,z:2},
 {src:'assets/collage-cerebras-01.jpg',project:'cerebras',x:21,y:31,w:24,r:0,z:9},
 {src:'assets/collage-cerebras-02.jpg',project:'cerebras',x:55,y:33,w:19,r:0,z:8},
 {src:'assets/collage-lumiflow-02.jpg',project:'lumiflow',x:44,y:51,w:14,r:-1,z:7},
 {src:'assets/collage-tachyus-03.jpg',project:'tachyus',x:58,y:55,w:10,r:0,z:10},
 {src:'assets/collage-lumiflow-03.jpg',project:'lumiflow',x:73,y:39,w:14,r:1,z:11},
 {src:'assets/collage-tachyus-04.jpg',project:'tachyus',x:83,y:59,w:8,r:0,z:6},
 {src:'assets/collage-cerebras-03.jpg',project:'cerebras',x:67,y:58,w:17,r:0,z:12},
 {src:'assets/collage-lumiflow-04.jpg',project:'lumiflow',x:29,y:61,w:18,r:0,z:13},
 {src:'assets/collage-tachyus-05.jpg',project:'tachyus',x:12,y:10,w:19,r:-1,z:1},
 {src:'assets/collage-cerebras-04.jpg',project:'cerebras',x:12,y:61,w:14,r:1,z:4},
 {src:'assets/collage-lumiflow-05.jpg',project:'lumiflow',x:40,y:72,w:11,r:-1,z:14},
 {src:'assets/collage-tachyus-06.jpg',project:'tachyus',x:75,y:9,w:15,r:0,z:15}
];

const canvas=document.querySelector('#canvas');
const dlg=document.querySelector('#caseStudy');
const caseContent=document.querySelector('#caseContent');
const closeBtn=document.querySelector('.close');
const projectTooltip=document.createElement('div');
projectTooltip.className='project-tooltip';
projectTooltip.setAttribute('role','tooltip');
canvas.appendChild(projectTooltip);
let hoveredProject=null;
const storageKey='collagePositions';
const modeStorageKey='collageLayoutModes';
const CLICK_DELAY=280;
let currentBucket=viewportBucket();
let allLayouts={};
let saved={};
let layoutModes={};
let layoutMode='randomized';
let arrangeMode=false;
let manualDragOccurred=false;
let topZ=30;
let lastSourceId=null;
let homeScrollY=0;
let worldState=null;
let transitionBusy=false;
const WORLD_IN_MS=810;
const WORLD_OUT_MS=705;

function viewportBucket(){
  const w=window.innerWidth,h=window.innerHeight;
  const wb=w<760?'mobile':w<1100?'compact':w<1450?'laptop':w<1800?'desktop':'wide';
  const hb=h<720?'short':h<980?'standard':'tall';
  return `${wb}-${hb}`;
}
function readLayouts(){
  try{
    const parsed=JSON.parse(localStorage.getItem(storageKey)||'{}')||{};
    const legacy=Object.keys(parsed).some(k=>/^img\d+$/.test(k));
    allLayouts=legacy?{[currentBucket]:parsed}:parsed;
  }catch(e){allLayouts={}}
  try{layoutModes=JSON.parse(localStorage.getItem(modeStorageKey)||'{}')||{}}catch(e){layoutModes={}}
  saved=allLayouts[currentBucket]||{};
  layoutMode=layoutModes[currentBucket]||'randomized';
  arrangeMode=layoutMode.startsWith('arranged');
}
function writeLayouts(){
  allLayouts[currentBucket]=saved;
  localStorage.setItem(storageKey,JSON.stringify(allLayouts));
}
function writeLayoutMode(mode){
  layoutMode=mode;
  arrangeMode=mode.startsWith('arranged');
  layoutModes[currentBucket]=mode;
  localStorage.setItem(modeStorageKey,JSON.stringify(layoutModes));
}
function savePiece(el){
  const id=el.dataset.imageId||el.id;
  saved[id]={x:Math.round(el.offsetLeft),y:Math.round(el.offsetTop),zIndex:Number(el.style.zIndex)||Number(el.dataset.baseZ)||1};
  writeLayouts();
}
function setArrangeMode(on){writeLayoutMode(on?'arranged':'randomized');}
function applyBucketLayout(){
  saved=allLayouts[currentBucket]||{};
  topZ=30;
  if(layoutMode!=='grid-randomized')clearGridSizing?.();
  canvas.querySelectorAll('.piece').forEach(el=>{
    const item=collage[Number(el.dataset.index)];
    const pos=saved[el.dataset.imageId];
    el.style.removeProperty('left');el.style.removeProperty('top');
    if(pos&&Number.isFinite(pos.x)&&Number.isFinite(pos.y)){
      el.style.left=pos.x+'px';el.style.top=pos.y+'px';
      el.style.removeProperty('--x');el.style.removeProperty('--y');
      el.style.zIndex=Number(pos.zIndex)||item.z;
    }else{
      el.style.setProperty('--x',item.x+'%');el.style.setProperty('--y',item.y+'%');
      el.style.zIndex=item.z;
    }
    topZ=Math.max(topZ,Number(el.style.zIndex)||item.z||1);
  });
  if(layoutMode==='grid-randomized'){
    requestAnimationFrame(()=>{
      const cr=canvas.getBoundingClientRect();
      const pieces=[...canvas.querySelectorAll('.piece')];
      const {cols,rows}=gridDimensions(pieces.length,cr.width,cr.height);
      const padX=Math.max(28,cr.width*.035),padY=Math.max(24,cr.height*.055);
      const cellW=(cr.width-padX*2)/cols,cellH=(cr.height-padY*2)/rows;
      pieces.forEach(el=>{
        const img=el.querySelector('img');
        const ratio=(img?.naturalWidth&&img?.naturalHeight)?img.naturalWidth/img.naturalHeight:(el.getBoundingClientRect().width/Math.max(1,el.getBoundingClientRect().height));
        el.style.width=Math.round(Math.max(56,Math.min(cellW*.72,cellH*.68*ratio)))+'px';
      });
    });
  }
}
function bringToFront(el,persist=true){
  topZ+=1;el.style.zIndex=topZ;if(persist)savePiece(el);
}
function clearGridSizing(){
  canvas.querySelectorAll('.piece').forEach(el=>el.style.removeProperty('width'));
}
function shuffle(items){
  const out=[...items];
  for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}
  return out;
}
function gridDimensions(count,width,height){
  let best={cols:count,rows:1,score:Infinity};
  const target=Math.max(.25,width/Math.max(1,height));
  for(let rows=1;rows<=count;rows++){
    if(count%rows)continue;
    const cols=count/rows;
    const score=Math.abs(Math.log((cols/rows)/target));
    if(score<best.score)best={cols,rows,score};
  }
  return best;
}

function gridRandomizeLayout(){

  const padX=Math.max(28,cr.width*.035),padY=Math.max(24,cr.height*.055);

function autoArrangeRandomized(){
  clearGridSizing();
  const cr=canvas.getBoundingClientRect();
  const regions={
    cerebras:{x:.04,y:.08,w:.31,h:.72},
    lumiflow:{x:.345,y:.18,w:.31,h:.72},
    tachyus:{x:.65,y:.07,w:.31,h:.72}

    group.forEach(el=>{
      const bounds=safePlacementBounds(el,cr,18);
      const regionLeft=cr.width*region.x;
      const regionTop=cr.height*region.y;
      const regionRight=regionLeft+cr.width*region.w;
      const regionBottom=regionTop+cr.height*region.h;
      let minX=Math.max(bounds.minX,regionLeft);
      let maxX=Math.min(bounds.maxX,regionRight-el.offsetWidth);
      let minY=Math.max(bounds.minY,regionTop);
      let maxY=Math.min(bounds.maxY,regionBottom-el.offsetHeight);
      if(maxX<minX){minX=bounds.minX;maxX=bounds.maxX}
      if(maxY<minY){minY=bounds.minY;maxY=bounds.maxY}
      const x=randomInRange(minX,maxX);

function safePlacementBounds(el,cr,margin=18){
  const rect=el.getBoundingClientRect();
  const layoutLeft=el.offsetLeft;
  const layoutTop=el.offsetTop;
  // getBoundingClientRect includes rotation; these offsets describe how far the
  // rotated visual extends beyond the element's untransformed layout box.
  const visualOffsetX=(rect.left-cr.left)-layoutLeft;
  const visualOffsetY=(rect.top-cr.top)-layoutTop;
  let minX=margin-visualOffsetX;
  let maxX=cr.width-margin-visualOffsetX-rect.width;
  let minY=margin-visualOffsetY;
  let maxY=cr.height-margin-visualOffsetY-rect.height;
  if(maxX<minX){const centered=(cr.width-el.offsetWidth)/2;minX=maxX=centered}
  if(maxY<minY){const centered=(cr.height-el.offsetHeight)/2;minY=maxY=centered}
  return {minX,maxX,minY,maxY};
}
function randomInRange(min,max){return min+Math.random()*Math.max(0,max-min)}

function runHomepageLoadAnimation(){
  const pieces=[...canvas.querySelectorAll('.piece')];
  pieces.forEach((el,i)=>{
    const r=collage[Number(el.dataset.index)].r||0;
    const isAnchor=i<INITIAL_VISIBLE_COUNT;
    el.style.removeProperty('opacity');
    const sequence=isAnchor ? [
      {opacity:1,filter:'blur(1.5px)',transform:`translate3d(0,8px,0) rotate(${r}deg) scale(.94)`},
      {opacity:1,filter:'blur(0)',transform:`translate3d(0,0,0) rotate(${r}deg) scale(1)`}
    ] : [
      {opacity:0,filter:'blur(10px)',transform:`translate3d(0,28px,0) rotate(${r}deg) scale(.76)`},
      {opacity:.72,filter:'blur(2px)',transform:`translate3d(0,7px,0) rotate(${r}deg) scale(.97)`,offset:.72},
      {opacity:1,filter:'blur(0)',transform:`translate3d(0,0,0) rotate(${r}deg) scale(1)`}
    ];
    const sequenceIndex=Math.max(0,i-INITIAL_VISIBLE_COUNT);
    const anim=el.animate(sequence,{
      duration:isAnchor?900:1500+((sequenceIndex%5)*90),
      delay:isAnchor?0:sequenceIndex*38,
      easing:'cubic-bezier(.18,.82,.2,1)',
      fill:'both'
    });
    anim.finished.finally(()=>{anim.cancel();el.style.removeProperty('pointer-events')});
  });
  const animatedCount=Math.max(1,pieces.length-INITIAL_VISIBLE_COUNT);
  const total=1500+(animatedCount-1)*38+360;
  setTimeout(finishHomepageLoad,total);
}

function enableDrag(el){
  let state=null,clickTimer=null;
  el.addEventListener('pointerdown',e=>{
    if(e.button!==undefined&&e.button!==0)return;
    clearTimeout(clickTimer);
    projectTooltip.classList.remove('visible');
    const r=el.getBoundingClientRect(),cr=canvas.getBoundingClientRect();
    const oldZ=Number(el.style.zIndex)||Number(el.dataset.baseZ)||1,tempZ=topZ+1;
    state={id:e.pointerId,startX:e.clientX,startY:e.clientY,left:r.left-cr.left,top:r.top-cr.top,moved:false,oldZ,tempZ};
    el.style.zIndex=tempZ;el.classList.add('dragging');el.setPointerCapture(e.pointerId);e.preventDefault();
  });
  el.addEventListener('pointermove',e=>{
    if(!state||state.id!==e.pointerId)return;
    const dx=e.clientX-state.startX,dy=e.clientY-state.startY;if(dx===0&&dy===0)return;state.moved=true;
    const cr=canvas.getBoundingClientRect(),er=el.getBoundingClientRect();
    const x=Math.min(cr.width-24,Math.max(-er.width+24,state.left+dx)),y=Math.min(cr.height-24,Math.max(-er.height+24,state.top+dy));
    el.style.left=x+'px';el.style.top=y+'px';el.style.removeProperty('--x');el.style.removeProperty('--y');
  });
  el.addEventListener('pointerup',e=>{
    if(!state||state.id!==e.pointerId)return;
    const moved=state.moved,oldZ=state.oldZ,tempZ=state.tempZ;el.classList.remove('dragging');
    if(moved){manualDragOccurred=true;topZ=Math.max(topZ,tempZ);writeLayoutMode('custom');savePiece(el)}
    else{el.style.zIndex=oldZ;clickTimer=setTimeout(()=>openCase(el.dataset.project,el),CLICK_DELAY)}
    state=null;
  });
  el.addEventListener('pointercancel',()=>{if(state)el.style.zIndex=state.oldZ;state=null;el.classList.remove('dragging')});
  el.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();clearTimeout(clickTimer);bringToFront(el,true)});
  el.addEventListener('click',e=>e.preventDefault());
}

 <section class="case-hero"><div class="case-title"><div class="case-kicker">${p.num} / CASE STUDY</div><h1>${p.title}</h1><div class="case-tags">${p.tags}</div><div class="case-dek">${p.dek}</div></div><div class="hero-visual"><img src="${p.hero}" alt="${p.title} hero visual"></div></section>
 <section class="section"><div class="section-label">01 / CONTEXT</div><div class="section-body"><h2>Start with the system, not the screen.</h2><div class="copy-grid"><p>${p.context}</p><p>${p.problem}</p></div><div class="metrics"><div class="metric"><strong>3×</strong><span>PLACEHOLDER IMPROVEMENT</span></div><div class="metric"><strong>42%</strong><span>PLACEHOLDER REDUCTION</span></div><div class="metric"><strong>08</strong><span>CORE WORKFLOWS</span></div></div></div></section>
 <section class="section"><div class="section-label">02 / EVIDENCE</div><div class="section-body"><h2>Build the story from artifacts.</h2><p>Placeholder imagery can hold interface states, research evidence, environmental context, hardware, diagrams, or process fragments. The layout intentionally behaves more like an evidence wall than a conventional gallery.</p><div class="visual-grid"><img src="${imgs[0]}" alt="${p.title} visual"><img src="${imgs[1]||imgs[0]}" alt="${p.title} detail"><img src="${imgs[2]||imgs[0]}" alt="${p.title} detail"></div></div></section>
 <section class="section"><div class="section-label">03 / MODEL</div><div class="section-body"><h2>Expose how the product fits together.</h2><p>A system diagram gives the reader a quick mental model before introducing individual screens. Replace this placeholder with the real architecture, actors, inputs, decision points, and outputs.</p>${diagramSVG(p.accent)}</div></section>
 <section class="section"><div class="section-label">04 / PRODUCT</div><div class="section-body"><h2>Show the interface at working scale.</h2><p>The case study can alternate between real screenshots and abstracted interface diagrams. Dense screens deserve enough space to be understood rather than compressed into decorative thumbnails.</p>${uiBoard(p.accent)}</div></section>
 <section class="section"><div class="section-label">05 / DETAIL</div><div class="section-body"><h2>Zoom from system to decision.</h2><p>${p.system}</p><div class="visual-grid"><img src="${imgs[3]||imgs[0]}" alt="${p.title} project detail"><img src="${imgs[4]||imgs[1]||imgs[0]}" alt="${p.title} project detail"><img src="${imgs[5]||imgs[2]||imgs[0]}" alt="${p.title} project detail"></div></div></section>
 <section class="section"><div class="section-label">06 / SIGNAL</div><div class="section-body"><h2>Let data carry part of the argument.</h2><p>Use graphs for the part of the case study that needs evidence. These values are intentionally illustrative placeholders, ready to be replaced with actual product or research metrics.</p>${chartSVG(p.accent)}</div></section>
 <section class="section"><div class="section-label">07 / SYSTEM</div><div class="section-body"><h2>A small language that scales.</h2><p>Placeholder system primitives show how color, typography, spacing, data visualization, and reusable components can be documented without turning the case study into a component catalog.</p><div class="system-grid" style="--accent:${p.accent}"><div class="system-card"><div class="swatch"></div><strong>Signal</strong><small>ACCENT / EMPHASIS</small></div><div class="system-card"><div class="swatch"></div><strong>Surface</strong><small>LAYERS / STATES</small></div><div class="system-card"><div class="swatch"></div><strong>Contrast</strong><small>HIERARCHY / FOCUS</small></div><div class="system-card"><div class="swatch"></div><strong>Range</strong><small>TOKENS / SCALE</small></div></div></div></section>
 <section class="section"><div class="section-label">08 / PROCESS</div><div class="section-body"><h2>Keep the path visible.</h2><p>Placeholder process content can show how the work moved from ambiguity through research, framing, prototyping, validation, and systemization.</p><div class="timeline"><div class="step"><b>01</b><strong>Frame</strong><p>Define the decisions that matter before producing interface volume.</p></div><div class="step"><b>02</b><strong>Observe</strong><p>Gather behavior, constraints, evidence, and technical context.</p></div><div class="step"><b>03</b><strong>Model</strong><p>Map the system and expose the highest leverage relationships.</p></div><div class="step"><b>04</b><strong>Prototype</strong><p>Test interaction and hierarchy at realistic density.</p></div><div class="step"><b>05</b><strong>Scale</strong><p>Turn successful patterns into reusable product language.</p></div></div></div></section>
 <section class="section"><div class="section-label">09 / OUTCOME</div><div class="section-body"><div class="quote">“${p.outcome}”</div><img class="full-image" src="${imgs[6]||imgs[0]}" alt="${p.title} concluding visual"></div></section>
 <section class="next"><div class="section-label">NEXT PROJECT</div><button type="button" data-next="${nextId}"><span class="eyebrow">${next.num} / ${next.tags}</span><img src="${next.hero}" alt="Open ${next.title} case study"><h2>${next.title} →</h2></button></section>
 </article>`;
 const wasOpen=dlg.open;
 if(!wasOpen){
   dlg.classList.remove('case-visible');
   dlg.showModal();
   requestAnimationFrame(()=>requestAnimationFrame(()=>dlg.classList.add('case-visible')));
 }else{dlg.classList.add('case-visible')}
 dlg.scrollTop=0;history.replaceState(null,'',`#case/${id}`);document.body.style.overflow='hidden';
 caseContent.querySelector('[data-next]').addEventListener('click',e=>renderCase(e.currentTarget.dataset.next));
 caseContent.querySelector('.hero-visual img')?.addEventListener('dblclick',e=>{e.preventDefault();e.stopPropagation();closeCase()});
}

function openCase(id,sourceEl){
 if(transitionBusy)return;
 homeScrollY=window.scrollY;lastSourceId=sourceEl?.id||null;
 if(sourceEl&&!dlg.open)enterProjectWorld(id,sourceEl,()=>renderCase(id));
 else renderCase(id);
}
function closeCase(){
 if(dlg.open)dlg.close();dlg.classList.remove('case-visible');document.body.style.overflow='';history.replaceState(null,'',location.pathname+location.search+'#work');
 requestAnimationFrame(()=>{
   window.scrollTo({top:homeScrollY,left:0,behavior:'auto'});
   if(worldState)exitProjectWorld();
   else if(lastSourceId)document.getElementById(lastSourceId)?.focus({preventScroll:true});
 });
}
closeBtn.addEventListener('click',closeCase);
dlg.addEventListener('cancel',e=>{e.preventDefault();closeCase()});
function route(){const m=location.hash.match(/^#case\/(.+)$/);if(m&&projects[m[1]]&&!dlg.open)renderCase(m[1])}
window.addEventListener('hashchange',route);route();
</script></body></html>
