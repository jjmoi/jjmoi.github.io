<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="robots" content="noindex"> <!-- No bots indexing -->
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<link rel="shortcut icon" type="image/x-icon" href="lightcone.png">
	<title>Lightcone Ventures</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		.instrument-serif-regular {
			font-family: "Instrument Serif", serif;
			font-weight: 400;
			font-style: normal;
		}

		.instrument-serif-regular-italic {
			font-family: "Instrument Serif", serif;
			font-weight: 400;
			font-style: italic;
		}

		:root {
			--background: hsl(240, 2%, 8%);
			--foreground: hsl(0, 0%, 98%);
			--border: hsl(0, 0%, 20%);
			--inset: min(2vw, 1.5rem);
			--sides: 1rem;
			--font-instrument-serif: "Instrument Serif", Georgia, serif;
		}

		body {
			background-color: white;
			color: var(--foreground);
			font-family: var(--font-instrument-serif);
			overflow: hidden;
		}

		main {
			padding: var(--inset);
			height: 100dvh;
			width: 100%;
		}

		.container {
			position: relative;
			height: 100%;
			width: 100%;
		}

		/* Add placeholder styling with smooth fade transitions */
		.background-placeholder {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 42px;
			background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
			transition: opacity 0.5s ease-in-out;
		}

		.background-placeholder.hidden {
			opacity: 0;
			pointer-events: none;
		}

		.background {
			position: absolute;
			left: 0;
			top: 0;
			width: 100%;
			height: 100%;
			object-fit: cover;
			border-radius: 42px;
			opacity: 0;
			transition: opacity 0.5s ease-in-out;
		}

		.background.loaded {
			opacity: 1;
		}

		@media (min-width: 768px) {
			.background,
			.background-placeholder {border-radius: 72px;}
		}

		.content {
			position: relative;
			display: flex;
			flex-direction: column;
			gap: 1rem;
			justify-content: center;
			align-items: center;
			padding-top: 2.5rem;
			width: 100%;
			height: 100%;
			overflow: hidden;
		}

		.logo {
			width: 50%;
			margin: 0 auto;
			display: block;
		}

		@media (min-width: 1024px) {
			.content {gap: 2rem;}
		}

		p {
			font-family: var(--font-instrument-serif);
			font-size: 3rem;
			text-align: center;
			transition: all 0.3s ease-out;
		}

		@media (min-width: 640px) {
			p {font-size: 3rem;}
		}

		@media (min-width: 1024px) {
			p {font-size: 4rem;}
		}

		.text-wrapper {
			display: flex;
			flex-direction: column;
			align-items: center;
			min-height: 0;
			flex-shrink: 1;
		}

		.text-content {
			display: flex;
			flex-direction: column;
			gap: 1rem;
			width: 100%;
			max-width: 42rem;
			opacity: 1;
			transform: scale(1);
			transition: all 0.3s ease-out;
		}

		p.caption {
			font-size: 1rem;
			line-height: 1.1;
			font-weight: 500;
			text-align: center;
			text-wrap: pretty;
			opacity: 0.8;
		}

		@media (min-width: 640px) {
			p.caption {font-size: 1.125rem;}
		}

		@media (min-width: 1024px) {
			p.caption {font-size: 1.25rem;}
			.text-content {gap: 2rem;}
		}
	</style>
</head>
<body>
	<main>
		<div class="container">
			<img id="placeholder" class="background-placeholder" src="now.png"
				alt="Now"/>
			<video id="bgVideo" class="background" muted playsinline loop preload="auto">
				<source src="now.mp4" type="video/mp4">
			</video>
			<div class="content">
				<div>
					<img src="lightcone-ventures.svg" alt="Lightcone Ventures" class="logo">
					<p class="">We invest in civilization scale deep tech</p>
				</div>
				<div class="text-wrapper">
					<div class="text-content">
						<p class="caption">©MMXXVI Lightcone Ventures</p>
					</div>
				</div>
			</div>
		</div>
	</main>
	<script>
		(function() {
			const video = document.getElementById('bgVideo');
			const placeholder = document.getElementById('placeholder');
			
			// Track if video has successfully loaded
			let videoLoaded = false;

			function onVideoLoaded() {
				if (videoLoaded) return;
				videoLoaded = true;
				
				// Fade in video and fade out placeholder
				video.classList.add('loaded');
				placeholder.classList.add('hidden');
				
				// Start playing video
				video.play().catch(function(error) {
					console.log('Video autoplay failed:', error);
				});
			}

			// Listen for multiple video ready events for better compatibility
			video.addEventListener('loadeddata', onVideoLoaded);
			video.addEventListener('canplay', onVideoLoaded);
			video.addEventListener('canplaythrough', onVideoLoaded);
			
			// Check if video is already loaded (cached)
			if (video.readyState >= 2) {
				onVideoLoaded();
			}

			// Attempt to load the video
			video.load();

			// Fallback: If video fails to load after 3 seconds, just hide placeholder
			setTimeout(function() {
				if (!videoLoaded) {
					placeholder.classList.add('hidden');
				}
			}, 3000);
		})();
	</script>
</body>
</html>
